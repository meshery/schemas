openapi: 3.0.0
info:
  title: Organization SMTP Configuration
  description: >-
    OpenAPI schema for per-organization outbound mail. A Cloud deployment ships
    with one shared SMTP relay owned by the provider organization, so every
    message - whichever tenant it concerns - leaves from the provider's domain.
    These operations let an organization register its own mail server and
    credentials instead, so that every email whose reader belongs to that
    organization is delivered from the organization's own domain. This covers
    application notifications and identity-flow mail (account verification,
    password recovery) alike, because both are rendered and sent by Cloud.

    The configuration is stored on the same environment/connection/credential
    chain that bring-your-own identity providers already uses, under a second
    well-known environment name, so these operations are shaped around that
    chain: an environment that is provisioned and torn down as the
    organization's opt-in, a connection carrying the dial target and the
    message identity, and a credential carrying only the password.

    These operations are deliberately NOT folded into the generic connection
    and credential operations. They exist to carry validation those cannot: the
    internal-address screen, the submission-port allowlist, the from-domain
    proof, the refusal of the redaction sentinel and the classified test
    outcome. Reaching these rows through the generic operations would run none
    of it.

    The password is encrypted at rest and never returned. Mail is not routed
    through the server until control of its from domain has been proven, and a
    failing server falls back to the provider relay unless the organization has
    opted out.
  version: v1beta1
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []

tags:
  - name: OrganizationSmtp
    description: Operations on an organization's own outbound mail server.

paths:
  /api/orgs/{orgId}/environments/mail-relay:
    get:
      x-internal: ["cloud"]
      tags:
        - OrganizationSmtp
      operationId: getOrganizationSmtpEnvironment
      summary: Probe whether an organization has brought its own mail server
      description: >-
        Returns the organization's mail-relay environment when it exists. A 404
        is the ordinary answer for an organization using the provider's shared
        relay, and is not an error condition.
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: >-
            The organization has its own mail-relay environment. The canonical
            Environment shape, not a bespoke one: this endpoint returns an
            ordinary environment row that happens to carry the well-known name.
          content:
            application/json:
              schema:
                $ref: ../../v1beta3/environment/api.yml#/components/schemas/Environment
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    delete:
      x-internal: ["cloud"]
      tags:
        - OrganizationSmtp
      operationId: deleteOrganizationSmtpEnvironment
      summary: Remove an organization's mail server entirely
      description: >-
        Removes the configuration, its stored credential and the environment
        that held them, together. The organization's mail reverts to the
        provider's shared relay. Idempotent: removing an absent configuration
        succeeds.
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "204":
          description: The configuration was removed.
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/orgs/{orgId}/environments/mail-relay/connection:
    get:
      x-internal: ["cloud"]
      tags:
        - OrganizationSmtp
      operationId: getOrganizationSmtpConfiguration
      summary: Get an organization's SMTP configuration
      description: >-
        Returns the organization's mail server configuration, including its
        current status and from-domain verification state. The password is
        always the redaction sentinel `***`.
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: The organization's SMTP configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSmtpConfiguration"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - OrganizationSmtp
      operationId: createOrganizationSmtpConfiguration
      summary: Register an organization's SMTP server
      description: >-
        Creates the configuration, provisioning the mail-relay environment on
        the organization's behalf when it does not yet exist. This is the only
        operation that accepts the password alongside the settings; afterwards
        the two are written separately.

        The new configuration starts unproven, so mail continues to take the
        provider relay until the from domain is verified and a test delivery
        succeeds.
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        $ref: "#/components/requestBodies/organizationSmtpConfigurationPayload"
      responses:
        "201":
          description: The stored SMTP configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSmtpConfiguration"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
    put:
      x-internal: ["cloud"]
      tags:
        - OrganizationSmtp
      operationId: updateOrganizationSmtpConfiguration
      summary: Update an organization's SMTP settings
      description: >-
        Replaces the settings. The payload has no `password` property at all and
        rejects unknown properties, so this operation cannot carry a credential
        even by accident - rotating the password is a separate operation. That
        is what lets an administrator rename a display name without retyping a
        secret, while the redaction sentinel stays refused everywhere it can be
        written.

        Changing the from address to a different registrable domain resets
        from-domain verification and returns the configuration to `registered`.
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        $ref: "#/components/requestBodies/organizationSmtpSettingsPayload"
      responses:
        "200":
          description: The stored SMTP configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSmtpConfiguration"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/orgs/{orgId}/environments/mail-relay/connection/credential:
    put:
      x-internal: ["cloud"]
      tags:
        - OrganizationSmtp
      operationId: rotateOrganizationSmtpCredential
      summary: Rotate the password presented to an organization's SMTP server
      description: >-
        Replaces the stored password. The redaction sentinel `***` and the empty
        string are REFUSED with a 400 rather than treated as "leave it alone",
        so a client that echoes a read back cannot overwrite the credential with
        the sentinel.
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        $ref: "#/components/requestBodies/organizationSmtpCredentialPayload"
      responses:
        "200":
          description: The stored SMTP configuration, with the password redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSmtpConfiguration"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/orgs/{orgId}/environments/mail-relay/connection/enablement:
    post:
      x-internal: ["cloud"]
      tags:
        - OrganizationSmtp
      operationId: setOrganizationSmtpEnablement
      summary: Turn an organization's own mail server on or off
      description: >-
        The only operation by which an administrator writes the configuration's
        status, and it can write only the two administrative states: turning it
        off moves the configuration to `ignored`, and turning it on returns it
        to `registered` so that it must prove itself again before mail is
        routed. `connected` and `disconnected` are written by delivery outcomes
        alone and are never settable here, which is what keeps a deliberate
        opt-out distinguishable from a failing relay.

        Turning it on is refused with a 409 while the from domain is unverified.
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        $ref: "#/components/requestBodies/organizationSmtpEnablementPayload"
      responses:
        "200":
          description: The stored SMTP configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSmtpConfiguration"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /api/orgs/{orgId}/environments/mail-relay/connection/test:
    post:
      x-internal: ["cloud"]
      tags:
        - OrganizationSmtp
      operationId: testOrganizationSmtpConfiguration
      summary: Send a test message through an organization's SMTP configuration
      description: >-
        Delivers a real message through the configured server and reports a
        classified outcome. A real delivery rather than a connection probe on
        purpose: a server that connects and authenticates but refuses the
        sender or the recipient is the most common misconfiguration, and a
        probe reports it healthy.

        A successful test is also what promotes a verified configuration from
        `registered` to `connected`, so this operation is part of the lifecycle
        rather than a convenience. It takes the same permission as a write,
        because there is no read-only form of dialling an arbitrary host, and it
        is rate limited per organization.

        The recipient defaults to the calling administrator's own address. The
        outcome is a classification, never the remote server's own text.
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        $ref: "#/components/requestBodies/organizationSmtpTestRequest"
      responses:
        "200":
          description: The classified outcome of the delivery attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSmtpTestResult"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

  /api/orgs/{orgId}/environments/mail-relay/domain-verification:
    get:
      x-internal: ["cloud"]
      tags:
        - OrganizationSmtp
      operationId: getOrganizationSmtpDomainVerification
      summary: Get the from-domain verification challenge
      description: >-
        Returns the DNS record the organization must publish to prove control
        of its from domain, together with the current verification state. A
        from domain that matches the organization's own registered custom
        domain is already proven and needs no record.
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: The verification challenge and its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSmtpDomainChallenge"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - OrganizationSmtp
      operationId: verifyOrganizationSmtpDomain
      summary: Check the from-domain verification challenge
      description: >-
        Resolves the challenge record and records the result. Proving the
        domain is what permits mail to be routed through the organization's
        server. Rate limited per organization.
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: The outcome of the verification check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSmtpDomainChallenge"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"

components:
  responses:
    400:
      $ref: "../core/api.yml#/components/responses/400"
    401:
      $ref: "../core/api.yml#/components/responses/401"
    403:
      description: Caller lacks the permission key required for this organization
      content:
        text/plain:
          schema:
            type: string
    404:
      $ref: "../core/api.yml#/components/responses/404"
    409:
      description: >-
        The configuration already exists, or the requested state transition is
        refused in the configuration's current state
      content:
        text/plain:
          schema:
            type: string
    429:
      description: Too many attempts for this organization
      content:
        text/plain:
          schema:
            type: string
    500:
      $ref: "../core/api.yml#/components/responses/500"

  parameters:
    orgId:
      name: orgId
      in: path
      description: Organization ID
      required: true
      schema:
        $ref: ../core/api.yml#/components/schemas/uuid

  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  requestBodies:
    organizationSmtpConfigurationPayload:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationSmtpConfigurationPayload"
    organizationSmtpSettingsPayload:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationSmtpSettingsPayload"
    organizationSmtpCredentialPayload:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationSmtpCredentialPayload"
    organizationSmtpEnablementPayload:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationSmtpEnablementPayload"
    organizationSmtpTestRequest:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationSmtpTestRequest"

  schemas:
    OrganizationSmtpConfiguration:
      $ref: "./organization_smtp.yaml"

    OrganizationSmtpConfigurationPayload:
      type: object
      additionalProperties: false
      description: >-
        Everything needed to register an organization's mail server, settings
        and password together, so that registration is one operation. Accepted
        only on create; afterwards the settings and the credential are written
        by separate operations.

        `status`, the delivery counters behind it, the from-domain proof and the
        timestamps are all server-owned and are not accepted here. A new
        configuration therefore always starts at `registered`, whatever the
        caller sends.
      required:
        - host
        - port
        - fromAddress
      properties:
        host:
          type: string
          description: Hostname of the organization's SMTP server.
          minLength: 1
          maxLength: 253
          x-order: 1
          x-go-type-skip-optional-pointer: true
        port:
          type: integer
          description: >-
            TCP port the organization's SMTP server listens on. Restricted
            further by a submission-port allowlist.
          minimum: 1
          maximum: 65535
          default: 587
          x-order: 2
          x-go-type-skip-optional-pointer: true
        encryption:
          type: string
          description: >-
            Transport encryption to negotiate. `starttls` upgrades a cleartext
            connection (typically port 587), `tls` opens an implicit TLS
            connection (typically port 465), and `none` sends in cleartext.
          enum:
            - starttls
            - tls
            - none
          default: starttls
          x-order: 3
          x-go-type-skip-optional-pointer: true
        authMechanism:
          type: string
          description: >-
            SMTP authentication mechanism. Any mechanism other than `none`
            requires both a username and a password.
          enum:
            - plain
            - cram-md5
            - none
          default: plain
          x-order: 4
          x-go-type-skip-optional-pointer: true
        username:
          type: string
          description: >-
            Username presented to the organization's SMTP server. Required by
            the server, together with `password`, for every `authMechanism`
            other than `none`; see that property for why the pairing is a
            server-enforced contract rather than a schema constraint.
          maxLength: 320
          x-order: 5
          x-oapi-codegen-extra-tags:
            json: username,omitempty
        password:
          type: string
          description: >-
            Password presented to the organization's SMTP server. The server
            requires it, together with `username`, for every `authMechanism`
            other than `none`, and answers 400 when either is missing.

            That rule is deliberately NOT encoded in `required` or as a
            `oneOf`/`if`-`then`. Both encodings were measured against the
            generator: `if`/`then` collapses this payload to `interface{}`, and
            `oneOf` injects a `union json.RawMessage` field with a custom
            marshaller, either of which costs every consumer its generated type
            or its wire behaviour to express a constraint the server enforces
            anyway. Treat this property as conditionally required by contract,
            not by schema.

            This is the ONLY operation that accepts the password alongside the
            settings, so that registering a mail server is one call and no
            configuration exists in a state where it is expected to send but
            holds no credential. Afterwards the password is written only by the
            rotation operation, never by the settings update, whose payload
            declares no `password` property at all.

            The redaction sentinel `***` is refused, and so is the empty string
            - omit the property instead of sending it empty, which the
            `minLength` below enforces so this payload and the rotation payload
            agree.
          minLength: 1
          maxLength: 512
          x-order: 6
          x-oapi-codegen-extra-tags:
            json: password,omitempty
        fromAddress:
          $ref: ../core/api.yml#/components/schemas/email
          description: Address the organization's mail is sent from.
          x-order: 7
        fromDisplayName:
          type: string
          description: Display name shown alongside the from address.
          maxLength: 255
          x-order: 8
          x-oapi-codegen-extra-tags:
            json: fromDisplayName,omitempty
        replyToAddress:
          $ref: ../core/api.yml#/components/schemas/email
          description: Address replies are directed to.
          x-order: 9
          x-oapi-codegen-extra-tags:
            json: replyToAddress,omitempty
        fallbackToProvider:
          type: boolean
          description: >-
            Whether a message this server fails to accept is re-sent through the
            provider's shared relay. Disabling it means a failure is a dropped
            message, account verification and password recovery included.
          default: true
          x-order: 10
          x-go-type-skip-optional-pointer: true

    OrganizationSmtpSettingsPayload:
      type: object
      additionalProperties: false
      description: >-
        Client-settable settings of an organization's mail server, WITHOUT the
        password. The omission is deliberate and structural: because this schema
        forbids unknown properties, a client cannot send a credential through
        this operation at all, so the read-then-write round trip that would
        otherwise overwrite a stored password with the redaction sentinel is not
        expressible. Rotate the password through its own operation.
      required:
        - host
        - port
        - fromAddress
      properties:
        host:
          type: string
          description: Hostname of the organization's SMTP server.
          minLength: 1
          maxLength: 253
          x-order: 1
          x-go-type-skip-optional-pointer: true
        port:
          type: integer
          description: >-
            TCP port the organization's SMTP server listens on. Restricted
            further by a submission-port allowlist.
          minimum: 1
          maximum: 65535
          default: 587
          x-order: 2
          x-go-type-skip-optional-pointer: true
        encryption:
          type: string
          description: Transport encryption to negotiate.
          enum:
            - starttls
            - tls
            - none
          default: starttls
          x-order: 3
          x-go-type-skip-optional-pointer: true
        authMechanism:
          type: string
          description: >-
            SMTP authentication mechanism. Changing this to a mechanism other
            than `none` while no password is stored is refused; rotate the
            credential first.
          enum:
            - plain
            - cram-md5
            - none
          default: plain
          x-order: 4
          x-go-type-skip-optional-pointer: true
        username:
          type: string
          description: Username presented to the organization's SMTP server.
          maxLength: 320
          x-order: 5
          x-oapi-codegen-extra-tags:
            json: username,omitempty
        fromAddress:
          $ref: ../core/api.yml#/components/schemas/email
          description: >-
            Address the organization's mail is sent from. Changing it to a
            different registrable domain resets from-domain verification.
          x-order: 6
        fromDisplayName:
          type: string
          description: Display name shown alongside the from address.
          maxLength: 255
          x-order: 7
          x-oapi-codegen-extra-tags:
            json: fromDisplayName,omitempty
        replyToAddress:
          $ref: ../core/api.yml#/components/schemas/email
          description: Address replies are directed to.
          x-order: 8
          x-oapi-codegen-extra-tags:
            json: replyToAddress,omitempty
        fallbackToProvider:
          type: boolean
          description: >-
            Whether a message this server fails to accept is re-sent through the
            provider's shared relay.
          default: true
          x-order: 9
          x-go-type-skip-optional-pointer: true

    OrganizationSmtpCredentialPayload:
      type: object
      additionalProperties: false
      description: >-
        The password presented to an organization's SMTP server. The only
        payload that carries it after creation.
      required:
        - password
      properties:
        password:
          type: string
          description: >-
            New password. The redaction sentinel `***` and the empty string are
            refused with a 400 rather than treated as "leave the stored value
            alone", so echoing a read back cannot erase the credential.
          minLength: 1
          maxLength: 512
          x-order: 1
          x-go-type-skip-optional-pointer: true

    OrganizationSmtpEnablementPayload:
      type: object
      additionalProperties: false
      description: >-
        Administrative on/off for an organization's own mail server. It cannot
        express the delivery-driven states, which are written by outcomes alone.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: >-
            True returns the configuration to `registered` so it may prove
            itself and carry mail; false moves it to `ignored`. Turning it on is
            refused while the from domain is unverified.
          x-order: 1
          x-go-type-skip-optional-pointer: true

    OrganizationSmtpTestRequest:
      type: object
      additionalProperties: false
      description: Options for a test delivery.
      properties:
        to:
          $ref: ../core/api.yml#/components/schemas/email
          description: >-
            Recipient of the test message. Defaults to the calling
            administrator's own address.
          x-order: 1
          x-oapi-codegen-extra-tags:
            json: to,omitempty

    OrganizationSmtpTestResult:
      type: object
      additionalProperties: false
      description: >-
        Classified outcome of a test delivery. Carries no text from the remote
        server, so a refusal reveals nothing about what the network can reach.
      required:
        - outcome
        - testedAt
      properties:
        outcome:
          type: string
          description: >-
            What happened. `delivered` means the server accepted the message;
            every other value names the stage that refused it.
          enum:
            - delivered
            - blocked_target
            - connect_refused
            - connect_timeout
            - tls_failed
            - starttls_unsupported
            - auth_rejected
            - relay_rejected_sender
            - relay_rejected_recipient
            - delivery_failed
            - credential_unreadable
          x-order: 1
          x-go-type-skip-optional-pointer: true
        message:
          type: string
          description: Human-readable summary of the outcome, drawn from a fixed set of phrasings.
          maxLength: 1000
          x-order: 2
          x-oapi-codegen-extra-tags:
            json: message,omitempty
        sentTo:
          $ref: ../core/api.yml#/components/schemas/email
          description: Address the test message was addressed to.
          x-order: 3
          x-oapi-codegen-extra-tags:
            json: sentTo,omitempty
        testedAt:
          type: string
          format: date-time
          description: When the delivery was attempted.
          x-go-type: time.Time
          x-order: 4
          x-go-type-skip-optional-pointer: true

    OrganizationSmtpDomainChallenge:
      type: object
      additionalProperties: false
      description: >-
        The DNS record proving control of an organization's from domain, and
        the current state of that proof.
      required:
        - domain
        - verified
        - method
      properties:
        domain:
          type: string
          description: Registrable domain the proof applies to.
          maxLength: 253
          x-order: 1
          x-go-type-skip-optional-pointer: true
        method:
          type: string
          description: >-
            How the domain is proven. `custom-domain` means it matches the
            organization's own registered custom domain and needs no record;
            `dns-txt` means the record below must be published.
          enum:
            - custom-domain
