openapi: 3.0.0
info:
  title: Diagnostics
  description: OpenAPI schema for anonymous, redacted failure diagnostics submitted by desktop clients.
  version: v1beta1
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

tags:
  - name: Diagnostics
    description: Operations related to failure diagnostics

paths:
  /api/diagnostics/failures:
    post:
      x-internal: ["cloud"]
      tags:
        - Diagnostics
      summary: Submit a failure diagnostic
      description: >-
        Accepts a small, anonymous, redacted diagnostic of a client-side
        failure, so maintainers learn about it before anyone writes in.
        Authentication is a per-client-kind, per-release-channel
        pre-shared key in the X-Client-Key header (a speed bump plus a
        revocation handle, not a strong secret: the key ships in the
        app and can be extracted). A signed-in caller may use its bearer
        token instead; then the organization is attached, and only then.
        The server enforces a body cap, strict decoding (unknown fields
        are rejected), rate limits, server-side re-redaction, and a
        90-day retention on stored rows. Served by Layer5 Cloud; see
        Blowhorn issue #771. This operation is declared schema-first:
        Cloud serves it in the step that follows this schema change.
      operationId: submitFailureDiagnostic
      security:
        - clientKey: []
        - jwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailureDiagnostic"
      responses:
        "201":
          description: Failure diagnostic submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid request format
        "401":
          $ref: "#/components/responses/401"
        "429":
          description: Rate limit exceeded; retry after the Retry-After interval
        "500":
          description: Internal server error

components:
  responses:
    401:
      $ref: "../core/api.yml#/components/responses/401"

  securitySchemes:
    clientKey:
      type: apiKey
      in: header
      name: X-Client-Key
      description: >-
        Per-client-kind, per-release-channel pre-shared key, of the form
        `<key id>.<secret>`. At least two keys are valid at any time so
        rotation never breaks old builds.
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    FailureDiagnostic:
      type: object
      description: >-
        A single anonymous, redacted report of a client-side failure.
        The same failure is deduplicated per install per day: one report
        carries the first time it was seen and how many times it has
        occurred since. Nothing in this report identifies a person: no
        config files, logs, account names, post text, or tokens, and the
        failure message keeps only the redacted cause sentence. Every
        object in this schema is closed (additionalProperties: false),
        so a client sending an unknown field gets a 400 rather than a
        silently widened report.
      additionalProperties: false
      required:
        - diagnosticId
        - occurredAt
        - firstSeenAt
        - count
        - client
        - os
        - failure
        - compat
      properties:
        diagnosticId:
          type: string
          title: Diagnostic ID
          format: uuid
          description: >-
            Id generated by the client for this report. A human support
            request links back to it through
            AnonymousSupportRequest.diagnosticId.
        occurredAt:
          type: string
          title: Occurred At
          format: date-time
          description: "When this occurrence of the failure happened."
        firstSeenAt:
          type: string
          title: First Seen At
          format: date-time
          description: >-
            When this failure was first seen on this install, for the
            deduplication window the count covers.
        count:
          type: integer
          title: Count
          minimum: 1
          description: >-
            How many times the same failure has occurred on this install
            within the deduplication window (per install per day).
        client:
          type: object
          title: Client
          additionalProperties: false
          required:
            - kind
            - version
            - buildSha
            - channel
          properties:
            kind:
              type: string
              title: Kind
              enum: ["blowhorn-desktop"]
              description: "The client that produced this report."
            version:
              type: string
              title: Version
              minLength: 1
              maxLength: 64
              description: "Client version, for example the app release version."
            buildSha:
              type: string
              title: Build SHA
              minLength: 1
              maxLength: 128
              description: "Source revision the client build came from."
            channel:
              type: string
              title: Channel
              minLength: 1
              maxLength: 64
              description: >-
                Release channel the client build belongs to. Kept a free
                string rather than an enum: channel names are
                release-process values, and a new channel must not make
                older clients' reports undecodable.
        os:
          type: object
          title: Operating System
          additionalProperties: false
          required:
            - name
            - version
            - arch
          properties:
            name:
              type: string
              title: Name
              minLength: 1
              maxLength: 128
              description: "Operating system name."
            version:
              type: string
              title: Version
              minLength: 1
              maxLength: 128
              description: "Operating system version."
            arch:
              type: string
              title: Architecture
              minLength: 1
              maxLength: 64
              description: "Operating system architecture."
        failure:
          type: object
          title: Failure
          additionalProperties: false
          required:
            - surface
            - cause
            - code
            - message
            - ticksSkipped
          properties:
            surface:
              type: string
              title: Surface
              enum: ["tray", "popover", "console", "service"]
              description: "Where the failure first became visible to the person."
            cause:
              type: string
              title: Cause
              pattern: "^[a-z][a-z0-9_]*$"
              maxLength: 64
              description: >-
                Stable machine-readable name for the cause. Deliberately
                a patterned string, not a closed enum: new failure causes
                are named by the client over time, and a closed enum
                would make the server reject reports carrying a cause it
                does not know yet. Consumers must treat an unknown cause
                as opaque, never as an error. Known causes today are the
                Blowhorn engine's StoreUnavailable.cause names:
                unavailable, not_configured, incomplete, bad_setting,
                config_unreadable, tunnel_refused, tunnel_silent,
                tunnel_off, not_postgres, auth_rejected,
                host_not_permitted, database_missing, timeout,
                version_unreadable, ledger_unreadable, schema_behind,
                schema_ahead, schema_edited, no_organization,
                unknown_organization, plus other named causes as clients
                add them.
            code:
              type: string
              title: Code
              maxLength: 128
              description: >-
                Machine-readable code for the failure, when the failure
                carries one beyond its cause (for example an exit or
                provider code). Kept a string so numeric and symbolic
                codes both fit; empty when the failure carries no code.
            message:
              type: string
              title: Message
              maxLength: 500
              description: >-
                Redacted human-readable sentence for the failure: only
                the cause sentence survives, with paths, usernames,
                emails, profile names, post text, and tokens removed.
            ticksSkipped:
              type: integer
              title: Ticks Skipped
              minimum: 0
              description: >-
                How many scheduled ticks the failure skipped, when the
                failure interrupted scheduled work.
        compat:
          type: object
          title: Compatibility
          additionalProperties: false
          required:
            - requiresSchema
            - contractVersion
          properties:
            requiresSchema:
              type: string
              title: Requires Schema
              minLength: 1
              maxLength: 128
              description: >-
                Schema version the client requires the server to speak
                for this report to be understood.
            contractVersion:
              type: string
              title: Contract Version
              minLength: 1
              maxLength: 64
              description: >-
                Version of the client-server contract this report was
                built against. Kept a string so dotted versions and
                plain numbers both fit.
        installId:
          type: string
          title: Install ID
          maxLength: 128
          description: >-
            Optional per-install id, present only when the person has
            not opted out of failure reports. A random id minted per
            install, never a hardware id. Deliberately a plain string,
            not format uuid: the per-install id's format is not fixed
            to UUID, and a uuid format would reject reports from
            clients whose id takes another shape. Omitted entirely when
            opted out.
