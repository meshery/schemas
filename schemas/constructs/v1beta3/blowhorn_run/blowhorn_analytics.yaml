$schema: http://json-schema.org/draft-07/schema#
title: Blowhorn Analytics Schema
description: |
  Server-returned Blowhorn analytics rollup as persisted by
  meshery-cloud. Analytics rows aggregate run records per scope and
  window; recording the same (scope, window) pair replaces the stored
  metrics.
type: object
additionalProperties: false
required:
  - id
  - organizationId
  - scope
  - metrics
  - createdAt
  - updatedAt
properties:
  id:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Server-generated Blowhorn analytics ID.
    x-order: 1
  organizationId:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Owning organization ID. Derived from the authenticated session, never client-settable.
    x-go-name: OrganizationID
    x-oapi-codegen-extra-tags:
      db: organization_id
    x-order: 2
  scope:
    type: string
    description: Aggregation scope (e.g. profile subject or organization-wide rollup name).
    minLength: 1
    maxLength: 255
    x-oapi-codegen-extra-tags:
      db: scope
    x-order: 3
  window:
    type: string
    description: Aggregation window the metrics cover (e.g. day, week).
    maxLength: 255
    x-oapi-codegen-extra-tags:
      db: window
    x-order: 4
  metrics:
    type: object
    description: Aggregated metrics, stored as a JSON blob.
    x-go-type: core.Map
    x-go-type-import:
      path: github.com/meshery/schemas/models/core
      name: core
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: metrics
    x-order: 5
  computedAt:
    type: string
    format: date-time
    description: Time the metrics were computed.
    nullable: true
    x-go-type: core.NullTime
    x-go-type-import:
      path: github.com/meshery/schemas/models/core
      name: core
    x-oapi-codegen-extra-tags:
      db: computed_at
    x-order: 6
  createdAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
    description: Timestamp of Blowhorn analytics creation.
    x-oapi-codegen-extra-tags:
      db: created_at
    x-order: 7
  updatedAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
    description: Timestamp of last Blowhorn analytics modification.
    x-oapi-codegen-extra-tags:
      db: updated_at
    x-order: 8
