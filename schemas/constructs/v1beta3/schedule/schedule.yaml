$schema: http://json-schema.org/draft-07/schema#
title: Schedule Schema
description: |
  Server-returned schedule. A schedule is a job: an action to run, what it
  acts on (`targetType`, `targetId`) and its parameters, when it is due
  (`runAt`, `nextRunAt`, `recurrence` in `timezone`), its retry budget and
  its outcome. Schedules belong to an organization and may be linked to a
  workspace. A worker takes a schedule through the generic `claim`
  construct (`POST /api/claims` with `resourceType` `schedule`); there is
  no schedule-specific claim route. While the claim is live no other worker
  can take the schedule, and a claim past its `expiresAt` is stale so the
  schedule is claimable again. Releasing the claim records the run's
  outcome on the schedule in the same transaction (see `status`). The
  `claim` and the status values `assigned`, `claimed` and `running` are
  server-managed. Pausing is data, not an operation: a client sets `paused`
  (and optionally `pauseReason`) on create or update, and the server
  records `pausedAt` and `pausedBy`. Fields marked readOnly are
  server-managed and ignored on input.
type: object
additionalProperties: false
required:
  - id
  - organizationId
  - name
  - action
  - enabled
  - timezone
  - status
  - retryCount
  - maxRetries
  - createdAt
  - updatedAt
properties:
  id:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Server-generated schedule ID.
    readOnly: true
    x-order: 1
  organizationId:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Owning organization ID. Derived from the authenticated session, never client-settable.
    readOnly: true
    x-go-name: OrganizationID
    x-oapi-codegen-extra-tags:
      db: organization_id
    x-order: 2
  workspaceId:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Workspace the schedule is linked to. Omitted when the schedule is not linked to a workspace.
    x-oapi-codegen-extra-tags:
      db: workspace_id
      json: "workspaceId,omitempty"
    x-order: 3
  createdBy:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: >
      ID of the user who owns the schedule: the user whose session created
      it, until that user is deleted. The schedule then passes to a live
      admin of the organization, else to another live member; with neither
      left it is soft-deleted. Server-managed, never client-settable.
    readOnly: true
    x-go-name: CreatedBy
    x-oapi-codegen-extra-tags:
