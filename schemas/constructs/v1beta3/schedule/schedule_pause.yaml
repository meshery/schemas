$schema: http://json-schema.org/draft-07/schema#
title: Schedule Pause Schema
description: |
  Server-returned organization-wide schedule pause. While a pause exists for
  an organization, none of its schedules is claimed unless the claim
  request carries the operator override. Absence of a pause means
  unpaused; there is at most one live pause per organization. A pause on a
  single schedule is carried on the schedule itself.
type: object
additionalProperties: false
required:
  - id
  - organizationId
  - pausedAt
  - createdAt
  - updatedAt
properties:
  id:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Server-generated schedule pause ID.
    x-order: 1
  organizationId:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Organization the pause applies to. Derived from the authenticated session, never client-settable.
    x-go-name: OrganizationID
    x-oapi-codegen-extra-tags:
      db: organization_id
    x-order: 2
  pausedAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
    description: Time the pause was set.
    x-oapi-codegen-extra-tags:
      db: paused_at
    x-order: 3
  pausedBy:
    type: string
    description: Identity that set the pause. Server-managed.
    maxLength: 255
    x-oapi-codegen-extra-tags:
      db: paused_by
    x-order: 4
  reason:
    type: string
    description: Reason given for pausing every schedule in the organization.
    x-oapi-codegen-extra-tags:
      db: reason
    x-order: 5
  createdAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
    description: Timestamp of schedule pause creation.
    x-oapi-codegen-extra-tags:
      db: created_at
    x-order: 6
  updatedAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
    description: Timestamp of last schedule pause modification.
    x-oapi-codegen-extra-tags:
      db: updated_at
    x-order: 7
