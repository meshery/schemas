type: object
additionalProperties: false
description: >-
  Represents a user-owned API token or OAuth session. A token may carry two
  optional limits. `keychainIds` restricts which keys it may use, and
  `expiresAt` ends its life. A token with neither is unrestricted and never
  expires, which is what every token issued before these fields existed is.
  A token with neither limit set is unrestricted only when keychainScoped is
  false or absent. `keychainScoped` is the server's stored record of whether
  the token is limited to its keychains' keys.
  See the token scoping contract in docs/token-scoping-contract.md.
required:
- id
- owner
- provider
- accessToken
- name
- purpose
- isOauth
- createdAt
- updatedAt
properties:
  id:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Unique identifier for the token.
    x-oapi-codegen-extra-tags:
      db: id
      json: id
    x-order: 1
  owner:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: UUID of the user who owns the token.
    x-go-name: Owner
    x-oapi-codegen-extra-tags:
      db: owner
      json: owner
    x-order: 2
  provider:
    type: string
    description: Authentication provider associated with the token.
    x-oapi-codegen-extra-tags:
      db: provider
      json: provider
    maxLength: 500
    x-order: 3
  accessToken:
    type: string
    description: Access token value.
    x-oapi-codegen-extra-tags:
      db: access_token
      json: accessToken
    maxLength: 4096
    x-order: 4
  refreshToken:
    type: string
    description: Refresh token value when applicable.
    x-oapi-codegen-extra-tags:
      db: refresh_token
      json: refreshToken
    maxLength: 4096
    x-order: 5
  name:
    type: string
    description: Human-readable token name.
    x-oapi-codegen-extra-tags:
      db: name
      json: name
    minLength: 1
    maxLength: 255
    x-order: 6
  purpose:
    type: string
    description: Purpose for which the token was created.
    x-oapi-codegen-extra-tags:
      db: purpose
      json: purpose
    maxLength: 500
    x-order: 7
  isOauth:
    type: boolean
    description: Whether this entry represents an OAuth session.
    x-go-name: IsOAuth
    x-oapi-codegen-extra-tags:
      db: is_oauth
      json: isOauth
    x-order: 8
  createdAt:
    type: string
    format: date-time
    description: Timestamp when the token was created.
    x-go-type: time.Time
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: created_at
      json: createdAt
    x-order: 9
  updatedAt:
    type: string
    format: date-time
    description: Timestamp when the token was last updated.
    x-go-type: time.Time
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: updated_at
      json: updatedAt
    x-order: 10
  keychainIds:
    type: array
    description: >-
      IDs of the keychains this token is limited to. A token is unrestricted
      only when keychainScoped is false or absent and keychainIds is empty or
      absent, so every token issued before this field existed keeps working
      unchanged. A non-empty list always makes the token scoped, whatever
      keychainScoped says. A scoped token may use only keys that belong to
      these keychains, intersected with the owner's keys in the organization of
      the request: the effective keys are never more than the user's own. A
      scoped token with an empty list holds no keys; it is not unrestricted. A
      server that stores keychainIds always stores keychainScoped true. Unknown
      keychain IDs are refused when the token is created.
    items:
      $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    maxItems: 100
    uniqueItems: true
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: "-"
      json: "keychainIds,omitempty"
    x-order: 11
  expiresAt:
    type: string
    format: date-time
    description: >-
      Time after which the token is no longer accepted. Absent or null means the token
      never expires, which is the case for every token issued before this
      field existed. Set when the token is created and not changed afterwards.
    nullable: true
    x-go-type: core.NullTime
    x-go-type-import:
      path: github.com/meshery/schemas/models/core
      name: core
    x-oapi-codegen-extra-tags:
      db: expires_at
      json: "expiresAt,omitempty"
    x-order: 12
  keychainScoped:
    type: boolean
    description: >-
      Whether the token is limited to the keys of its keychains. Set by the
      server at creation: true when the create has a non-empty `keychainIds`.
      A re-consent that narrows an unrestricted token (false) changes it to
      true; no other operation changes it, and it is never reset to false. It
      is read-only to clients. It is stored on the token and never reset, so a
      scoped token whose keychains have all been deleted stays scoped and holds
      no keys; a non-empty set of keychain mappings also always means scoped. A token is unrestricted only
      when keychainScoped is false or absent and keychainIds is empty or absent.
      A true flag is never unrestricted, even with an empty list.
    readOnly: true
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: keychain_scoped
      json: "keychainScoped,omitempty"
    x-order: 13
