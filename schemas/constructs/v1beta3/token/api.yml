openapi: 3.0.0
info:
  title: token
  description: Documentation for Meshery Cloud REST APIs for user tokens and sessions
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: v1beta3
servers:
- url: https://cloud.meshery.io
  description: Meshery Cloud production server URL
- url: https://staging-cloud.meshery.io
  description: Meshery Cloud staging server URL
- url: http://localhost:9876
  description: Meshery Cloud development server URL
security:
- jwt: []
tags:
- name: tokens
  description: Operations related to user tokens and sessions
paths:
  /api/identity/tokens:
    get:
      x-internal:
      - cloud
      tags:
      - tokens
      summary: Get tokens
      operationId: getUserTokens
      description: Retrieves tokens associated with the authenticated user.
      parameters:
      - $ref: '#/components/parameters/isOauth'
      - $ref: '#/components/parameters/purpose'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/order'
      responses:
        '200':
          description: Tokens response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPage'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
    post:
      x-internal:
      - cloud
      tags:
      - tokens
      summary: Generate token
      operationId: generateToken
      description: >-
        Generates a token for the authenticated user. `name` and `purpose` are
        query parameters, as before. The optional body (`TokenPayload`) limits
        the token: `keychainIds` restricts it to the keys of those keychains,
        and `expiresAt` ends its life. Omit the body, or both fields, for an
        unrestricted token that never expires. An unknown keychain ID, an
        `expiresAt` in the past, or a keychain the caller cannot see is
        refused with 400. See docs/token-scoping-contract.md.
      parameters:
      - $ref: '#/components/parameters/name'
      - $ref: '#/components/parameters/purpose'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPayload'
      responses:
        '201':
          description: Token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
    delete:
      x-internal:
      - cloud
      tags:
      - tokens
      summary: Delete token
      operationId: deleteUserToken
      description: Deletes a specific token for the authenticated user.
      parameters:
      - $ref: '#/components/parameters/tokenIdQuery'
      responses:
        '200':
          description: Token deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /api/identity/tokens/{tokenId}:
    get:
      x-internal:
      - cloud
      tags:
      - tokens
      summary: Download token
      operationId: downloadToken
      description: Downloads a specific token by its ID for use as a local credential file (e.g. a CLI auth file). Gated by the Download Token permission and recorded as a distinct audit event from viewing or listing tokens.
      parameters:
      - $ref: '#/components/parameters/tokenId'
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserToken'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /api/identity/tokens/infinite:
    get:
      x-internal:
      - cloud
      tags:
      - tokens
      summary: Issue indefinite lifetime token
      operationId: issueIndefiniteLifetimeToken
      description: Creates a non-expiring user token for provider admin use cases.
      parameters:
      - $ref: '#/components/parameters/userIdQuery'
      - $ref: '#/components/parameters/providerQuery'
      responses:
        '200':
          description: Token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /api/identity/native/authorize:
    get:
      x-internal:
      - cloud
      tags:
      - tokens
      summary: Authorize native client sign-in
      operationId: getNativeClientAuthorization
      description: >-
        Browser-facing step of the native client sign-in flow (RFC 8252 loopback
        redirect with RFC 7636 PKCE). Requires the session cookie of a signed-in
        user and the Create Token permission. Validates the request. When the
        request names the client application (`client`) and its version
        (`clientVersion`) and that version is below the provider minimum, it
        renders the update page with status 426 and issues nothing. Otherwise
        it stores a single-use authorization code that expires after 60
        seconds, bound to the user, the client name and the PKCE code
        challenge, and redirects the browser to
        http://127.0.0.1:{port}/callback with code and state query parameters.
        Only the 127.0.0.1 loopback IP literal is ever used; no token or cookie
        is placed in the redirect; no consent page is shown.
      parameters:
      - $ref: '#/components/parameters/nativeClientName'
      - $ref: '#/components/parameters/nativeClient'
      - $ref: '#/components/parameters/nativeClientVersion'
      - $ref: '#/components/parameters/nativePort'
      - $ref: '#/components/parameters/nativeCodeChallenge'
      - $ref: '#/components/parameters/nativeCodeChallengeMethod'
      - $ref: '#/components/parameters/nativeState'
      responses:
        '302':
          description: >-
            Redirect to the loopback callback carrying code and state. The
            callback's query parameters are described by
            NativeAuthorizationCallback.
          headers:
            Location:
              required: true
              description: >-
                http://127.0.0.1:{port}/callback?code=...&state=..., whose query
                is a NativeAuthorizationCallback.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '426':
          description: Update page; the client's version is below the provider's minimum for that client.
          content:
            text/html:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/500'
  /api/identity/native/token:
    post:
      x-internal:
      - cloud
      tags:
      - tokens
      summary: Exchange native client authorization code
      operationId: exchangeNativeAuthorizationCode
      description: >-
        Redeems a single-use authorization code from the native client sign-in
        flow. The caller proves possession of the PKCE code verifier
        (BASE64URL(SHA256(codeVerifier)) must equal the stored S256 challenge).
        The code is consumed on the first redemption attempt, whether or not the
        verifier matches. On success an API token is minted for the user with
        name and purpose set to the client name. This call is authenticated by
        the code and verifier, not by a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeCodeExchangePayload'
      responses:
        '201':
          description: API token minted for the native client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserToken'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    400:
      $ref: ../../v1beta2/core/api.yml#/components/responses/400
    401:
      $ref: ../../v1beta2/core/api.yml#/components/responses/401
    403:
      $ref: ../../v1beta2/core/api.yml#/components/responses/403
    404:
      $ref: ../../v1beta2/core/api.yml#/components/responses/404
    500:
      $ref: ../../v1beta2/core/api.yml#/components/responses/500
  parameters:
    tokenId:
      name: tokenId
      in: path
      description: Token ID
      required: true
      schema:
        $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    tokenIdQuery:
      name: tokenId
      in: query
      description: ID of the token to delete.
      required: true
      schema:
        $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    userIdQuery:
      # The deployed handler (IssueIndefiniteLifetimeToken) requires the
      # `userId` query param (legacy `user_id` fallback); `owner` was never
      # read and 400'd every generated-client call (schema/handler parity).
      name: userId
      in: query
      description: UUID of the user to issue the indefinite token for.
      required: true
      schema:
        $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    providerQuery:
      name: provider
      in: query
      description: Authentication provider to associate with the indefinite token.
      required: true
      schema:
        type: string
        maxLength: 500
    page:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/page
    pageSize:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/pageSize
    pagesize:
      name: pagesize
      in: query
      description: Get responses by pagesize. Deprecated alias of pageSize.
      deprecated: true
      schema:
        type: integer
    search:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/search
    order:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/order
    isOauth:
      name: isOauth
      in: query
      description: Whether to retrieve OAuth-backed sessions instead of API tokens.
      schema:
        type: boolean
    name:
      name: name
      in: query
      description: Name of the token.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    purpose:
      name: purpose
      in: query
      description: Token purpose. Tokens are minted with this purpose on generate. On list, only tokens whose purpose is exactly this value (case-sensitive, not a substring match) are returned; omit it to list every purpose.
      schema:
        type: string
        maxLength: 500
    nativeClientName:
      name: clientName
      in: query
      description: Display name of the native client asking to sign in. Used as the name and purpose of the minted token.
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9 ._-]{0,62}$
    nativeClient:
      name: client
      in: query
      description: Identifier of the client application, as in the capabilities `client` parameter. Selects the minimum version checked against `clientVersion`.
      required: false
      schema:
        $ref: ../provider_capability/api.yml#/components/schemas/ClientName
    nativeClientVersion:
      name: clientVersion
      in: query
      description: Version of the client application, for example `v1.25.0`.
      required: false
      schema:
        type: string
        maxLength: 64
    nativePort:
      name: port
      in: query
      description: Port on 127.0.0.1 where the native client listens for the callback.
      required: true
      schema:
        type: integer
        minimum: 1024
        maximum: 65535
    nativeCodeChallenge:
      name: codeChallenge
      in: query
      description: PKCE code challenge, BASE64URL(SHA256(codeVerifier)) without padding.
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
    nativeCodeChallengeMethod:
      name: codeChallengeMethod
      in: query
      description: PKCE challenge method. Only S256 is accepted.
      required: true
      schema:
        type: string
        enum:
        - S256
    nativeState:
      name: state
      in: query
      description: Opaque value from the native client, returned unchanged on the callback.
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 512
  schemas:
    UserToken:
      $ref: ./token.yaml
    TokenPayload:
      type: object
      additionalProperties: false
      description: >-
        Client-settable limits for a token created with generateToken. Every
        field is optional; an empty body creates an unrestricted token that
        never expires. The token's name and purpose are query parameters of the
        operation, and its id, owner and timestamps are server-generated.
      properties:
        keychainIds:
          type: array
          description: >-
            IDs of the keychains the token is limited to. Empty or absent means
            unrestricted. When present, the token's effective keys are the
            owner's keys in the request's organization intersected with the keys
            of these keychains.
          items:
            $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          maxItems: 100
          uniqueItems: true
          x-order: 1
        expiresAt:
          type: string
          format: date-time
          description: Time after which the token is no longer accepted. Absent means it never expires.
          x-order: 2
    TokenStanding:
      type: object
      additionalProperties: false
      description: >-
        Server-side read result of looking up one presented token by its ID
        (the token's `jti`) in the token store. It is not a request or response
        body: the server reads it before any handler runs to decide whether the
        token is accepted and whether its keys are narrowed to its keychains.
        See docs/token-scoping-contract.md.
      required:
      - id
      - revoked
      - expired
      - keychainScoped
      properties:
        id:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: >-
            ID of the stored token the presented token's `jti` matched. The
            zero UUID when no stored token matched.
          x-oapi-codegen-extra-tags:
            db: id
          x-order: 1
        revoked:
          type: boolean
          description: Whether the stored token has been retired (deleted).
          x-oapi-codegen-extra-tags:
            db: revoked
          x-order: 2
        expired:
          type: boolean
          description: >-
            Whether the stored token's `expiresAt` is at or before the time of
            the lookup, evaluated by the store. A token with no `expiresAt`
            never expires.
          x-oapi-codegen-extra-tags:
            db: expired
          x-order: 3
        keychainScoped:
          type: boolean
          description: >-
            The token's stored `keychainScoped` flag. When true the token is
            limited to the keys of its keychains, and holds no keys if every
            one of them has been deleted. Never inferred from the keychain
            mappings.
          x-oapi-codegen-extra-tags:
            db: keychain_scoped
          x-order: 4
    NativeAuthorizationPayload:
      type: object
      description: Query fields of GET /api/identity/native/authorize. The signed-in session issues the authorization code from these fields.
      required:
      - clientName
      - port
      - codeChallenge
      - codeChallengeMethod
      - state
      properties:
        clientName:
          type: string
          description: Display name of the native client.
          pattern: ^[A-Za-z0-9][A-Za-z0-9 ._-]{0,62}$
          x-order: 1
        port:
          type: integer
          description: Port on 127.0.0.1 for the callback.
          minimum: 1024
          maximum: 65535
          x-order: 2
        codeChallenge:
          type: string
          description: PKCE S256 code challenge.
          pattern: ^[A-Za-z0-9_-]{43}$
          x-order: 3
        codeChallengeMethod:
          type: string
          description: PKCE challenge method.
          enum:
          - S256
          x-order: 4
        state:
          type: string
          description: Opaque client state returned on the callback.
          minLength: 8
          maxLength: 512
          x-order: 5
    NativeCodeExchangePayload:
      type: object
      additionalProperties: false
      description: Redeems a native client authorization code with its PKCE verifier.
      required:
      - code
      - codeVerifier
      properties:
        code:
          type: string
          description: Single-use authorization code from the loopback callback.
          minLength: 1
          maxLength: 128
          x-order: 1
        codeVerifier:
          type: string
          description: PKCE code verifier (RFC 7636, 43 to 128 unreserved characters).
          pattern: ^[A-Za-z0-9._~-]{43,128}$
          x-order: 2
    NativeAuthorizationCallback:
      type: object
      description: >-
        Query parameters of the loopback redirect that getNativeClientAuthorization
        answers with, http://127.0.0.1:{port}/callback?code=...&state=... The code is
        single-use and expires after 60 seconds; no token is ever placed in the URL.
        The native client compares state with the one it sent before redeeming the code
        at /api/identity/native/token.
      required:
      - code
      - state
      properties:
        code:
          type: string
          description: Single-use authorization code, redeemed with the PKCE code verifier.
          minLength: 1
          maxLength: 128
          x-order: 1
        state:
          type: string
          description: The state the native client sent on the authorize request, unchanged.
          minLength: 8
          maxLength: 512
          x-order: 2
    TokenPage:
      type: object
      description: A paginated list of tokens.
      required:
      - tokens
      - totalCount
      - page
      - pageSize
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/UserToken'
            x-go-type: UserToken
          x-order: 1
          description: Tokens returned on the current page.
        totalCount:
          type: integer
          description: Total number of tokens across all pages.
          minimum: 0
          x-go-type-skip-optional-pointer: true
          x-order: 2
          x-oapi-codegen-extra-tags:
            json: totalCount
        page:
          type: integer
          description: Current page number (zero-based).
          minimum: 0
          x-go-type-skip-optional-pointer: true
          x-order: 3
        pageSize:
          type: integer
          description: Number of tokens per page.
          minimum: 1
          x-go-type-skip-optional-pointer: true
          x-order: 4
          x-oapi-codegen-extra-tags:
            json: pageSize
