openapi: 3.0.0
info:
  title: Subscription
  description: API for managing subscriptions using various payment processors in a SaaS application.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: http://localhost:8080
  description: Local development server
tags:
- name: Subscriptions
  description: Operations related to subscriptions
- name: Plans
  description: Operations related to plans
- name: Payment Processors
  description: Operations related to payment processors
paths:
  /api/entitlement/subscriptions:
    get:
      x-internal:
      - cloud
      tags:
      - Subscriptions
      description: Returns all subscriptions for the organization
      operationId: getSubscriptions
      summary: Read subscriptions
      security:
      - jwt: []
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/order'
      - name: status
        in: query
        description: Filter subscriptions by status
        required: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: planId
        in: query
        description: Filter subscriptions by plan UUID. Repeat for multiple values.
        required: false
        schema:
          type: array
          items:
            $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
        style: form
        explode: true
      responses:
        '200':
          description: Subscriptions response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
    post:
      x-internal:
      - cloud
      tags:
      - Subscriptions
      operationId: upsertSubscription
      summary: Update an existing subscription
      description: >-
        Updates the subscription named by `id` in the request body. Despite the
        historical "upsert" name, this route does not create: a body carrying no
        `id` is refused with 400. Subscriptions are minted from the payment
        processor's own response, either by the checkout flow (`POST
        /api/entitlement/subscriptions/create`) or by the payment-processor
        webhook, and neither of those reaches this route.


        Authorization is evaluated against the *stored* subscription's own
        organization, not against whichever organization the caller currently
        has selected. The caller must be a provider admin, or an Organization
        Admin or Organization Owner of that organization. A caller who is not
        receives 404 - the same answer an absent subscription gives, and
        deliberately indistinguishable from it, so that the route cannot be used
        to discover which subscription IDs exist.


        The fields the payment processor and the webhook own are pinned to the
        stored row before the write, and any client-supplied value for them is
        ignored rather than honoured: `orgId`, `billingId`, `status`,
        `startDate` and `endDate`. The writable surface is `planId` and
        `quantity`, and the write replaces both - a body that omits one stores
        that field's zero value rather than preserving the stored one, so send
        both on every call.


        The 200 body is a `SubscriptionPage` carrying the single updated
        subscription (`page` 0, `pageSize` 1, `totalCount` 1), not a bare
        subscription object.
      security:
      - jwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdatePayload'
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /api/entitlement/subscriptions/{subscriptionId}:
    get:
      x-internal:
      - cloud
      tags:
      - Subscriptions
      operationId: getSubscriptionById
      summary: Read a single subscription
      description: >-
        Returns the subscription named by `subscriptionId`.


        Authorization is evaluated against the subscription's own organization,
        the same bar the org-scoped list route (`GET
        /api/entitlement/subscriptions`) enforces over the same data: the caller
        must be a provider admin, or an Organization Admin or Organization Owner
        of that organization. A caller who is not receives 404, deliberately
        indistinguishable from an absent subscription, so that the route cannot
        be used to enumerate subscription IDs.


        A `subscriptionId` that is not a UUID is refused with 400, and an
        unauthenticated caller with 401.


        The 200 body is a `SubscriptionPage` carrying the single subscription
        (`page` 0, `pageSize` 1, `totalCount` 1), not a bare subscription
        object.
      security:
      - jwt: []
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Subscription response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /api/entitlement/subscriptions/{subscriptionId}/cancel:
    post:
      x-internal:
      - cloud
      tags:
      - Subscriptions
      operationId: cancelSubscription
      summary: Cancel an existing subscription. The subscription will remain active
        until the end of the billing period and then it will be canceled.
      security:
      - jwt: []
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      responses:
        '200':
          description: Subscription cancellation scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /api/entitlement/subscriptions/create:
    post:
      x-internal:
      - cloud
      tags:
      - Subscriptions
      operationId: createSubscription
      summary: Create a new subscription for an organization
      security:
      - jwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: A new subscription has been created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSubscriptionResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /api/entitlement/subscriptions/{subscriptionId}/upgrade:
    post:
      x-internal:
      - cloud
      tags:
      - Subscriptions
      operationId: upgradeSubscription
      summary: Upgrade or downgrade an existing subscription by changing one of the
        plans in the subscription
      security:
      - jwt: []
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeSubscriptionRequest'
      responses:
        '200':
          description: Subscription upgraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /api/entitlement/subscriptions/{subscriptionId}/upgrade-preview:
    post:
      x-internal:
      - cloud
      tags:
      - Subscriptions
      operationId: previewSubscriptionUpgrade
      summary: Preview the invoice for upgrading or downgrading an existing subscription
        by changing one of the plans in the subscription
      security:
      - jwt: []
      parameters:
      - $ref: '#/components/parameters/subscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeSubscriptionRequest'
      responses:
        '200':
          description: Preview of the upgraded subscription invoice
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /api/entitlement/subscriptions/webhooks:
    post:
      x-internal:
      - cloud
      tags:
      - Payment Processors
      operationId: handleSubscriptionWebhook
      summary: Handle webhook events from payment processors
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Webhook processed
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
components:
  responses:
    400:
      $ref: ../../v1beta2/core/api.yml#/components/responses/400
    401:
      $ref: ../../v1beta2/core/api.yml#/components/responses/401
    404:
      $ref: ../../v1beta2/core/api.yml#/components/responses/404
    500:
      $ref: ../../v1beta2/core/api.yml#/components/responses/500
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: Subscription ID
      schema:
        type: string
        format: uuid
    page:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/page
    pagesize:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/pagesize
    pagesizeWithAll:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/pagesizeWithAll
    order:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/order
  schemas:
    PaymentProcessor:
      type: string
      description: Payment processor used to charge the subscription.
      enum:
      - stripe
      - paypal
      - braintree
    CreateSubscriptionRequest:
      type: object
      description: Payload for creating a new subscription through a payment processor.
      properties:
        orgId:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: ID of the organization subscribing.
        planId:
          type: string
          description: Price ID from the payment processor.
          x-id-format: external
          maxLength: 500
          pattern: '^[A-Za-z0-9_\-]+$'
        couponId:
          type: string
          description: Coupon ID to apply.
          x-id-format: external
          maxLength: 500
          pattern: '^[A-Za-z0-9_\-]+$'
        userCount:
          type: integer
          description: Number of users in the organization.
          minimum: 0
        email:
          type: string
          format: email
          description: Email of the customer.
          maxLength: 500
        paymentProcessor:
          $ref: '#/components/schemas/PaymentProcessor'
          description: Payment processor used to complete the subscription checkout.
    SubscriptionUpdatePayload:
      type: object
      description: >-
        Body of an update to an existing subscription (`POST
        /api/entitlement/subscriptions`).


        This is an update payload, never a create payload: `id` names the
        subscription to update and the server refuses a body without one. It is
        also a full replacement of the writable surface rather than a partial
        merge, which is why `planId` and `quantity` are both required - omitting
        either stores its zero value.


        The fields the payment processor and the webhook own - `orgId`,
        `billingId`, `status`, `startDate` and `endDate` - are deliberately
        absent: the server pins each of them to the stored row and ignores any
        value supplied for them.
      required:
      - planId
      - quantity
      properties:
        id:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: >-
            ID of the subscription to update. Mandatory: a body without it is
            refused with 400, because this route cannot create a subscription.
          x-oapi-codegen-extra-tags:
            json: id
        planId:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: ID of the plan the subscription is for.
          x-go-name: PlanID
          x-oapi-codegen-extra-tags:
            json: planId
        quantity:
          type: integer
          description: Number of units subscribed (eg number of users).
          minimum: 0
          x-oapi-codegen-extra-tags:
            json: quantity
    UpgradeSubscriptionRequest:
      type: object
      description: Payload for upgrading or downgrading a subscription by changing
        one of its plans.
      properties:
        oldPlanId:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: Plan ID that is being replaced.
        newPlanId:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: Plan ID that replaces the old plan.
    CreateSubscriptionResponse:
      type: object
      description: Response body returned after a subscription is created.
      properties:
        subscriptionId:
          type: string
          description: ID of the associated subscription in the payment processor.
          x-id-format: external
          maxLength: 500
          pattern: '^[A-Za-z0-9_\-]+$'
        clientSecret:
          type: string
          description: Client secret returned by the payment processor for the subscription
            checkout flow.
          maxLength: 500
    UpdateUsersRequest:
      type: object
      description: Payload for synchronizing the current user count with the payment
        processor.
      properties:
        paymentProcessor:
          $ref: '#/components/schemas/PaymentProcessor'
          description: Payment processor currently billing the subscription.
    CancelSubscriptionRequest:
      type: object
      description: Payload for cancelling a subscription in an external processor.
      properties:
        subscriptionId:
          type: string
          description: Subscription ID from the payment processor.
          x-id-format: external
          maxLength: 500
          pattern: '^[A-Za-z0-9_\-]+$'
        paymentProcessor:
          $ref: '#/components/schemas/PaymentProcessor'
          description: Payment processor currently billing the subscription.
    WebhookEvent:
      type: object
      description: Payload for webhook events from payment processors.
    SubscriptionPage:
      type: object
      description: Paginated list of subscriptions.
      required:
      - page
      - pageSize
      - totalCount
      - subscriptions
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
          x-go-type-skip-optional-pointer: true
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            json: pageSize
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            json: totalCount
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
            x-go-type: Subscription
          description: Subscriptions returned on the current page.
    Subscription:
      $ref: ./subscription.yaml
    SubscriptionStatus:
      type: string
      description: Possible statuses of a Stripe subscription.
      enum:
      - incomplete
      - incomplete_expired
      - trialing
      - active
      - past_due
      - canceled
      - unpaid
      x-enumDescriptions:
        incomplete: The subscription has been created, but the initial payment is
          pending. It may transition to 'active' or 'incomplete_expired'.
        incomplete_expired: The subscription was created but never activated due to
          failed initial payment. It is now expired.
        trialing: The subscription is currently in a trial period before the first
          payment is due.
        active: The subscription is active, and billing is functioning normally.
        past_due: The latest payment attempt failed, but the subscription remains
          active. Stripe may retry the charge.
        canceled: The subscription has been canceled and will no longer generate invoices.
        unpaid: The subscription is still technically active but has unpaid invoices
          and is no longer generating new invoices.
