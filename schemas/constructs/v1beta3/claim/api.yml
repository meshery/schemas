openapi: 3.0.0
info:
  title: Claim
  description: |
    OpenAPI schema for claims - generic, time-bound holds that one connection
    takes on one resource so competing workers never act on it twice. Any
    construct can be claimed; schedules nest the same claim under
    `/api/schedules/{scheduleId}/claim`. A claim is held by the caller's own
    live connection in the session organization (`connectionId` on the
    request, `claimantConnectionId` on the claim) on behalf of the session
    user (`claimantUserId`). At most one claim per resource is active in an
    organization; the race between claimants is decided server-side in a
    single statement. A claim past `expiresAt` reads as `expired` and the
    resource can be claimed again. Released and expired claims are kept as
    history, so a handoff reads as an expired claim followed by an active
    claim on the same resource.
    Organization scope: every operation acts only in the organization the
    session resolved to (X-Current-Orgid, then the user's selected
    organization), and only when the caller is a live member of it. A
    caller who is not a member, a connection that is not the caller's own
    live connection in that organization, and a resource the organization
    does not have all receive the same 404 as an unknown id, so the
    existence of another organization's claims, connections and resources
    is never disclosed.
    Authorization: reading claims takes the View Claims key; taking and
    renewing a claim takes Take and renew claims; releasing one's own claim
    takes Release claim; releasing a claim another member holds takes
    Release claims of other members. Every key is checked in the session
    organization.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []
tags:
  - name: claims
    description: Operations related to claims on resources.

paths:
  /api/claims:
    get:
      x-internal: ["cloud"]
      tags:
        - claims
      summary: List claims
      operationId: listClaims
      description: >
        Returns a paginated list of the claims in the organization of the
        authenticated session, active and historical, optionally filtered by
        resource, holding connection, user, status, outcome and the time the
        claim was taken. Ordered by `claimedAt`, newest first, unless `order`
        is `claimedAt asc`. Every member holding View Claims sees every claim
        in the organization.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/order"
        - name: resourceType
          in: query
          required: false
          description: Filter by claimed resource type.
          schema:
            type: string
            maxLength: 64
        - name: resourceId
          in: query
          required: false
          description: Filter by claimed resource ID.
          schema:
            $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
        - name: claimantConnectionId
          in: query
          required: false
          description: Filter by the connection that holds or held the claim.
          schema:
            $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
        - name: claimantUserId
          in: query
          required: false
          description: Filter by the user whose session took the claim.
          schema:
            $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
        - name: status
          in: query
          required: false
          description: Filter by claim status, as read (a claim past `expiresAt` is `expired`).
          schema:
            type: string
            enum:
              - active
              - released
              - expired
        - name: outcome
          in: query
          required: false
          description: Filter by the outcome reported on release.
          schema:
            type: string
            enum:
              - completed
              - failed
              - cancelled
        - name: claimedSince
          in: query
          required: false
          description: Only claims taken at or after this time.
          schema:
            type: string
            format: date-time
        - name: claimedUntil
          in: query
          required: false
          description: Only claims taken before this time.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Claims page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimPage"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - claims
      summary: Claim a resource
      operationId: createClaim
      description: |
        Takes a claim on the named resource for the connection
        `connectionId`, which must be the caller's own live connection in the
        session organization. Succeeds with `201` when the resource has no
        active claim. When the same connection already holds the active claim
        the call is a replay and returns it unchanged with `200`. An active
        claim held by another connection answers `409`. A claim past
        `expiresAt`, or one whose holding connection was deleted, is marked
        `expired` and superseded. The resource must exist in the session
        organization; a server verifies the resource types it serves (for
        example `content_item` and `schedule`) and refuses any other type with
        `400`. Decided in a single server-side statement, so of two racing
        claimants exactly one wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimPayload"
      responses:
        "200":
          description: Replay - the same connection already holds the active claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "201":
          description: Claim taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /api/claims/{claimId}:
    get:
      x-internal: ["cloud"]
      tags:
        - claims
      summary: Get a claim by ID
      operationId: getClaim
      parameters:
        - $ref: "#/components/parameters/claimId"
      responses:
        "200":
          description: Claim response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/claims/{claimId}/renew:
    post:
      x-internal: ["cloud"]
      tags:
        - claims
      summary: Renew a claim
      operationId: renewClaim
      description: >
        Moves `expiresAt` forward and sets `renewedAt`, for the holding
        connection only: `connectionId` must be the caller's own live
        connection and the one that holds the claim. A claim that is not
        active (released, or past `expiresAt`), or that another connection
        holds, answers `409` and is never taken back.
      parameters:
        - $ref: "#/components/parameters/claimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRenewPayload"
      responses:
        "200":
          description: Claim renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /api/claims/{claimId}/release:
    post:
      x-internal: ["cloud"]
      tags:
        - claims
      summary: Release a claim
      operationId: releaseClaim
      description: >
        Ends an active claim and records what happened: sets `status` to
        `released`, `releasedAt`, `releasedBy` and the reported `outcome`,
        `outcomeError` and `outcomeEventId`. The holder may release its own
        claim from any of its connections (the claim's `claimantUserId` is
        the caller); a member holding Release claims of other members may
        release anyone's. Anyone else is answered `409`. Releasing a claim
        that is already released is a no-op that returns the stored claim
        unchanged, whatever outcome is sent. A claim that expired cannot be
        released (`409`): the resource may already have been handed off.
        `outcomeError` is accepted only with `outcome: failed`;
        `outcomeEventId` must name a live event the claim's holder owns, else
        `404`.
      parameters:
        - $ref: "#/components/parameters/claimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimReleasePayload"
      responses:
        "200":
          description: Claim released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

components:
  securitySchemes:
    jwt:
      type: http
      scheme: Bearer [REDACTED]
      bearerFormat: JWT

  responses:
    400:
      $ref: "../../v1beta2/core/api.yml#/components/responses/400"
    401:
      $ref: "../../v1beta2/core/api.yml#/components/responses/401"
    403:
      $ref: "../../v1beta2/core/api.yml#/components/responses/403"
    404:
      $ref: "../../v1beta2/core/api.yml#/components/responses/404"
    409:
      description: Conflict - another connection holds the resource's active claim, the claim is not active, or the caller may not renew or release it
      content:
        text/plain:
          schema:
            type: string
    500:
      $ref: "../../v1beta2/core/api.yml#/components/responses/500"

  parameters:
    claimId:
      name: claimId
      in: path
      description: Claim ID
      required: true
      schema:
        $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
    page:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/page"
    pageSize:
      name: pageSize
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
    order:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/order"

  schemas:
    Claim:
      $ref: "./claim.yaml"

    ClaimPayload:
      type: object
      description: |
        Payload for taking a claim. Contains only client-settable fields;
        the owning `organizationId`, `claimantUserId`, `status`,
        `claimedAt`, `expiresAt` and the timestamps are server-managed.
      required:
        - resourceType
        - resourceId
        - connectionId
      properties:
        resourceType:
          type: string
          description: Type of the resource to claim, for example `content_item`.
          minLength: 1
          maxLength: 64
        resourceId:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: ID of the resource to claim.
        connectionId:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: >
            ID of the connection taking the claim: the caller's own live
            connection in the session organization (for example the
            connection a desktop client registered for its machine).
          x-go-name: ConnectionID
          x-go-type-skip-optional-pointer: true
        durationMinutes:
          type: integer
          description: Requested claim duration in minutes; the server applies its default (30) when omitted and may cap it.
          minimum: 1
          maximum: 1440

    ClaimRenewPayload:
      type: object
      description: Payload for renewing a claim. Only the holding connection may renew.
      required:
        - connectionId
      properties:
        connectionId:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: ID of the connection renewing the claim; must be the caller's own live connection and the claim's holder.
          x-go-name: ConnectionID
          x-go-type-skip-optional-pointer: true
        durationMinutes:
          type: integer
          description: Requested extension in minutes from now; the server applies its default (30) when omitted and may cap it.
          minimum: 1
          maximum: 1440

    ClaimReleasePayload:
      type: object
      description: >
        Payload for releasing a claim with the outcome of the work it held.
        The releaser is the session user; no connection is needed, so a
        holder can release a stuck hold from another of its computers, and an
        authorized member can release someone else's.
      required:
        - outcome
      properties:
        outcome:
          type: string
          description: What happened to the work the claim held.
          enum:
            - completed
            - failed
            - cancelled
        outcomeError:
          type: string
          description: Error behind a `failed` outcome. Refused with any other outcome.
          minLength: 1
          maxLength: 5000
        outcomeEventId:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: ID of the event recording the run behind the outcome; must be a live event owned by the claim's holder.
          x-go-name: OutcomeEventID

    ClaimPage:
      type: object
      description: Paginated collection of claims.
      required:
        - page
        - pageSize
        - totalCount
        - claims
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
        claims:
          type: array
          items:
            $ref: "#/components/schemas/Claim"
            x-go-type: Claim
          description: Claims included on this page of results.
