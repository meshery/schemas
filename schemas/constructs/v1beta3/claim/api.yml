openapi: 3.0.0
info:
  title: Claim
  description: |
    OpenAPI schema for claims - generic, time-bound holds that one claimant
    takes on one resource so competing workers never act on it twice. Any
    construct can be claimed; schedules nest the same claim under
    `/api/schedules/{scheduleId}/claim`. The race between claimants is
    decided server-side in a single statement. Only the holder renews or
    releases a claim; a claim past `expiresAt` is stale and the resource can
    be claimed again.
    Organization scope: every operation acts only in the organization the
    session resolved to (X-Current-Orgid, then the user's selected
    organization), and only when the caller is a live member of it. A
    caller who is not a member receives the same 404 as an unknown id, so
    the existence of another organization's claims is never disclosed.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []
tags:
  - name: claims
    description: Operations related to claims on resources.

paths:
  /api/claims:
    get:
      x-internal: ["cloud"]
      tags:
        - claims
      summary: List claims
      operationId: listClaims
      description: Returns a paginated list of claims in the organization of the authenticated session, optionally filtered by resource, claimant or status.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/order"
        - name: resourceType
          in: query
          required: false
          description: Filter by claimed resource type.
          schema:
            type: string
            maxLength: 64
        - name: resourceId
          in: query
          required: false
          description: Filter by claimed resource ID.
          schema:
            $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
        - name: claimant
          in: query
          required: false
          description: Filter by holder identity.
          schema:
            type: string
            maxLength: 255
        - name: status
          in: query
          required: false
          description: Filter by claim status.
          schema:
            type: string
            enum:
              - active
              - released
              - expired
      responses:
        "200":
          description: Claims page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimPage"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - claims
      summary: Claim a resource
      operationId: createClaim
      description: |
        Takes a claim on the named resource for `claimant`. Succeeds when the
        resource has no live claim or its live claim already belongs to the
        same claimant; a live claim held by another claimant answers 409. A
        stale claim (past `expiresAt`) is superseded. Decided in a single
        server-side statement, so of two racing claimants exactly one wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimPayload"
      responses:
        "201":
          description: Claim taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /api/claims/{claimId}:
    get:
      x-internal: ["cloud"]
      tags:
        - claims
      summary: Get a claim by ID
      operationId: getClaim
      parameters:
        - $ref: "#/components/parameters/claimId"
      responses:
        "200":
          description: Claim response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/claims/{claimId}/renew:
    post:
      x-internal: ["cloud"]
      tags:
        - claims
      summary: Renew a claim
      operationId: renewClaim
      description: Moves `expiresAt` forward for the holder only. A claim that is not active, or that belongs to another claimant, answers 409 and is never taken back.
      parameters:
        - $ref: "#/components/parameters/claimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRenewPayload"
      responses:
        "200":
          description: Claim renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /api/claims/{claimId}/release:
    post:
      x-internal: ["cloud"]
      tags:
        - claims
      summary: Release a claim
      operationId: releaseClaim
      description: Ends the claim for the holder, setting `status` to `released` and `releasedAt`. Releasing a claim that is already released is a no-op; a release by another claimant answers 409.
      parameters:
        - $ref: "#/components/parameters/claimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimReleasePayload"
      responses:
        "200":
          description: Claim released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

components:
  securitySchemes:
    jwt:
      type: http
      scheme: Bearer [REDACTED]
      bearerFormat: JWT

  responses:
    400:
      $ref: "../../v1beta2/core/api.yml#/components/responses/400"
    401:
      $ref: "../../v1beta2/core/api.yml#/components/responses/401"
    404:
      $ref: "../../v1beta2/core/api.yml#/components/responses/404"
    409:
      description: Conflict - the resource is held by another claimant's live claim, or the caller is not the holder of the claim it tried to renew or release
      content:
        text/plain:
          schema:
            type: string
    500:
      $ref: "../../v1beta2/core/api.yml#/components/responses/500"

  parameters:
    claimId:
      name: claimId
      in: path
      description: Claim ID
      required: true
      schema:
        $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
    page:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/page"
    pageSize:
      name: pageSize
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
    order:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/order"

  schemas:
    Claim:
      $ref: "./claim.yaml"

    ClaimPayload:
      type: object
      description: |
        Payload for taking a claim. Contains only client-settable fields;
        the owning `organizationId`, `status`, `claimedAt`, `expiresAt` and
        the timestamps are server-managed.
      required:
        - resourceType
        - resourceId
        - claimant
      properties:
        resourceType:
          type: string
          description: Type of the resource to claim, for example `schedule`.
          minLength: 1
          maxLength: 64
        resourceId:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: ID of the resource to claim.
        claimant:
          type: string
          description: Identity of the worker taking the claim.
          minLength: 1
          maxLength: 255
        durationMinutes:
          type: integer
          description: Requested claim duration in minutes; the server applies its default when omitted and may cap it.
          minimum: 1
          maximum: 1440

    ClaimRenewPayload:
      type: object
      description: Payload for renewing a claim. Only the holder named by `claimant` may renew.
      required:
        - claimant
      properties:
        claimant:
          type: string
          description: Identity of the holder renewing the claim.
          minLength: 1
          maxLength: 255
        durationMinutes:
          type: integer
          description: Requested extension in minutes from now; the server applies its default when omitted and may cap it.
          minimum: 1
          maximum: 1440

    ClaimReleasePayload:
      type: object
      description: Payload for releasing a claim. Only the holder named by `claimant` may release.
      required:
        - claimant
      properties:
        claimant:
          type: string
          description: Identity of the holder releasing the claim.
          minLength: 1
          maxLength: 255

    ClaimPage:
      type: object
      description: Paginated collection of claims.
      required:
        - page
        - pageSize
        - totalCount
        - claims
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
        claims:
          type: array
          items:
            $ref: "#/components/schemas/Claim"
            x-go-type: Claim
          description: Claims included on this page of results.
