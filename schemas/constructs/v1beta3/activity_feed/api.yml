openapi: 3.0.0
info:
  title: Activity Feed
  description: |
    OpenAPI schema for the public activity feed: recent completed scheduled
    runs, served without authentication as social proof on public sites.
    The feed has no store of its own. It reads events recorded through the
    existing events tracker (`POST /api/events`) with category `schedule`
    and action `completed`. The user of each item is the event's `owner`,
    which the server sets to the authenticated caller for these events, and
    the organization is the event's server-set acting organization; never
    event metadata. It keeps only runs of live users whose activity-feed
    visibility setting, read from the user's existing free-form preferences,
    is `public` (absent means `public`) at the time of the read, orders them by the
    event's server-recorded creation time, and resolves profile details
    at read time. When a user switches to `private`, all of their runs,
    including ones already shown, drop out of the next response the server
    builds; a shared cache may keep serving the previous body until its
    max-age (30 seconds or less) expires. Stored events whose metadata lacks
    a valid `platform`, `role`, `roleResult` or `completedAt` are skipped. Email
    addresses and real names are never served.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

tags:
  - name: activity_feed
    description: Operations related to the public activity feed.

paths:
  /api/public/activity-feed:
    get:
      x-internal: ["cloud"]
      tags:
        - activity_feed
      operationId: getPublicActivityFeed
      summary: Get the public activity feed
      description: |
        Returns the most recent public completed scheduled runs, newest
        first. Unauthenticated. Rate limited per client IP; a client over
        the limit receives 429. Responses carry
        `Cache-Control: public, max-age=30` (never more than 30 seconds).
      security: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Public activity feed
          headers:
            Cache-Control:
              description: "`public, max-age=N` with N from 0 to 30; max-age never exceeds 30."
              required: true
              schema:
                type: string
                pattern: "^public, max-age=([0-9]|[12][0-9]|30)$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeedPage"
        "400":
          $ref: "#/components/responses/400"
        "429":
          $ref: "#/components/responses/PerIpRateLimited"
        "500":
          $ref: "#/components/responses/500"

components:
  responses:
    400:
      $ref: "../../v1beta2/core/api.yml#/components/responses/400"
    PerIpRateLimited:
      description: >-
        Too many requests - the client IP exceeded this endpoint's per-IP
        request rate. Wait the number of seconds in `Retry-After` before
        retrying.
      headers:
        Retry-After:
          description: Number of seconds the client must wait before retrying.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "../../v1beta2/core/api.yml#/components/schemas/MeshkitError"
    500:
      $ref: "../../v1beta2/core/api.yml#/components/responses/500"

  parameters:
    page:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/page"
    pageSize:
      name: pageSize
      in: query
      required: false
      description: Number of items per page. The server never returns more than 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  schemas:
    ActivityFeedItem:
      $ref: "./activity_feed_item.yaml"

    ActivityFeedPage:
      type: object
      additionalProperties: false
      description: >-
        One page of the public activity feed, newest item first, in the same
        page/pageSize/totalCount/data shape as PublicUsersPage on the
        public users directory.
      required:
        - page
        - pageSize
        - totalCount
        - data
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page, at most 50.
          minimum: 1
          maximum: 50
        totalCount:
          type: integer
          description: Total number of feed items available.
          minimum: 0
        data:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ActivityFeedItem"
            x-go-type: ActivityFeedItem
          description: Feed items for the requested page, newest first.
