$schema: http://json-schema.org/draft-07/schema#
title: Activity Feed Item
description: |
  One completed scheduled run on the public activity feed. Built at read
  time from an event with category `schedule` and action `completed`
  recorded through the events tracker (`POST /api/events`). Identity comes
  from the authenticated caller, never from event metadata: for events
  with category `schedule` and action `completed` the server sets the
  event's `owner` to the authenticated caller (the session or token owner
  who recorded it), overriding any client-sent value, and `userId` is that
  `owner`. The organization is the event's server-set acting organization,
  if any. Metadata `userId` and `orgId` are informational and ignored.
  Metadata supplies `platform`, `role`, `roleResult`, `networks` and
  `completedAt`. Items are
  ordered by the event's server-recorded creation time, newest first, not
  by `completedAt`. An item appears only while the user exists and the
  user's activity-feed visibility setting, kept in the user's existing
  free-form preferences, is `public` (absent means `public`; a failed
  read omits the user's runs), read live at fetch time, never snapshotted. Email addresses
  and real names are never served. A stored event whose metadata lacks a
  valid `platform`, `role`, `roleResult` or `completedAt` is skipped, never failing
  the feed.
type: object
additionalProperties: false
required:
  - id
  - userId
  - platform
  - role
  - roleResult
  - completedAt
properties:
  id:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: ID of the event the item was built from. Stable across fetches.
    x-go-name: ID
    x-order: 1
  userId:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: The event's `owner`, which the server sets to the authenticated caller who recorded it. Never taken from event metadata.
    x-go-name: UserID
    x-order: 2
  platform:
    type: string
    description: Platform the run acted on, for example `x` or `linkedin`, from the event metadata.
    minLength: 1
    maxLength: 64
    x-order: 3
  role:
    type: string
    description: Short label of the role the run acted in, for example `Launch`, from the event metadata.
    minLength: 1
    maxLength: 64
    x-order: 4
  roleResult:
    type: string
    description: One-line outcome of the run in that role, from the event metadata.
    minLength: 1
    maxLength: 255
    x-order: 5
  completedAt:
    type: string
    format: date-time
    description: >-
      Time the run completed, from the event metadata. Display only; it
      never orders the feed. A value later than the event's server-recorded
      creation time is clamped to that time.
    x-order: 6
  networks:
    type: array
    description: Names of the networks or communities the run reached, from the event metadata. Omitted when the event names none.
    items:
      type: string
      minLength: 1
      maxLength: 255
    maxItems: 20
    x-oapi-codegen-extra-tags:
      json: "networks,omitempty"
    x-order: 7
  displayName:
    type: string
    description: The user's public username, the same value as PublicUser `username` on the public users directory. Never a real name.
    maxLength: 255
    x-oapi-codegen-extra-tags:
      json: "displayName,omitempty"
    x-order: 8
  avatarUrl:
    type: string
    format: uri
    description: Avatar image URL of the user. Resolved at read time; omitted when unavailable.
    maxLength: 2048
    x-go-name: AvatarURL
    x-oapi-codegen-extra-tags:
      json: "avatarUrl,omitempty"
    x-order: 9
  organizationName:
    type: string
    description: Name of the event's server-set acting organization. Omitted when the event has no acting organization or it no longer resolves to a named organization.
    maxLength: 255
    x-oapi-codegen-extra-tags:
      json: "organizationName,omitempty"
    x-order: 10
  publicProfileUrl:
    type: string
    format: uri
    description: URL of the user's public profile. Resolved at read time; omitted when unavailable.
    maxLength: 2048
    x-go-name: PublicProfileURL
    x-oapi-codegen-extra-tags:
      json: "publicProfileUrl,omitempty"
    x-order: 11
