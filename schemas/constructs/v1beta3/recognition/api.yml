openapi: 3.0.0
info:
  title: Recognition
  description: |
    OpenAPI schema for peer recognition. The community guide candidates
    route lists the kudos recipients who reached the unique-giver threshold
    in a UTC calendar month, split into those resolved to a Layer5 user and
    those that need more information. It is read-only; a maintainer awards
    the badge through the existing badge assignment route.
    Authorization: the caller must be a Provider Admin.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []
tags:
  - name: recognition
    description: Operations related to peer recognition.

paths:
  /api/identity/recognition/community-guide/candidates:
    get:
      x-internal: ["cloud"]
      tags:
        - recognition
      summary: Get Community Guide candidates
      operationId: getCommunityGuideCandidates
      description: >
        Returns the kudos recipients with at least the configured number of
        distinct givers in a UTC calendar month, split into candidates
        resolved to a Layer5 user and recipients that need more information.
        Defaults to the previous UTC month.
      parameters:
        - name: month
          in: query
          required: false
          description: UTC calendar month to count, formatted `YYYY-MM`. Defaults to the previous month.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Community Guide candidates for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityGuideCandidates"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "500":
          $ref: "#/components/responses/500"

components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    "400":
      $ref: "../../v1beta2/core/api.yml#/components/responses/400"
    "401":
      $ref: "../../v1beta2/core/api.yml#/components/responses/401"
    "403":
      $ref: "../../v1beta2/core/api.yml#/components/responses/403"
    "500":
      $ref: "../../v1beta2/core/api.yml#/components/responses/500"

  schemas:
    CommunityGuideCandidates:
      type: object
      description: |
        Server-computed list of Community Guide candidates for one UTC calendar
        month. Recipients with at least `minGivers` distinct givers are split
        into `candidates` (resolved to a Layer5 user) and `needsInfo` (not
        resolved). Read-only: a maintainer confirms by awarding the badge
        through the existing badge assignment route.
      additionalProperties: false
      required:
        - month
        - minGivers
        - badge
        - candidates
        - needsInfo
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          description: The UTC calendar month counted, formatted `YYYY-MM`.
        minGivers:
          type: integer
          minimum: 1
          description: Minimum number of distinct givers a recipient needed to be listed.
        badge:
          type: string
          minLength: 1
          description: Slug of the badge the candidates are being considered for.
        candidates:
          type: array
          description: Recipients resolved to a Layer5 user, most givers first.
          items:
            $ref: "#/components/schemas/CommunityGuideCandidate"
            x-go-type: CommunityGuideCandidate
        needsInfo:
          type: array
          description: Recipients who could not be resolved to a Layer5 user.
          items:
            $ref: "#/components/schemas/CommunityGuideNeedsInfo"
            x-go-type: CommunityGuideNeedsInfo
    CommunityGuideCandidate:
      $ref: "./community_guide_candidate.yaml"
    CommunityGuideNeedsInfo:
      $ref: "./community_guide_needs_info.yaml"
