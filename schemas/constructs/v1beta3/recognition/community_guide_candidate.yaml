$schema: http://json-schema.org/draft-07/schema#
title: Community Guide Candidate Schema
description: |
  A kudos recipient who reached the unique-giver threshold for a UTC month
  and resolved to a Layer5 user. A maintainer confirms the award.
type: object
additionalProperties: false
required:
  - userId
  - email
  - provider
  - externalId
  - givers
properties:
  userId:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Layer5 user ID the recipient resolved to.
    x-go-name: UserID
    x-order: 1
  email:
    type: string
    format: email
    maxLength: 320
    description: Email address of the resolved Layer5 user.
    x-order: 2
  provider:
    type: string
    minLength: 1
    maxLength: 32
    description: Identity provider the kudos recipient was recorded under, for example `github`.
    x-order: 3
  externalId:
    type: string
    minLength: 1
    maxLength: 255
    description: The recipient's identifier at the provider, for example a numeric GitHub ID.
    x-go-name: ExternalID
    x-order: 4
  givers:
    type: integer
    minimum: 1
    description: Number of distinct givers who gave the recipient valid kudos in the month.
    x-order: 5
