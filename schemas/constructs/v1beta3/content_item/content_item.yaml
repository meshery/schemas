$schema: http://json-schema.org/draft-07/schema#
title: Content Item Schema
description: |
  Server-returned content item as persisted by the owning service.
  Content items carry a row number and a server-computed fingerprint over
  their canonical values; updates are conditional on the fingerprint the
  writer read, so stale writes are refused rather than silently applied.
  An item may carry its own rules of engagement, which can only tighten,
  and may belong to a thread through `threadId`, `replyToId` and
  `threadIndex`. See docs/content-item-contract.md.
type: object
additionalProperties: false
required:
  - id
  - organizationId
  - profile
  - rowNumber
  - fingerprint
  - createdAt
  - updatedAt
properties:
  id:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Server-generated content item ID.
    x-oapi-codegen-extra-tags:
      db: id
    x-order: 1
  organizationId:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Owning organization ID. Derived from the authenticated session, never client-settable.
    x-go-name: OrganizationID
    x-oapi-codegen-extra-tags:
      db: organization_id
    x-order: 2
  profile:
    type: string
    description: Subject of the owning profile.
    minLength: 1
    maxLength: 255
    x-oapi-codegen-extra-tags:
      db: profile
    x-order: 3
  rowNumber:
    type: integer
    description: Row number of the content item, unique across the live content items of the organization.
    minimum: 0
    x-oapi-codegen-extra-tags:
      db: row_number
    x-order: 4
  fingerprint:
    type: string
    description: >
      Hex digest over the canonical content values (`data`, `profile`,
      `rowNumber` and, when set, `rulesOfEngagement` and `mediaAssetIds`),
      typed so null, empty string, zero and false differ. An item without
      them hashes exactly as it did before the fields existed. The thread fields
      are fixed at insert and are not part of it. Server-computed; used for
      conditional updates.
    minLength: 1
    maxLength: 255
    x-oapi-codegen-extra-tags:
      db: fingerprint
    x-order: 5
  data:
    type: object
    description: Content values, stored as a JSON blob.
    x-go-type: core.Map
    x-go-type-import:
      path: github.com/meshery/schemas/models/core
      name: core
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: data
    x-order: 6
  createdAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
    description: Timestamp of content item creation.
    x-oapi-codegen-extra-tags:
      db: created_at
    x-order: 7
  updatedAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
    description: Timestamp of last content item modification.
    x-oapi-codegen-extra-tags:
      db: updated_at
    x-order: 8
  deletedAt:
    type: string
    format: date-time
    description: Timestamp when the content item was soft-deleted.
    nullable: true
    x-go-type: core.NullTime
    x-go-type-import:
      path: github.com/meshery/schemas/models/core
      name: core
    x-oapi-codegen-extra-tags:
      db: deleted_at
      json: "deletedAt,omitempty"
    x-order: 9
  createdBy:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: >
      ID of the user whose session created the content item. Derived from the
      authenticated session, never client-settable, and never changed by an
      update. Omitted on content items created before it was recorded, and
      when that user was later purged.
    x-go-name: CreatedBy
    x-oapi-codegen-extra-tags:
      db: created_by
      json: "createdBy,omitempty"
    x-order: 10
  rulesOfEngagement:
    $ref: ./api.yml#/components/schemas/ContentItemRulesOfEngagement
    description: >
      The item's own rules of engagement, set by the order that wrote it.
      They can only tighten: the client that runs the item applies the
      stricter of these and the rules that apply to the item's profile and
      platform without them, and the warm-up and the pause after a sign-in
      challenge always apply. The server validates the shape and stores
      the value; it does not resolve it. Omitted when the item has none, in
      which case the item runs under the rules that apply without them.
    x-oapi-codegen-extra-tags:
      db: rules_of_engagement
      json: "rulesOfEngagement,omitempty"
    x-order: 11
  threadId:
    type: string
    format: uuid
    x-go-type: core.Uuid
    x-go-type-import:
      path: github.com/meshery/schemas/models/core
      name: core
    description: >
      ID of the root item of the thread this item belongs to: the first
      post of a split thread, or the first transmission of a conversation
      between profiles. Omitted on a standalone item and on a root itself;
      a root is the item other items name here. Set on insert only.
    x-go-name: ThreadID
    x-oapi-codegen-extra-tags:
      db: thread_id
      json: "threadId,omitempty"
    x-order: 12
  replyToId:
    type: string
    format: uuid
    x-go-type: core.Uuid
    x-go-type-import:
      path: github.com/meshery/schemas/models/core
      name: core
    description: >
      ID of the item this item answers directly: the thread root or another
      item of the same thread. A split thread's part names the part before
      it; a reply in a conversation between profiles names the transmission
      above it. Omitted when the item answers nothing. Never set without
      `threadId`. Set on insert only.
    x-go-name: ReplyToID
    x-oapi-codegen-extra-tags:
      db: reply_to_id
      json: "replyToId,omitempty"
    x-order: 13
  threadIndex:
    type: integer
    description: >
      Position of the item in its thread, counting the root as 0. Present
      exactly when `threadId` is, unique among the live items of the
      thread, and greater than the position of the item named by
      `replyToId`. Set on insert only.
    minimum: 1
    x-oapi-codegen-extra-tags:
      db: thread_index
      json: "threadIndex,omitempty"
    x-order: 14
  mediaAssetIds:
    type: array
    uniqueItems: true
    maxItems: 20
    x-go-type: pq.StringArray
    x-go-type-import:
      path: github.com/lib/pq
    x-go-type-skip-optional-pointer: true
    items:
      type: string
      format: uuid
      description: ID of a media_asset in the same organization.
    description: >
      The media assets the item posts, in posting order. Ids only, never
      URLs. Omitted when the item posts no file.
    x-oapi-codegen-extra-tags:
      db: media_asset_ids
      json: "mediaAssetIds,omitempty"
    x-order: 15
