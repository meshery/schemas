openapi: 3.0.0
info:
  title: ContentItem
  description: |
    OpenAPI schema for content items - fingerprinted content
    values keyed by organization and row number, with conditional
    updates.
    A content item may carry its own rules of engagement
    (`rulesOfEngagement`), which can only tighten the rules its profile and
    platform run under, and may belong to a thread (`threadId`,
    `replyToId`, `threadIndex`): the parts of a split post, or the replies
    of a conversation between profiles.
    An item's approval is resolved at insert and again at each content edit
    from its `approvalPolicy` (explicit `required` or `not_required` wins;
    `inherit` or absent inherits from higher-level settings, hierarchy defined
    in https://github.com/layer5io/meshery-cloud/issues/6365). Interim: until
    the upstream policies exist, `inherit` or absent resolves to `required`.
    A content edit that resolves to required resets an approved item to
    unapproved. Any content edit supersedes the item's open request, if any,
    and an item it leaves unapproved gets a fresh pending request for the
    content as it now is, so after the edit an unapproved item has an open
    request (see updateContentItem and the invariant in
    docs/content-item-contract.md). A change to `approvalPolicy` alone that
    makes approval required resets an approved item the same way. Only a person
    holding Decide Content Item Approvals may write an `approvalPolicy` value
    that changes the stored one.
    Organization scope: every operation acts only in the organization the
    session resolved to (X-Current-Orgid, then the user's selected
    organization), and only when the caller is a live member of it.
    Authorization: each operation requires one permission key in that
    organization (Catalog Management / Content Items: View Content
    Items for the reads, Create Content Item, Edit Content Item and
    Delete Content Item for the writes); a caller without it receives a
    403 before any row is read. Past that check, an id that does not name
    a live content item of the organization, and a caller who is not a
    live member of it, receive the same 404, so the existence of another
    organization's rows is never disclosed.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []
tags:
  - name: contentItems
    description: Operations related to content items.

paths:
  /api/content-items:
    get:
      x-internal: ["cloud"]
      tags:
        - contentItems
      summary: List content items
      operationId: listContentItems
      x-mcp:
        expose: true
        title: List content items
        scope: content:read
      description: |
        Returns a paginated list of the live content items in the
        organization of the authenticated session, ordered by `rowNumber`
        unless `order` names another column (`rowNumber`, `createdAt`,
        `updatedAt`). `search` matches the profile or the content values,
        case-insensitively. `threadId` returns one whole thread: the root
        item it names and every live item whose `threadId` names it,
        ordered by `threadIndex` (the root first) unless `order` names
        another column.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/pagesize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/order"
        - name: profile
          in: query
          required: false
          description: Filter by owning profile subject (exact match).
          schema:
            type: string
        - $ref: "#/components/parameters/threadId"
        - $ref: "#/components/parameters/currentOrgId"
      responses:
        "200":
          description: Content item page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItemPage"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/MeshkitError429"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - contentItems
      summary: Insert a content item
      operationId: insertContentItem
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      description: |
        Inserts a new content item. Insert-only: any supplied
        `id` and `expectedFingerprint` are ignored; existing rows change
        only through the conditional `updateContentItem`. The
        `fingerprint` is server-computed. Row numbers are unique across
        the live content items of the organization, whatever their
        `profile`. When `rowNumber` is omitted the server assigns the next
        row number of the organization (one more than the highest row
        number the organization has used, counting soft-deleted content
        items so a deleted item's number is not handed out again by
        assignment), atomically with the insert, so
        concurrent inserts never receive the same number. An organization
        that has never had a content item is assigned row number 1 first
        (an explicit `rowNumber` of 0 is still accepted). A supplied
        `rowNumber` that another live content item of the organization
        already holds refuses the insert with a 409 (`code`
        `row_number_taken`).
        A `rulesOfEngagement` outside its schema (an unknown preset or
        dial, or a value out of range) is refused with a 400, on insert
        and on update alike.
        Each `mediaAssetIds` entry must name a media asset of the session
        organization, else 400 (the same 400 for a missing, another
        organization's and a deleted asset), on insert and on update alike.
        The server does not require the asset to be ready at write time:
        deleting an asset does not check content item references, and such
        an item is refused by name when it posts, so the posting client
        checks readiness.
        Thread fields are checked against the organization's live content
        items in the same transaction as the insert, and a violation is
        refused with a 400: `threadId` must name a live item of the
        organization that is not itself part of a thread; `replyToId`
        requires `threadId` and must name that root or a live item of the
        same thread; `threadIndex` is required exactly when `threadId` is
        given and must exceed the position of the item `replyToId` names
        (the root counts as 0). An item of another organization, a deleted
        item and a missing one receive the same 400. A `threadIndex` that
        another live item of the same thread already holds refuses the
        insert with a 409 (`code` `thread_index_taken`).
        The optional `Idempotency-Key` header makes the insert safe to
        retry: within 24 hours the same key with the same request hash
        returns the first response without inserting again, and the same
        key with a different request hash answers 422 and inserts nothing.
        A retry with the same key that arrives while the first request with
        that key is still being processed answers 409 with the body `code`
        `idempotency_key_in_flight` and inserts nothing; the client retries
        later and then receives the stored response. Precedence: while the
        first request with a key is in flight, every retry with that key
        answers 409 whatever its body; only once the first request has finished
        does a retry with a different body answer 422. An in-flight claim on a
        request that never finished expires 24 hours after it was taken, the
        same TTL as the stored response (no shorter in-flight lease applies),
        and a retry after that is processed as new. The permanent 409s of
        this operation carry `row_number_taken` and `thread_index_taken`, so
        a client tells the in-flight case by its `code`.
        A caller whose effective keys lack Decide Content Item Approvals in
        the session organization who sends `approvalPolicy` `required` or
        `not_required` gets a 403 and nothing is inserted; a caller holding
        that key may send any value. Omitted or `inherit`, the item inherits
        (the server stores both as null, so they are the same value). The server resolves the effective approval once,
        here: when it is required the item lands `approved` false with a
        pending `content_item_approval` request; when it is not required the
        server sets `approved` true and opens no request. Interim: until the
        upstream policies exist, inherit resolves to required.
        `approved` is never in the payload (docs/content-item-contract.md,
        Approval policy).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentItemPayload"
      responses:
        "201":
          description: Content item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/InsertConflict"
        "422":
          $ref: "#/components/responses/422"
        "429":
          $ref: "#/components/responses/MeshkitError429"
        "500":
          $ref: "#/components/responses/500"

  /api/content-items/{contentItemId}:
    get:
      x-internal: ["cloud"]
      tags:
        - contentItems
      summary: Get a content item by ID
      operationId: getContentItem
      x-mcp:
        expose: true
        title: Get a content item
        scope: content:read
      parameters:
        - $ref: "#/components/parameters/contentItemId"
        - $ref: "#/components/parameters/currentOrgId"
      responses:
        "200":
          description: Content item response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "429":
          $ref: "#/components/responses/MeshkitError429"
        "500":
          $ref: "#/components/responses/500"
    put:
      x-internal: ["cloud"]
      tags:
        - contentItems
      summary: Update a content item
      operationId: updateContentItem
      description: |
        Conditionally updates the content item. When
        `expectedFingerprint` is supplied and stale, the update is
        refused with a 409, as is an update that would move the item
        onto a `rowNumber` another live content item of the organization
        holds. An omitted `rowNumber` keeps the stored one.
        An omitted `rulesOfEngagement` keeps the stored rules and `null`
        clears them, so a writer that does not know the field never erases
        it. An omitted `mediaAssetIds` keeps the stored list and `[]`
        clears it. The thread fields are fixed at insert: omitted, or equal to the
        stored values, they are kept; any other value is refused with a 400.
        `approved` is not in the payload, and no update sets it to true;
        only `approveRequest` does. A content edit, or an `approvalPolicy`
        change that makes approval required, can reset it, as described
        below. A caller without Decide Content Item
        Approvals gets a 403 if it sends an `approvalPolicy` different from
        the stored one (absent, null and `inherit` count as one value, since
        the server stores `inherit` as null);
        sending back the unchanged stored value is accepted and changes
        nothing. An omitted `approvalPolicy` keeps the stored value and is not
        a change, so it is never refused.
        Approval on a content edit. An update that changes the item's
        content re-resolves its effective approval in the same transaction,
        with the same rule as insert: the `approvalPolicy` the update stores,
        then the higher-level settings (interim: `inherit` or absent resolves
        to `required`). It records `approvalRequired` and
        `approvalPolicySource` again. Content is `profile`, `rowNumber`,
        `data` (without the server-owned `Approved?` mirror),
        `rulesOfEngagement` and `mediaAssetIds`, the fields the fingerprint
        covers, compared with the stored values, so a write-back that sends
        them unchanged is not an edit. These never trigger it: the
        `approvalPolicy` (a change to it alone is handled below),
        `expectedFingerprint`, `id` and the thread fields (`threadId`,
        `replyToId`, `threadIndex`, fixed at insert).
        When approval resolves to required, an item that was `approved` is set
        to `approved` false. The item's open `content_item_approval` request,
        if it has one, is superseded: it is closed with `status` `superseded`,
        `decidedAt` set to the edit time, and no `decidedBy` and no `note`.
        When approval resolves to not required, `approved` is unchanged: an
        approved item stays approved and opens no request. Whatever the
        resolved approval, an item the edit leaves unapproved gets a fresh
        pending request for the content as it now is, in the same
        transaction, so after the edit an unapproved item has an open request
        (the open-request invariant in docs/content-item-contract.md). An
        update never approves: the item stays unapproved until a decider
        approves that request. A failed write keeps every change, the item and
        its requests alike.
        Approval on an `approvalPolicy` change. A write that changes the stored
        policy and no content re-resolves the approval the same way, in the
        same transaction. When the result is required and the item was
        `approved`, `approved` is set to false and a pending request opens,
        unless one is already pending. Any other result changes no `approved`
        and closes no request: loosening the requirement leaves an unapproved
        item unapproved, and its open request stays pending for a decider. An
        unapproved item with no open request, after a denial for example, gets
        a fresh pending request in the same write, whatever the result. The
        stored `approvalRequired` and `approvalPolicySource` are rewritten to
        the new result. Sending back the unchanged stored policy re-resolves
        nothing. A write that changes nothing (a whole-item write-back of the
        stored content and policy) opens no request and closes none, so a
        denied item stays denied until a content edit or an `approvalPolicy`
        change. This applies to every writer, a person included.
      parameters:
        - $ref: "#/components/parameters/contentItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentItemPayload"
      responses:
        "200":
          description: Content item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "429":
          $ref: "#/components/responses/MeshkitError429"
        "500":
          $ref: "#/components/responses/500"
    delete:
      x-internal: ["cloud"]
      tags:
        - contentItems
      summary: Delete a content item
      operationId: deleteContentItem
      description: |
        Soft-deletes the content item. When `expectedFingerprint` is
        supplied, the delete applies only when the stored fingerprint
        still matches and is refused with a 409 otherwise; without it the
        delete is unconditional. Deleting an item that other items name in
        `threadId` or `replyToId` leaves their references as they are.
      parameters:
        - $ref: "#/components/parameters/contentItemId"
        - $ref: "#/components/parameters/expectedFingerprint"
      responses:
        "204":
          description: Content item deleted
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "429":
          $ref: "#/components/responses/MeshkitError429"
        "500":
          $ref: "#/components/responses/500"

components:
  securitySchemes:
    jwt:
      type: http
      scheme: Bearer [REDACTED]
      bearerFormat: JWT

  responses:
    422:
      $ref: "../../v1beta2/core/api.yml#/components/responses/422"
    400:
      $ref: "../../v1beta2/core/api.yml#/components/responses/400"
    401:
      $ref: "../../v1beta2/core/api.yml#/components/responses/401"
    404:
      $ref: "../../v1beta2/core/api.yml#/components/responses/404"
    403:
      $ref: "../../v1beta2/core/api.yml#/components/responses/403"
    409:
      description: Conflict - the stale expectedFingerprint precondition no longer matches the stored content fingerprint, or another live content item of the organization already holds the same rowNumber. Nothing changes.
      content:
        text/plain:
          schema:
            type: string
    InsertConflict:
      description: >
        Conflict on insert. The body's `code` says which: `row_number_taken`
        or `thread_index_taken` is permanent for this payload, and
        `idempotency_key_in_flight` is a retry whose first request with the
        same Idempotency-Key is still being processed (retry later to receive
        the stored response). Nothing is inserted in any case.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ContentItemInsertConflict"
              - $ref: "../../v1beta2/core/api.yml#/components/schemas/IdempotencyKeyInFlightError"
    MeshkitError429:
      $ref: "../../v1beta2/core/api.yml#/components/responses/MeshkitError429"
    500:
      $ref: "../../v1beta2/core/api.yml#/components/responses/500"

  parameters:
    expectedFingerprint:
      name: expectedFingerprint
      in: query
      description: |
        Optional optimistic-concurrency precondition for delete: the
        delete applies only when the stored fingerprint still matches.
      required: false
      schema:
        type: string
        maxLength: 255
    threadId:
      name: threadId
      in: query
      required: false
      description: |
        Return one thread: the root item this ID names and every live item
        whose `threadId` names it.
      schema:
        $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
    currentOrgId:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/currentOrgId"
    idempotencyKey:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/idempotencyKey"
    contentItemId:
      name: contentItemId
      in: path
      description: Content item ID
      required: true
      schema:
        $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
    page:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/page"
    pageSize:
      name: pageSize
      in: query
      description: Number of items per page (canonical camelCase form).
      schema:
        type: integer
        minimum: 1
    pagesize:
      name: pagesize
      in: query
      description: |
        Number of items per page. Deprecated alias of pageSize;
        canonical `pageSize` wins when both are present.
      deprecated: true
      schema:
        type: integer
        minimum: 1
    search:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/search"
    order:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/order"

  schemas:
    ContentItem:
      $ref: "./content_item.yaml"

    ContentItemPayload:
      type: object
      description: |
        Payload for inserting or updating a content item.
        Contains only client-settable fields; the owning
        `organizationId` (derived from the authenticated session), the
        server-computed `fingerprint`, the server-set `createdByClient`,
        `approved` (set only by `approveRequest` in the request construct),
        the server-computed `approvalRequired` and `approvalPolicySource`
        and the server-generated `createdAt` / `updatedAt` timestamps are
        intentionally excluded. `approvalPolicy` is the one approval field a
        write carries; a caller without Decide Content Item Approvals may send
        only the stored value, or omit it (docs/content-item-contract.md,
        Approval policy).
      required:
        - profile
      properties:
        id:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: Existing content item ID for updates; ignored on insert.
          x-oapi-codegen-extra-tags:
            json: "id,omitempty"
        profile:
          type: string
          description: Subject of the owning profile.
          minLength: 1
          maxLength: 255
        rowNumber:
          type: integer
          description: |
            Row number of the content item, unique across the live content
            items of the organization. Optional: omitted on insert, the
            server assigns the next row number of the organization; omitted
            on update, the stored row number is kept.
          minimum: 0
        data:
          type: object
          description: Content values, stored as a JSON blob.
          x-go-type: core.Map
          x-go-type-import:
            path: github.com/meshery/schemas/models/core
            name: core
          x-go-type-skip-optional-pointer: true
        expectedFingerprint:
          type: string
          description: |
            Optimistic-concurrency precondition for update: when supplied,
            the update applies only when the stored fingerprint still
            matches, and is refused with a 409 otherwise. Ignored on
            insert.
          maxLength: 255
        rulesOfEngagement:
          allOf:
            - $ref: "#/components/schemas/ContentItemRulesOfEngagement"
          description: |
            The item's own rules of engagement, which can only tighten the
            rules its profile and platform run under. Omitted on insert, the
            item has none; omitted on update, the stored rules are kept;
            `null` on update clears them.
          nullable: true
          x-oapi-codegen-extra-tags:
            json: "rulesOfEngagement,omitempty"
        threadId:
          type: string
          format: uuid
          x-go-type: core.Uuid
          x-go-type-import:
            path: github.com/meshery/schemas/models/core
            name: core
          description: |
            ID of the thread's root item. Read on insert; on update it must
            be omitted or equal the stored value.
          x-go-name: ThreadID
          x-oapi-codegen-extra-tags:
            json: "threadId,omitempty"
        replyToId:
          type: string
          format: uuid
          x-go-type: core.Uuid
          x-go-type-import:
            path: github.com/meshery/schemas/models/core
            name: core
          description: |
            ID of the item this item answers directly: the root named by
            `threadId` or an item of the same thread. Requires `threadId`.
            Read on insert; on update it must be omitted or equal the stored
            value.
          x-go-name: ReplyToID
          x-oapi-codegen-extra-tags:
            json: "replyToId,omitempty"
        threadIndex:
          type: integer
          description: |
            Position of the item in its thread, the root counting as 0.
            Required exactly when `threadId` is given. Read on insert; on
            update it must be omitted or equal the stored value.
          minimum: 1
        mediaAssetIds:
          type: array
          uniqueItems: true
          maxItems: 20
          x-go-type: pq.StringArray
          x-go-type-import:
            path: github.com/lib/pq
          x-go-type-skip-optional-pointer: true
          items:
            type: string
            format: uuid
            description: ID of a media_asset in the same organization.
          description: |
            The media assets the item posts, in posting order. Omitted on
            insert means none; omitted on update keeps the stored list (old
            clients send the whole item without it); an empty array clears it.
          x-oapi-codegen-extra-tags:
            json: "mediaAssetIds,omitempty"
        approvalPolicy:
          $ref: "#/components/schemas/ApprovalPolicy"
          description: |
            The item's own approval policy. Optional: omitted on insert, the
            item inherits; omitted on update, the stored value is kept;
            `inherit` on update clears an explicit value back to inherit.
            A caller without Decide Content Item Approvals in the session
            organization is refused with a 403 and nothing changes when it
            sends a value that would change the stored one: on insert,
            `required` or `not_required`; on update, a value different from
            the stored one (absent, null and `inherit` are one value, since the
            server stores `inherit` as null). Sending back the unchanged stored value
            is accepted, and an omitted value on update keeps the stored one and is
            never refused. An AI app token never carries that key. Interim: until
            the upstream policies exist, `inherit` or absent resolves to
            `required`, and the item's approval source is `item` for an
            explicit value or `fallback` for `inherit` or absent.
          x-oapi-codegen-extra-tags:
            json: "approvalPolicy,omitempty"

    # The approval policy of a content item, and the setting a higher level
    # (platform, workspace, profile) would use for the same question. It is
    # defined once here so that reuse, not a copy, is what a higher-level
    # setting refers to.
    ApprovalPolicy:
      type: string
      description: |
        Whether an item needs a person's approval before it runs. `required`
        and `not_required` are explicit and win over every higher-level
        setting. `inherit`, and an absent value, inherit from higher-level
        settings (platform, workspace, profile), hierarchy defined in
        https://github.com/layer5io/meshery-cloud/issues/6365. When no level
        sets a value, approval is required (fail closed); this fallback is
        still open for confirmation in that issue. The effective result is
        resolved at insert, again at each content edit, and again when the
        stored value changes. AI apps can never set
        `approved`; this value only says whether approval is needed.
        Interim: until the upstream platform, workspace and profile policies
        exist, `inherit` and an absent value resolve to `required`, with
        approval source `fallback`. The user preference
        `agentsActWithoutApproval` is not consulted during the interim.
      enum:
        - required
        - not_required
        - inherit
      x-enum-varnames:
        - ApprovalPolicyRequired
        - ApprovalPolicyNotRequired
        - ApprovalPolicyInherit

    ContentItemInsertConflict:
      type: object
      description: Body of an insert refused for a permanent conflict with the content. `code` is the machine-readable reason and `message` the sentence the caller is shown. The in-flight retry body is `IdempotencyKeyInFlightError` in v1beta2 core.
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >
            `row_number_taken`: a live item of the organization holds the
            `rowNumber`. `thread_index_taken`: a live item of the same thread
            holds the `threadIndex`.
          enum:
            - row_number_taken
            - thread_index_taken
        message:
          type: string
          minLength: 1
          description: The sentence the caller is shown.

    ContentItemRulesOfEngagement:
      type: object
      x-generate-db-helpers: true
      additionalProperties: false
      description: |
        A content item's own rules of engagement: a Posture preset and,
        optionally, dials changed for this item only. Every value can only
        tighten. The client that runs the item resolves the effective rules
        as the stricter of these and the rules that apply to its profile and
        platform without them (the more cautious preset wins, and each dial
        applies only where it is stricter than the resolved preset's own);
        the warm-up and the pause after a sign-in challenge always apply.
        The server validates the shape and stores the value as given; it
        never resolves or loosens it.
      required:
        - preset
      properties:
        preset:
          $ref: "../posture/api.yml#/components/schemas/Posture"
          x-go-type: "posturev1beta3.Posture"
          x-go-type-import:
            path: github.com/meshery/schemas/models/v1beta3/posture
            name: posturev1beta3
          description: |
            The preset the item asks for. It applies only when it is at
            least as cautious as the preset its profile and platform
            resolve to.
        dials:
          $ref: "#/components/schemas/ContentItemRulesOfEngagementDials"
          description: |
            Dials changed for this item only. Omitted when none were
            changed; present, the item's rules read as adjusted.

    ContentItemRulesOfEngagementDials:
      type: object
      additionalProperties: false
      description: |
        Dials of a content item's rules of engagement. Each is optional and
        applies only where it is stricter than the resolved preset's own
        value; a dial that would loosen is ignored by the client that runs
        the item.
      properties:
        pace:
          type: string
          description: Typing and interaction pace.
          enum:
            - slow
            - normal
            - fast
          x-enum-varnames:
            - ContentItemPaceSlow
            - ContentItemPaceNormal
            - ContentItemPaceFast
        minDelaySeconds:
          type: integer
          description: Least time, in seconds, between two public actions on one platform for one profile.
          minimum: 0
          maximum: 86400
        quietHours:
          $ref: "#/components/schemas/ContentItemQuietHours"
          description: Local hours with no public actions.
        capFraction:
          type: number
          format: double
          description: Share of each built-in daily cap the item may use, above 0 and at most 1.
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
        noMouseMove:
          type: boolean
          description: Whether the item runs without pointer movement.

    ContentItemQuietHours:
      type: object
      additionalProperties: false
      description: |
        A window of local hours with no public actions, from `start` up to
        `end`, wrapping past midnight when `end` is earlier than `start`.
      required:
        - start
        - end
      properties:
        start:
          type: integer
          description: Local hour the window opens.
          minimum: 0
          maximum: 23
        end:
          type: integer
          description: Local hour the window closes.
          minimum: 0
          maximum: 23

    ContentItemPage:
      type: object
      description: Paginated collection of content items.
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
        contentItems:
          type: array
          items:
            $ref: "#/components/schemas/ContentItem"
            x-go-type: ContentItem
          description: Content items included on this page of results.
