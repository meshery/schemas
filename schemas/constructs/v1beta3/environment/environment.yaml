  purpose:
    type: string
    description: >-
      What the environment exists for. `user` is an ordinary environment that
      people create to logically group Connections and their Credentials.
      `administrative` designates an environment the platform itself
      provisions to hold organization-level configuration, and which resolvers
      of that configuration therefore trust.


      Absent means `user`. Nothing may read an unset or unrecognised value as
      administrative: test for the administrative value explicitly rather than
      for "not user", so the property fails closed.


      Server-owned and not client-settable. It is absent from
      `EnvironmentPayload`, which every POST and PUT requestBody references,
      so no generated client has a field to send it in. That exclusion is a
      codegen guarantee, never access control: every consumer MUST also refuse
      to set it from request input on its own side, and assign it only from
      server-side provisioning or a data migration. Permission to create an
      environment does not confer the ability to make one administrative.


      The uniqueness invariant, the fail-closed resolver requirement and the
      migration path for environments that are administrative by naming
      convention today are specified in
      docs/environment-purpose-contract.md.
    enum:
      - user
      - administrative
    # No `readOnly: true` here, despite it being the natural annotation for a
    # server-owned property, because the RTK client generator mis-handles it.
    # oazapfts' checkSchemaOnlyMode propagates readOnly UP the containment tree
    # through inlined subschemas, and its writeOnly-mode property filter then
    # drops any property whose subtree contains one. Environment is inlined
    # into the registrant connection carried by registerRegistryComponent and
    # registerRegistryRelationship, so a readOnly here silently deleted the
    # whole `connection` field from those two request types - a required field
    # vanishing from the published client with no build or validation failure.
    # tests/readonly-request-body.test.js pins that no schema reachable from a
    # requestBody carries readOnly. Payload exclusion is what actually keeps
    # this property off client-settable surfaces; see
    # docs/environment-purpose-contract.md.
    # oapi-codegen names enum constants after the value alone unless two enums
    # in the same package collide, which here would emit a package-level
    # `environment.User = "user"` - a name that reads like the User construct
    # and invites a wrong import. x-enum-varnames pins the self-describing
    # spelling instead. Existing enums keep their generated names because
    # renaming a published constant breaks downstream consumers; reach for
    # this only where the generated name is genuinely misleading.
    x-enum-varnames:
      - EnvironmentPurposeUser
      - EnvironmentPurposeAdministrative
    # No `default:` here on purpose. openapi-typescript reads a default on a
    # response property as a promise the server always sends the field, and
    # emits it non-optional - untrue for every row written before the column
    # existed, which omits it. The absent-means-user rule is stated above; the
    # column-level DEFAULT belongs in each consumer's migration.
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: purpose
      json: "purpose,omitempty"
    x-order: 11
