$schema: http://json-schema.org/draft-07/schema#
title: Ledger Entry Schema
description: >
  Server-returned ledger entry. An organization keeps any number of named
  ledgers, each an idempotent set keyed by entryKey: recording an existing
  key never creates a second entry and never changes that entry, and
  claim-if-absent gives a key to exactly one claiming connection, so two
  workers never both act on it. Change a stored value with updateLedgerEntry,
  which replaces the value wholesale and advances updatedAt. Any organization
  member may read, update and delete entries; a claim names the connection
  that holds it, which must be the caller's own live connection in the
  organization. An update does not check who holds a claim.
type: object
additionalProperties: false
required:
  - id
  - organizationId
  - ledger
  - entryKey
  - createdAt
  - updatedAt
properties:
  id:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Server-generated ledger entry ID.
    x-order: 1
  organizationId:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Owning organization ID. Derived from the authenticated session, never client-settable.
    x-go-name: OrganizationID
    x-oapi-codegen-extra-tags:
      db: organization_id
    x-order: 2
  ledger:
    type: string
    description: Name of the ledger (the idempotent set) the entry belongs to.
    minLength: 1
    maxLength: 255
    x-oapi-codegen-extra-tags:
      db: ledger
    x-order: 3
  entryKey:
    type: string
    description: Key within the ledger. Unique per (organization, ledger).
    minLength: 1
    maxLength: 1024
    x-go-name: EntryKey
    x-oapi-codegen-extra-tags:
      db: entry_key
    x-order: 4
  value:
    type: object
    description: Entry value, stored as a JSON blob.
    x-go-type: core.Map
    x-go-type-import:
      path: github.com/meshery/schemas/models/core
      name: core
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: value
    x-order: 5
  claimedByConnectionId:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: >
      ID of the connection that holds the entry, if any. Set only by
      claim-if-absent and never changed afterwards. References a connection
      (`connections.id`); a claim held by a connection that is later deleted
      is released, so the key may be claimed again. Omitted when the entry is
      unclaimed.
    x-go-name: ClaimedByConnectionID
    x-oapi-codegen-extra-tags:
      db: claimed_by_connection_id
      json: "claimedByConnectionId,omitempty"
    x-order: 6
  claimedAt:
    type: string
    format: date-time
    description: Time the current or most recent claim was taken. Set only by claim-if-absent; null when the entry was never claimed. An entry whose claimedByConnectionId is omitted is unclaimed whatever this holds.
    nullable: true
    x-go-type: core.NullTime
    x-go-type-import:
      path: github.com/meshery/schemas/models/core
      name: core
    x-oapi-codegen-extra-tags:
      db: claimed_at
    x-order: 7
  createdAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
    description: Timestamp of ledger entry creation.
    x-oapi-codegen-extra-tags:
      db: created_at
    x-order: 8
  updatedAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
    description: Timestamp of last ledger entry modification; advances on every update.
    x-oapi-codegen-extra-tags:
      db: updated_at
    x-order: 9
