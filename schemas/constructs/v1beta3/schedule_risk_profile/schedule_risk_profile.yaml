$schema: http://json-schema.org/draft-07/schema#
title: Schedule Risk Profile Schema
description: |
  The Risk Profile one schedule runs under, proposed as the type of an
  optional `riskProfile` property on the schedule construct's `Schedule`
  and `SchedulePayload` components (meshery/schemas
  `v1beta3/schedule`). A schedule that carries `riskProfile` runs that
  preset end to end - pace, share of each built-in cap, quiet hours and
  the pause after a sign-in challenge - instead of the preset its profile
  and platform would otherwise resolve to; a schedule that omits it
  inherits that resolution unchanged. The value is a preset name, never
  `custom`: custom is a reported state of a profile with a dial set
  outside its preset, not a choice a schedule can make. Until a
  meshery/schemas release carries the field, Blowhorn keeps the value in
  the schedule's `params` (as `riskProfile`, beside `driverMode`) and in
  its local `schedule_jobs.risk_profile` column, and reads the projected
  form of this component by name.
type: string
enum:
  - cautious
  - standard
  - brisk
