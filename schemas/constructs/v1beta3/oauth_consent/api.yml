openapi: 3.0.0
info:
  title: OauthConsent
  description: |
    OpenAPI schema for the OAuth consents of the signed-in user: the OAuth
    clients (connected apps) the user has allowed to act on their behalf, and
    the operation that withdraws that permission.

    A consent is created by the authorization server's consent step, never by
    a call defined here, so the construct has no write payload. It belongs to
    the user and to one client. Unique key: (user, `clientId`) among live
    consents: a user has at most one live consent per client.
    Both operations act only on the consents of the authenticated user; they
    take no user in the path or the query, and a consent of another user is
    never listed, never revealed and never revoked.

    Revoking a consent withdraws the user's permission for the client and
    revokes every token the client holds for that user, so the client's next
    call is refused and it must ask for consent again. A revoked consent is
    soft-deleted (`deletedAt` set) and is no longer listed.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []
tags:
  - name: oauthConsents
    description: Operations related to the OAuth consents of the signed-in user.

paths:
  /api/identity/oauth/consents:
    get:
      x-internal: ["cloud"]
      tags:
        - oauthConsents
      summary: List OAuth consents
      operationId: getOauthConsents
      description: |
        Returns a page of the live OAuth consents of the signed-in user, one
        entry per client, most recently granted first. Revoked consents are
        not listed. A user with no consented client receives an empty page.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: OAuth consents of the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthConsentPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    delete:
      x-internal: ["cloud"]
      tags:
        - oauthConsents
      summary: Revoke an OAuth consent
      operationId: deleteOauthConsent
      description: |
        Revokes the signed-in user's consent for the client named by the
        required `clientId` query parameter, and revokes every access and
        refresh token that client holds for the user. The consents and tokens
        of other users of the same client are untouched. Answers 204 with no
        body. The consent is soft-deleted: its `deletedAt` is set and it is no
        longer listed. A client the user has no live consent for, whether it
        never existed, was never consented to or was already revoked, is a
        404.
      parameters:
        - $ref: "#/components/parameters/clientId"
      responses:
        "204":
          description: OAuth consent revoked
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    400:
      $ref: "../../v1beta2/core/api.yml#/components/responses/400"
    401:
      $ref: "../../v1beta2/core/api.yml#/components/responses/401"
    404:
      $ref: "../../v1beta2/core/api.yml#/components/responses/404"
    500:
      $ref: "../../v1beta2/core/api.yml#/components/responses/500"

  parameters:
    page:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/page"
    pageSize:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/pageSize"
    clientId:
      name: clientId
      in: query
      description: OAuth client ID of the consent to revoke. An identifier issued by the authorization server, not a UUID.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255

  schemas:
    OauthConsent:
      $ref: "./oauth_consent.yaml"
    OauthConsentPage:
      type: object
      description: Paginated collection of the signed-in user's live OAuth consents.
      required:
        - page
        - pageSize
        - totalCount
        - oauthConsents
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
        oauthConsents:
          type: array
          items:
            $ref: "#/components/schemas/OauthConsent"
            x-go-type: OauthConsent
          description: OAuth consents included on this page of results.
