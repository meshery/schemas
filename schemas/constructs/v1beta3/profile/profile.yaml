$id: https://schemas.meshery.io/profile.yaml
$schema: http://json-schema.org/draft-07/schema#
title: Profile
description: >-
  A profile is a publishing or persona profile: a named set of settings, owned
  by an organization, that a person or brand publishes as, with the platform
  accounts it acts through linked to it as Connections. It is not the user
  account profile (`/api/identity/users/profile`) and not a performance
  profile (`/api/performance/profiles`), and it is neither an environment nor a
  workspace. Like environments, a profile is assigned to any number of
  workspaces, and workspace assignment is how access to it is granted: a
  profile is readable by members of the workspaces it is assigned to and by
  organization admins.
additionalProperties: false
type: object
example:
  id: 00000000-0000-0000-0000-000000000000
  schemaVersion: profiles.meshery.io/v1beta3
  name: jane
  description: Profile for Jane's accounts and settings.
  organizationId: 00000000-0000-0000-0000-000000000000
  owner: 00000000-0000-0000-0000-000000000000
  userId: 00000000-0000-0000-0000-000000000000
  metadata: {}
  createdAt: "0001-01-01T00:00:00Z"
  updatedAt: "0001-01-01T00:00:00Z"
  deletedAt: null
required:
  - id
  - schemaVersion
  - name
  - organizationId
  - owner
  - createdAt
  - updatedAt
properties:
  id:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Server-generated profile ID.
    x-order: 1
    x-go-name: ID
    x-oapi-codegen-extra-tags:
      db: id
      json: id
  schemaVersion:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/VersionString
    description: Specifies the version of the schema to which the profile conforms.
    x-order: 2
    x-oapi-codegen-extra-tags:
      json: schemaVersion
      db: "-"
      gorm: "-"
    default: profiles.meshery.io/v1beta3
  name:
    type: string
    description: Name of the profile, typically its short handle. Not unique; like environment names, two profiles may share one.
    minLength: 1
    maxLength: 255
    x-order: 3
    x-oapi-codegen-extra-tags:
      db: name
      json: name
  description:
    type: string
    description: Description of the profile.
    maxLength: 1000
    x-order: 5
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: description
      json: "description,omitempty"
  organizationId:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: Owning organization ID. Fixed at creation.
    x-order: 6
    x-go-name: OrganizationID
    x-oapi-codegen-extra-tags:
      db: organization_id
      json: organizationId
  owner:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: >-
      ID of the user who owns the profile. Defaults to the creating user. The
      owner, or a holder of the Edit Profile key in a workspace the profile is
      assigned to, may transfer it. When the owner's account is deleted,
      ownership passes on by the same succession rule that applies to designs.
    x-order: 7
    x-oapi-codegen-extra-tags:
      db: owner
      json: owner
  userId:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
    description: >-
      ID of the user this profile represents, when it represents a user.
      Absent for a profile that represents no user account, such as a brand.
      Not unique: a user may be represented by more than one profile.
    x-order: 8
    x-go-name: UserID
    x-oapi-codegen-extra-tags:
      db: user_id
      json: "userId,omitempty"
  metadata:
    type: object
    description: Free-form settings of the profile, stored as a JSON blob.
    x-order: 9
    x-go-type: core.Map
    x-go-type-import:
      path: github.com/meshery/schemas/models/core
      name: core
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: metadata
      json: metadata
  createdAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
    description: Timestamp when the profile was created.
    x-order: 10
    x-oapi-codegen-extra-tags:
      db: created_at
      json: createdAt
  updatedAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
    description: Timestamp when the profile was last updated.
    x-order: 11
    x-oapi-codegen-extra-tags:
      db: updated_at
      json: updatedAt
  deletedAt:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/NullTime
    description: Timestamp when the profile was soft-deleted. Null while the profile remains active.
    nullable: true
    x-order: 12
    x-go-type: core.NullTime
    x-go-type-import:
      path: github.com/meshery/schemas/models/core
      name: core
    x-oapi-codegen-extra-tags:
      db: deleted_at
      json: "deletedAt,omitempty"
