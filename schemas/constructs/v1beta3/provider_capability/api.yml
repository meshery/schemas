openapi: 3.0.0
info:
  title: ProviderCapability
  description: |
    OpenAPI schema for the remote provider's capabilities document: what the
    provider supports and where, read by a client right after it
    authenticates. It is the provider-level manifest (provider identity,
    package, extensions, advertised features and their endpoints), not the
    model capability construct. Besides the features list it carries a
    `contractVersion`, so a client can refuse a provider whose contract major
    it does not speak, and, for an authenticated request that names an
    organization in `X-Current-Orgid`, a `membership` block saying whether the
    caller is a live member of that organization. An unauthenticated request
    still receives the document, without `membership`, so a client can tell
    "not signed in" from "signed in but not a member" from "old provider"
    (no `contractVersion`).

    A client that names itself with the `client` query parameter also
    receives `compatibility`: whether its version (the `{version}` path
    parameter) meets the provider's minimum for that client. The document is
    always answered with 200 for an outdated client, so the client learns
    from it that it must update. An authenticated request additionally
    receives `session`: the caller's roles, the plan and the entitlements of
    the caller's roles and, when the caller is a live member of the
    organization in `X-Current-Orgid`, that organization's plan, entitlements
    and registered device usage.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []
  - {}
tags:
  - name: capabilities
    description: Operations related to the provider's capabilities document.

paths:
  /{version}/capabilities:
    get:
      x-internal: ["cloud"]
      tags:
        - capabilities
      summary: Get the provider's capabilities
      operationId: getProviderCapabilities
      description: |
        Returns the capabilities document for a client of the given version.
        Authentication is optional: with a valid token the document reflects
        the caller's roles, and with a valid token plus `X-Current-Orgid` it
        also carries `membership`. An invalid or absent token is not an error;
        the document is returned without `membership`. A malformed
        `X-Current-Orgid` is a client error and returns 400. With `client`,
        the document carries `compatibility` for that client at `{version}`;
        an outdated client still receives 200 with `compatible` false. With a
        valid token the document carries `session`; for a live member of the
        `X-Current-Orgid` organization it includes that organization's plan,
        entitlements and device usage.
      parameters:
        - $ref: "#/components/parameters/version"
        - $ref: "#/components/parameters/currentOrgId"
        - $ref: "#/components/parameters/client"
        - name: os
          in: query
          description: Operating system of the client, used to select packages.
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: The capabilities document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCapability"
        "400":
          $ref: "../../v1beta2/core/api.yml#/components/responses/400"
        "500":
          $ref: "#/components/responses/500"

components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    500:
      $ref: "../../v1beta2/core/api.yml#/components/responses/500"
    ClientUpgradeRequired:
      description: >
        The client's version is below the provider's minimum for that client.
        The client must update before it can register or keep a connection
        alive; the body names the minimum and where to get an update.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClientUpgradeRequiredError"

  parameters:
    version:
      name: version
      in: path
      description: Version of the requesting client, for example `v0.8.0`.
      required: true
      schema:
        type: string
        maxLength: 64
    client:
      name: client
      in: query
      description: >
        Identifier of the requesting client application, for example the
        product name of a desktop app. When present, the document carries
        `compatibility` for this client at the `{version}` path parameter.
      required: false
      schema:
        $ref: "#/components/schemas/ClientName"
    currentOrgId:
      name: X-Current-Orgid
      in: header
      description: Organization whose membership the caller wants reported.
      required: false
      schema:
        $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"

  schemas:
    ProviderCapability:
      $ref: "./provider_capability.yaml"

    ProviderFeature:
      type: object
      description: One feature the provider serves and the endpoint that serves it.
      additionalProperties: false
      required:
        - feature
      properties:
        feature:
          type: string
          description: Feature name, for example `persist-connection`.
          maxLength: 255
        endpoint:
          type: string
          description: Path that serves the feature, relative to the provider's base URL.
          maxLength: 1024

    ProviderMembership:
      type: object
      description: |
        Whether the authenticated caller is a live member of the organization
        named by `X-Current-Orgid`. Present only on an authenticated request
        that carried that header.
      additionalProperties: false
      required:
        - organizationId
        - bound
      properties:
        organizationId:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: The organization from `X-Current-Orgid`, echoed.
        bound:
          type: boolean
          description: True when the caller is a live member of the organization.

    ClientName:
      type: string
      description: >
        Identifier of a client application, for example the product name of a
        desktop app, lowercase. It is a value chosen by the client; the
        provider keys its minimum client versions by it.
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9-]*$'

    ClientCompatibility:
      type: object
      description: >
        Whether a client application's version meets the provider's minimum
        for that client. A client whose `compatible` is false must update
        before it registers or keeps a connection alive; the provider answers
        those calls with 426. A client the provider has no minimum for is
        compatible and has no `minimumVersion`.
      additionalProperties: false
      required:
        - clientName
        - clientVersion
        - compatible
      properties:
        clientName:
          $ref: "#/components/schemas/ClientName"
        clientVersion:
          type: string
          description: The client's version as it reported it, as `MAJOR.MINOR.PATCH` with an optional leading `v`, for example `v1.25.0`. Versions are ordered by their numeric parts, so `v1.9.0` is older than `v1.25.0`.
          maxLength: 64
        minimumVersion:
          type: string
          description: Oldest client version the provider accepts for this client. Absent when the provider sets no minimum.
          maxLength: 64
        compatible:
          type: boolean
          description: True when `clientVersion` is at or above `minimumVersion`, or when there is no minimum.
        upgradeUrl:
          type: string
          description: Where the client can get an update, when the provider knows one.
          maxLength: 2048

    ClientUpgradeRequiredError:
      type: object
      description: >
        Body of a 426 answer: a MeshKit error sentence plus the client's
        compatibility, so the client can show the minimum and where to update.
      additionalProperties: false
      required:
        - error
        - compatibility
      properties:
        error:
          type: string
          minLength: 1
          description: The sentence the caller is shown.
        code:
          type: string
          minLength: 1
          description: MeshKit error code allocated by the emitting service; not a stable part of this contract.
        compatibility:
          $ref: "#/components/schemas/ClientCompatibility"

    ProviderDeviceUsage:
      type: object
      description: >
        Registered devices (live `desktop` connections) in the organization
        against the organization's device limit. Registrations over the
        limit are accepted; `overLimit` flags the organization instead.
      additionalProperties: false
      required:
        - registered
        - overLimit
      properties:
        registered:
          type: integer
          minimum: 0
          description: Live `desktop` connections registered in the organization.
        limit:
          type: integer
          minimum: 0
          description: Devices the organization's subscriptions allow. Absent when unlimited or when no subscription sets a device limit.
        overLimit:
          type: boolean
          description: True when `limit` is present and `registered` exceeds it.

    ProviderSession:
      type: object
      description: >
        The authenticated caller's session as the provider sees it: who the
        caller is, the caller's roles, and, for the organization named by
        `X-Current-Orgid` when the caller is a live member of it, that
        organization's roles, plan, entitlements and device usage. Present
        only on an authenticated request.
      additionalProperties: false
      required:
        - userId
        - providerRoles
      properties:
        userId:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: The caller's user id.
        providerRoles:
          type: array
          description: The caller's provider-wide role names.
          items:
            type: string
            maxLength: 255
        organizationRoles:
          type: array
          description: The caller's role names in the organization.
          items:
            type: string
            maxLength: 255
        plan:
          $ref: "../plan/api.yml#/components/schemas/Plan"
          description: The plan of the organization's active subscription, when it has one.
          x-go-type: planv1beta3.Plan
          x-go-type-import:
            path: github.com/meshery/schemas/models/v1beta3/plan
            name: planv1beta3
        entitlements:
          type: array
          description: The features the organization's active subscriptions entitle it to.
          items:
            $ref: "../../v1beta1/feature/api.yml#/components/schemas/Feature"
            x-go-type: featurev1beta1.Feature
            x-go-type-import:
              path: github.com/meshery/schemas/models/v1beta1/feature
              name: featurev1beta1
        deviceUsage:
          $ref: "#/components/schemas/ProviderDeviceUsage"
