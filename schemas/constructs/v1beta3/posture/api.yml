openapi: 3.0.0
info:
  title: Posture
  description: |
    OpenAPI schema for Postures: the named presets that decide how a
    workload runs - its pace, its share of each built-in cap, its quiet
    hours and the pause it takes after a sign-in challenge. A Posture is a
    product-level concept, not a property of any one construct: the same
    preset value is referenced wherever a preset is chosen or resolved - a
    profile's per-platform binding, an account default, and a schedule's
    optional `posture` override (Blowhorn #1009). The component has no
    endpoints of its own; referencing constructs declare the property, so
    the paths stay with them.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

paths: {}

components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Posture:
      $ref: "./posture.yaml"
