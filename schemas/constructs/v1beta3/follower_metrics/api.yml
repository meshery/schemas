openapi: 3.0.0
info:
  title: Follower Metrics
  description: |
    OpenAPI schema for daily new-follower figures for a page, consumed by
    Blowhorn's analytics store. The rows have no endpoints of their own:
    they are recorded and read back as the `metadata` of events on the
    events service (category `blowhorn`, action `follower_metrics`; see
    the event construct), so this file declares the components only and
    the paths stay with the event construct.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

paths: {}

components:
  securitySchemes:
    jwt:
      type: http
      scheme: Bearer [REDACTED]
      bearerFormat: JWT

  schemas:
    FollowerMetrics:
      $ref: "./follower_metrics.yaml"

    FollowerMetricsPayload:
      type: object
      description: |
        Payload for recording one day's new-follower figures for a page,
        sent as the `metadata` of a create-event call. Contains only
        client-settable fields; the row has no server-generated fields,
        because the events service stores and returns event metadata
        verbatim, so the payload and the recorded row (FollowerMetrics)
        share one field set.
      additionalProperties: false
      required:
        - organizationId
        - platform
        - subject
        - readingDate
      properties:
        organizationId:
          type: string
          format: uuid
          description: Owning organization ID.
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid
        platform:
          type: string
          description: The platform the page belongs to (today only `linkedin` produces these exports).
        subject:
          type: string
          description: The page the figures describe, named as the source export names it.
        readingDate:
          type: string
          format: date
          description: The day the figures describe, as an ISO calendar date.
        newSponsored:
          type: integer
          nullable: true
          minimum: 0
          description: New followers that day from sponsored content; null when the export's cell is blank.
        newOrganic:
          type: integer
          nullable: true
          minimum: 0
          description: New followers that day from organic content; null when the export's cell is blank.
        newAutoInvited:
          type: integer
          nullable: true
          minimum: 0
          description: New followers that day from auto-invites; null when the export's cell is blank.
        newTotal:
          type: integer
          nullable: true
          minimum: 0
          description: All new followers that day; null when the export's cell is blank.
        sourceFile:
          type: string
          description: The export file the row was read from; empty when the row did not come from a file export.
