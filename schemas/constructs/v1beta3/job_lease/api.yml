openapi: 3.0.0
info:
  title: JobLease
  description: |
    OpenAPI schema for shared job leases - time-bound claims on due jobs
    with pause scopes, used by Layer5 Cloud and Blowhorn alike. Competing
    consumers claim due, unheld, unpaused rows; a dead holder's row returns
    to the pool when its lease lapses. The claim race is decided server-side
    in a single statement: losing racers receive null, never an error.
    Machine-local pause stays on the machine and is never sent; the
    organization-wide pause and per-row pause live here.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []
tags:
  - name: jobLeases
    description: Operations related to shared job leases.

paths:
  /api/job-leases:
    get:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: List job leases
      operationId: listJobLeases
      description: |
        Returns a paginated list of job leases in the organization,
        optionally filtered by status. Each entry projects the computed
        `locked`, `lockedBy`, `lockedAt` and `lockStale` keys.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/pagesize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/order"
        - name: organizationId
          in: query
          required: false
          description: Scope results to an organization.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Filter by job status (pending, leased, succeeded, failed).
          schema:
            type: string
      responses:
        "200":
          description: Job leases page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLeasePage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Create job lease
      operationId: createJobLease
      description: |
        Creates a new job lease definition. Claim columns and pause columns
        are server-managed and refused here; any supplied values are
        ignored. The `expectedFingerprint` precondition is ignored on
        create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobLeasePayload"
      responses:
        "201":
          description: Job lease created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /api/job-leases/claim:
    post:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Claim a due job lease
      operationId: claimJobLease
      description: |
        Hands one due, unheld, unpaused row to the calling machine in a
        single server-side statement. Answers the row, or null when no row
        qualifies - a lost race is null, never an error. `force` drops only
        the due test for trigger-now; a live foreign lease still refuses.
        `ignorePause` is the single operator override over pause scopes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobLeaseClaimRequest"
      responses:
        "200":
          description: Claim result holding the row, or null when nothing was claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLeaseActionResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /api/job-leases/schedule-pause:
    get:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Get organization schedule pause
      operationId: getSchedulePause
      description: |
        Returns the organization-wide pause row. A 404 is the ordinary
        answer when no pause is set, and is not an error condition.
      parameters:
        - name: organizationId
          in: query
          required: true
          description: Organization whose pause row is read.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization schedule pause
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePause"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    put:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Set organization schedule pause
      operationId: setSchedulePause
      description: |
        Sets the organization-wide pause. While set, no row in the
        organization is claimed unless the claim carries `ignorePause`.
      parameters:
        - name: organizationId
          in: query
          required: true
          description: Organization whose pause row is set.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePausePayload"
      responses:
        "200":
          description: Organization schedule pause set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePause"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    delete:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Clear organization schedule pause
      operationId: clearSchedulePause
      description: Clears the organization-wide pause so due rows become claimable again.
      parameters:
        - name: organizationId
          in: query
          required: true
          description: Organization whose pause row is cleared.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Organization schedule pause cleared
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/job-leases/{jobLeaseId}:
    get:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Get job lease by ID
      operationId: getJobLease
      parameters:
        - $ref: "#/components/parameters/jobLeaseId"
      responses:
        "200":
          description: Job lease response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    put:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Update job lease
      operationId: updateJobLease
      description: |
        Updates the job definition. Claim columns and pause columns are
        refused here; use the renew, release, pause and resume operations
        for those. When `expectedFingerprint` is supplied and stale, the
        update is refused with a 409.
      parameters:
        - $ref: "#/components/parameters/jobLeaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobLeasePayload"
      responses:
        "200":
          description: Job lease updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
    delete:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Delete job lease
      operationId: deleteJobLease
      description: Soft-deletes the job lease definition.
      parameters:
        - $ref: "#/components/parameters/jobLeaseId"
      responses:
        "204":
          description: Job lease deleted
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/job-leases/{jobLeaseId}/renew:
    post:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Renew a held job lease
      operationId: renewJobLease
      description: |
        Holder-only liveness: moves only `leaseExpiresAt` for the holder
        named by `machineId`. Answers the row, or null when the row is not
        held by that holder - never taken back.
      parameters:
        - $ref: "#/components/parameters/jobLeaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobLeaseRenewRequest"
      responses:
        "200":
          description: Renew result holding the row, or null when not held by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLeaseActionResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/job-leases/{jobLeaseId}/release:
    post:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Release a held job lease
      operationId: releaseJobLease
      description: |
        Clears the claim (`claimedBy`, `claimedAt`, `leaseExpiresAt`) for
        the holder named by `machineId` and merges the supplied result
        values. Claim and identity keys are refused here.
      parameters:
        - $ref: "#/components/parameters/jobLeaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobLeaseReleaseRequest"
      responses:
        "200":
          description: Job lease released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/job-leases/{jobLeaseId}/pause:
    post:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Pause a job lease row
      operationId: pauseJobLease
      description: |
        Sets the per-row pause. A paused row is claimed only by claims
        carrying `ignorePause`.
      parameters:
        - $ref: "#/components/parameters/jobLeaseId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobLeasePauseRequest"
      responses:
        "200":
          description: Job lease row paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/job-leases/{jobLeaseId}/resume:
    post:
      x-internal: ["cloud"]
      tags:
        - jobLeases
      summary: Resume a paused job lease row
      operationId: resumeJobLease
      description: Clears the per-row pause so the row becomes claimable again.
      parameters:
        - $ref: "#/components/parameters/jobLeaseId"
      responses:
        "200":
          description: Job lease row resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLease"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

components:
  securitySchemes:
    jwt:
      type: http
      scheme: Bearer [REDACTED]
      bearerFormat: JWT

  responses:
    400:
      $ref: "../../v1beta2/core/api.yml#/components/responses/400"
    401:
      $ref: "../../v1beta2/core/api.yml#/components/responses/401"
    404:
      $ref: "../../v1beta2/core/api.yml#/components/responses/404"
    409:
      $ref: "../../v1beta2/core/api.yml#/components/responses/409"
    500:
      $ref: "../../v1beta2/core/api.yml#/components/responses/500"

  parameters:
    jobLeaseId:
      name: jobLeaseId
      in: path
      description: Job lease ID
      required: true
      schema:
        $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
    page:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/page"
    pageSize:
      name: pageSize
      in: query
      description: Number of items per page (canonical camelCase form).
      schema:
        type: integer
        minimum: 1
    pagesize:
      name: pagesize
      in: query
      description: |
        Number of items per page. Deprecated alias of pageSize;
        canonical `pageSize` wins when both are present.
      deprecated: true
      schema:
        type: integer
        minimum: 1
    search:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/search"
    order:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/order"

  schemas:
    JobLease:
      $ref: "./job_lease.yaml"

    SchedulePause:
      $ref: "./schedule_pause.yaml"

    JobLeasePayload:
      type: object
      description: |
        Payload for creating or updating a job lease. Contains only
        client-settable job definition fields; the claim columns, the
        pause columns, the server-computed `fingerprint` and the
        server-generated timestamps are intentionally excluded.
      required:
        - rowNumber
        - command
      properties:
        id:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: Existing job lease ID for updates; omit on create.
          x-oapi-codegen-extra-tags:
            json: "id,omitempty"
        rowNumber:
          type: integer
          description: Targetable row number within the organization's job set.
          minimum: 0
        command:
          type: string
          description: Job command to execute when the lease is held.
          minLength: 1
          maxLength: 255
        profile:
          type: string
          description: Profile reference the job runs against.
          maxLength: 255
        platform:
          type: string
          description: Target platform for the job (e.g. linkedin).
          maxLength: 255
        params:
          type: object
          description: Arbitrary job parameters, stored as a JSON blob.
          x-go-type: core.Map
          x-go-type-import:
            path: github.com/meshery/schemas/models/core
            name: core
          x-go-type-skip-optional-pointer: true
        runAt:
          type: string
          format: date-time
          description: Time the job becomes due.
        nextRunAt:
          type: string
          format: date-time
          description: Next scheduled time for recurring jobs.
        recurrence:
          type: string
          description: Recurrence rule (cron expression) for repeating jobs. Absent for one-shot jobs.
          maxLength: 255
        retryBudget:
          type: integer
          description: Remaining execution attempts for the job.
          minimum: 0
        driverMode:
          type: string
          description: Execution driver mode for the job.
          maxLength: 255
        expectedFingerprint:
          type: string
          description: |
            Optimistic-concurrency precondition for update: when supplied,
            the update applies only when the stored fingerprint still
            matches, and is refused with a 409 otherwise. Ignored on
            create.
          maxLength: 255

    SchedulePausePayload:
      type: object
      description: |
        Payload for setting the organization-wide schedule pause. The
        pausing identity and timestamp are server-managed.
      properties:
        reason:
          type: string
          description: Operator reason for pausing the organization schedule.

    JobLeaseClaimRequest:
      type: object
      description: Claim filter for handing one due row to the caller.
      properties:
        rowNumber:
          type: integer
          description: Claim only the row with this row number.
          minimum: 0
        force:
          type: boolean
          description: Trigger-now override that drops only the due test; a live foreign lease still refuses.
        ignorePause:
          type: boolean
          description: Single operator override over the organization-wide and per-row pause scopes.
        leaseMinutes:
          type: integer
          description: Requested lease duration in minutes. When omitted the server applies its default lease duration.
          minimum: 1

    JobLeaseRenewRequest:
      type: object
      description: Holder-only liveness renewal.
      required:
        - machineId
      properties:
        machineId:
          type: string
          description: Machine holding the lease. Only the holder may renew.
          minLength: 1
          maxLength: 255
        leaseMinutes:
          type: integer
          description: Requested lease extension in minutes. When omitted the server applies its default lease duration.
          minimum: 1

    JobLeaseReleaseRequest:
      type: object
      description: Release payload clearing the claim and landing result values.
      required:
        - machineId
      properties:
        machineId:
          type: string
          description: Machine holding the lease. Only the holder may release.
          minLength: 1
          maxLength: 255
        values:
          type: object
          description: Result values merged into the row on release (e.g. last run outcome and error).
          x-go-type: core.Map
          x-go-type-import:
            path: github.com/meshery/schemas/models/core
            name: core
          x-go-type-skip-optional-pointer: true

    JobLeasePauseRequest:
      type: object
      description: Per-row pause payload.
      properties:
        reason:
          type: string
          description: Operator reason for pausing the row.

    JobLeaseActionResponse:
      type: object
      description: |
        Claim and renew outcome. `jobLease` carries the row, or null when
        nothing was claimed (lost race) or the row is not held by the
        caller (renew) - never an error.
      properties:
        jobLease:
          $ref: "#/components/schemas/JobLease"
          description: The claimed or renewed row, or null when the operation took no row.
          nullable: true
          x-go-type: JobLease
          x-go-type-skip-optional-pointer: true

    JobLeasePage:
      type: object
      description: Paginated collection of job leases.
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
        jobLeases:
          type: array
          items:
            $ref: "#/components/schemas/JobLease"
            x-go-type: JobLease
          description: Job leases included on this page of results.
