$schema: http://json-schema.org/draft-07/schema#
title: Content Metrics Schema
description: |
  Server-returned daily content figures for one page, as recorded in the
  `metadata` of an event on the events service (category `blowhorn`,
  action `content_metrics`); the event construct carries the envelope and
  this construct names the metadata's own shape, which Event leaves open.
  One row is one page on one day, keyed by (organizationId, platform,
  subject, readingDate): the day's impressions, clicks, reactions,
  comments and reposts, each split organic / sponsored alongside its
  total, plus the engagement rates the source export reports. A figure
  exists only when the export carries its column — an export without a
  sponsored breakdown records no sponsored figures — and every figure is
  nullable: a blank cell is not a zero.
type: object
additionalProperties: false
required:
  - organizationId
  - platform
  - subject
  - readingDate
properties:
  organizationId:
    type: string
    format: uuid
    description: Owning organization ID.
    x-go-type: uuid.UUID
    x-go-type-import:
      path: github.com/gofrs/uuid
    x-go-name: OrganizationID
    x-oapi-codegen-extra-tags:
      db: organization_id
    x-order: 1
  platform:
    type: string
    description: The platform the page belongs to (today only `linkedin` produces these exports).
    x-oapi-codegen-extra-tags:
      db: platform
    x-order: 2
  subject:
    type: string
    description: The page the figures describe, named as the source export names it.
    x-oapi-codegen-extra-tags:
      db: subject
    x-order: 3
  readingDate:
    type: string
    format: date
    description: The day the figures describe, as an ISO calendar date.
    x-oapi-codegen-extra-tags:
      db: reading_date
    x-order: 4
  impressionsOrganic:
    type: integer
    nullable: true
    minimum: 0
    description: Organic impressions that day; null when the export's cell is blank.
    x-oapi-codegen-extra-tags:
