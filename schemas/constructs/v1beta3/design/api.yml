          type: array
          items:
            $ref: "#/components/schemas/DeletePatternModel"
            x-go-type: DeletePatternModel
          description: Designs targeted for deletion.

    MesheryPatternPayload:
      type: object
      description: >
        Client-settable subset of the design (pattern) entity used as the
        body of the inner `patternData` envelope on
        POST /api/content/patterns. Server-generated fields (createdAt,
        updatedAt, viewCount, downloadCount, cloneCount, deploymentCount,
        shareCount, the joined `user` object, and the imported-source
        `sourceContent` blob) are deliberately excluded — the server
        ignores them on writes and re-projects them on the response.
      properties:
        id:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Id"
          description: Existing design ID for updates; omit on create.
          x-oapi-codegen-extra-tags:
            json: "id,omitempty"
        name:
          type: string
          description: Human-readable design name.
          minLength: 1
          maxLength: 255
        userId:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Id"
          description: Owning user ID. Server overrides with the authenticated caller on create.
          x-oapi-codegen-extra-tags:
            json: "userId,omitempty"
        catalogData:
          $ref: "../../v1beta2/catalog/api.yml#/components/schemas/CatalogData"
          description: Catalog metadata to attach to the design when publishing.
          x-go-type: catalogv1alpha2.CatalogData
          x-go-type-import:
            path: github.com/meshery/schemas/models/v1alpha2/catalog
            name: catalogv1alpha2
        location:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/MapObject"
          description: Optional structured location metadata (branch, host, path, ...).
        patternFile:
          type: string
          description: >
            Raw design body to persist into the `pattern_file` column.
            See MesheryPattern.patternFile for the transcode boundary
            note that applies on both writes and reads.
          maxLength: 16777216
        visibility:
          type: string
          description: Visibility scope of the design.
          enum:
            - private
            - public
            - published
          x-enum-casing-exempt: true
          maxLength: 32
        designType:
          type: string
          description: >
            Discriminator identifying the source format of the design body,
            stored in the `source_type` column. Optional on create (the
            server defaults missing values to `Design`).
          x-enum-casing-exempt: true
          nullable: true
          enum:
            - Design
            - Helm Chart
            - Docker Compose
            - Kubernetes Manifest
          maxLength: 64

    MesheryPatternRequestBody:
      type: object
      description: Payload for upserting a design via POST /api/content/patterns.
      properties:
        path:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Text"
          description: Optional source path the design was loaded from.
        patternData:
          $ref: "#/components/schemas/MesheryPatternPayload"
          description: Design body to persist.
          x-go-type: MesheryPatternPayload
        save:
          type: boolean
          description: When true, persist the design in addition to parsing it.
        url:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Endpoint"
          description: Optional source URL the design was fetched from.
        name:
          type: string
          description: Human-readable design name.
          minLength: 1
          maxLength: 255

    MesheryPatternImportRequestBody:
      description: "Body for POST /api/pattern/import. Consumed by the server as application/json. Exactly one of two variants must be supplied: a File Import carrying base64-encoded bytes plus a file name, or a URL Import naming a remote location the server will fetch. Sending both variants at once, or neither, is rejected with 400."
      oneOf:
        - $ref: "#/components/schemas/MesheryPatternImportFilePayload"
        - $ref: "#/components/schemas/MesheryPatternImportURLPayload"

    MesheryPatternImportFilePayload:
      type: object
      title: File Import
      description: "Upload a design file from the local system. Both `file` and `fileName` are required; the server uses the file name to identify the file type (Kubernetes Manifest, Helm Chart, Docker Compose, or Meshery Design)."
      required: [file, fileName]
      properties:
        file:
          type: string
          format: byte
          description: "Base64-encoded file bytes. Supported formats: Kubernetes Manifests, Helm Charts, Docker Compose, and Meshery Designs. See [Import Designs Documentation](https://docs.meshery.io/guides/configuration-management/importing-designs#import-designs-using-meshery-ui) for details."
        fileName:
          type: string
          description: "The name of the pattern file being imported. Include the extension (e.g. `design.yaml`), as the server uses it to identify the file type."
          maxLength: 500
        name:
          type: string
          default: "Untitled Design"
          description: "Provide a name for your design. This name will help you identify the design later. You can also change the name of your design after importing it."
          minLength: 1
          maxLength: 255

    MesheryPatternImportURLPayload:
      type: object
      title: URL Import
      description: "Import a design by URL. The server will fetch the resource and derive the file type from the response."
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: "A direct URL to a single file, for example: https://raw.github.com/your-design-file.yaml. Ensure the resource is in a supported format: Kubernetes Manifest, Helm Chart, Docker Compose, or Meshery Design. See [Import Designs Documentation](https://docs.meshery.io/guides/configuration-management/importing-designs#import-designs-using-meshery-ui) for details."
        name:
          type: string
          default: "Untitled Design"
          description: "Provide a name for your design. This name will help you identify the design later. You can also change the name of your design after importing it."
          minLength: 1
          maxLength: 255

    MesheryPatternImportFormPayload:
      type: object
      description: >
        Flat canonical representation of the design import form that combines
        the discriminator field with the union of properties from
        MesheryPatternImportFilePayload and MesheryPatternImportURLPayload.
        This schema is the authoritative source for the canonical RJSF form
        schema at schemas/constructs/v1beta3/design/forms/import.json.
        The server receives either a File-import payload or a URL-import
        payload (as defined by MesheryPatternImportRequestBody); this form
        schema captures the superset of user-facing fields so the form
        schema can be validated as a subset of this canonical type.
      properties:
        name:
          type: string
          default: "Untitled Design"
          description: "Provide a name for your design. This name will help you identify the design later. You can also change the name of your design after importing it."
          minLength: 1
          maxLength: 255
        uploadType:
          type: string
          title: "Upload method"
          x-enum-casing-exempt: true
          enum: ["File Upload", "URL Import"]
          description: >
            UI-level discriminator that controls which import variant the
            form submits. The client maps "File Upload" to
            MesheryPatternImportFilePayload and "URL Import" to
            MesheryPatternImportURLPayload before calling the API.
        file:
          type: string
          format: byte
          description: "Base64-encoded file bytes. Supported formats: Kubernetes Manifests, Helm Charts, Docker Compose, and Meshery Designs."
        url:
          type: string
          format: uri
          description: "A direct URL to a single file. Ensure the resource is in a supported format: Kubernetes Manifest, Helm Chart, Docker Compose, or Meshery Design."

    GithubImportPayload:
      type: object
      description: Files to import from one repository and how to treat files that were imported before.
      required:
        - name
        - paths
      properties:
        name:
          type: string
          description: Repository as `<owner>/<repo>`.
          maxLength: 512
        paths:
          type: array
          minItems: 1
          description: >
            Selected tree items, as served by `GET /api/integrations/github/scan`.
            The server reads only `type` and `entry.path`; the remaining scan
            fields are accepted and ignored.
          items:
            $ref: "#/components/schemas/GithubImportPath"
            x-go-type: GithubImportPath
        onExisting:
          type: string
          description: >
            What to do with a selected file that already identifies one of the
            caller's designs. `skip` (the default, "import new only") leaves it
            untouched and reports it in `skippedPaths`, so a request that omits
            `onExisting` never overwrites an existing design; `update` refreshes
            that design in place under the same ID (idempotent import); `new`
            imports it again as an additional design.
          enum:
            - update
            - skip
            - new
          default: skip
          # oapi-codegen only prefixes enum constants on collision; without
          # explicit varnames it leaks bare `Update`, `Skip`, `New` into the
          # Go package.
          x-enum-varnames:
            - GithubImportPayloadOnExistingUpdate
            - GithubImportPayloadOnExistingSkip
            - GithubImportPayloadOnExistingNew

    GithubImportPath:
      type: object
      description: One selected file or directory in the repository tree.
      required:
        - type
        - entry
      properties:
        type:
          type: string
          description: Tree item kind; a directory is imported recursively.
          enum:
            - file
            - dir
          x-enum-varnames:
            - GithubImportPathTypeFile
            - GithubImportPathTypeDir
        entry:
          $ref: "#/components/schemas/GithubImportPathEntry"
      additionalProperties: true

    GithubImportPathEntry:
      type: object
      description: >
        The repository entry a selected tree item points at. Only `path` is
        read; the other scan fields on the entry are accepted and ignored.
      required:
        - path
      properties:
        path:
          type: string
          description: Repository-relative path of the file or directory.
          maxLength: 4096

    GithubImportResponse:
      type: object
      description: Outcome of a GitHub repository import.
      properties:
        patterns:
          type: array
          description: >
            Designs created or updated by this import, with `sourceContent`,
            `patternFile` and `catalogData` omitted.
          items:
            $ref: "#/components/schemas/MesheryPattern"
            x-go-type: MesheryPattern
        updatedIds:
          type: array
          description: IDs (all also present in `patterns`) of designs updated in place rather than created.
          items:
            $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
        skippedPaths:
          type: array
          description: Repository-relative paths left untouched because `onExisting` was `skip` and a design already imports them.
          items:
            type: string
            description: Repository-relative path of a skipped file.
            maxLength: 4096
        errors:
          type: array
          description: One Error-severity import event per selected path that failed.
          items:
            $ref: "../event/api.yml#/components/schemas/Event"
            x-go-type: eventv1beta3.Event
            x-go-type-import:
              path: github.com/meshery/schemas/models/v1beta3/event
              name: eventv1beta3

    DesignSourceBindingPayload:
      type: object
      description: >
        The GitHub file a design is bound to - what `refreshPatternFromSource`
        re-reads.
      required:
        - connectionId
        - host
        - path
      properties:
        connectionId:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: >
            The caller's own live GitHub App connection, which authorizes
            reading the repository.
        host:
          type: string
          description: >
            Repository as `github.com/<owner>/<repo>` - the same form
            `location.host` stores.
          pattern: '^github\.com/[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})/[A-Za-z0-9._-]{1,100}$'
          maxLength: 512
        path:
          type: string
          description: >
            Repository-relative path of a file (not a directory), with no
            leading slash.
          minLength: 1
          maxLength: 4096
        ref:
          type: string
          description: >
            Branch or tag the binding tracks, stored as `location.branch`.
            Empty or omitted means the repository's default branch.
          maxLength: 255

    DesignSourceLocation:
      type: object
      description: >
        The keys of a design's `location` (a MapObject on MesheryPattern) when
        the design is bound to a GitHub source. Written by
        `importGithubRepository`, `refreshPatternFromSource` and
        `updatePatternSource`. A design created by an upload or a URL import
        retains no source - it carries no `github` location and cannot be
        refreshed until it is bound to one.
      properties:
        type:
          type: string
          description: Source kind; `github` for a design bound to a GitHub file.
          maxLength: 64
        host:
          type: string
          description: Repository as `github.com/<owner>/<repo>`.
          maxLength: 512
        path:
          type: string
          description: Repository-relative path of the source file.
          maxLength: 4096
        branch:
          type: string
          description: >
            Ref the binding tracks (a branch or tag name). Empty means the
            repository's default branch.
          maxLength: 255
        commitSha:
          type: string
          description: >
            The commit the design's stored content was last read from, by an
            import or a refresh. Absent when the content was not read from the
            current binding - after a remap without a refresh, or for a design
            imported before commits were recorded. Compare it with the head of
            `branch` to tell whether the source has drifted.
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
      additionalProperties: true

    GithubBranch:
      type: object
      description: One branch of a GitHub repository.
      required:
        - name
        - commitSha
      properties:
        name:
          type: string
          description: Branch name.
          maxLength: 255
