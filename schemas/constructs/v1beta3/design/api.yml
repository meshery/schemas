openapi: 3.0.0
info:
  title: Design
  description: OpenAPI schema for managing Meshery designs and infrastructure patterns.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []
tags:
  - name: designs
    description: Operations related to designs and infrastructure patterns
  - name: github
    description: GitHub repository reads that back design import and remap
paths:
  /api/content/patterns:
    get:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Get designs
      operationId: getPatterns
      description: Returns a paginated list of infrastructure designs accessible to the user.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/orgIdQuery"
        - name: visibility
          in: query
          description: Filter by visibility (public, private, published)
          schema:
            type: string
        - name: userId
          in: query
          required: false
          description: UUID of User. Pass userId for fetching public and published designs.
          schema:
            type: string
            format: uuid
        - name: metrics
          in: query
          required: false
          description: Whether to include usage metrics in the response.
          schema:
            type: boolean
        - name: workspaceId
          in: query
          required: false
          description: Filter designs by workspace ID.
          schema:
            type: string
            format: uuid
        - name: populate
          in: query
          required: false
          description: Populate additional nested fields in the response.
          schema:
            type: boolean
        - name: shared
          in: query
          required: false
          description: Include designs shared with the caller.
          schema:
            type: boolean
      responses:
        "200":
          description: Designs response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MesheryPatternPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Save design
      operationId: upsertPattern
      description: Creates or updates an infrastructure design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MesheryPatternRequestBody"
      responses:
        "200":
          description: Design saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MesheryPattern"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /api/content/patterns/delete:
    post:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Bulk delete designs
      operationId: deletePatterns
      description: Deletes multiple designs by ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MesheryPatternDeleteRequestBody"
      responses:
        "200":
          description: Designs deleted
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /api/content/patterns/{designId}:
    get:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Get design by ID
      operationId: getPattern
      parameters:
        - $ref: "#/components/parameters/designId"
        - name: metrics
          in: query
          required: false
          description: Whether to include usage metrics in the response.
          schema:
            type: boolean
      responses:
        "200":
          description: Design response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MesheryPattern"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    delete:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Delete design by ID
      operationId: deletePattern
      parameters:
        - $ref: "#/components/parameters/designId"
      responses:
        "204":
          description: Design deleted
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/content/patterns/clone/{designId}:
    post:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Clone design
      operationId: clonePattern
      description: Creates a copy of an existing design.
      parameters:
        - $ref: "#/components/parameters/designId"
      responses:
        "200":
          description: Design cloned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MesheryPattern"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/content/patterns/download/{designId}:
    get:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Download design file
      operationId: getDesignPatternFile
      description: Downloads the raw design file for the specified design.
      parameters:
        - $ref: "#/components/parameters/designId"
      responses:
        "200":
          description: Design file content
          content:
            application/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/content/patterns/upload/{designId}:
    post:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Upload design source content
      operationId: upsertPatternSourceContent
      description: |
        Replaces the raw source content blob stored alongside a design.
        The server (meshery-cloud's UpsertPatternSourceContent handler)
        reads the entire request body as opaque bytes via io.ReadAll and
        persists them without interpretation, so the content-type is
        whatever the uploader sent — `application/octet-stream` is the
        canonical choice. The previous declaration reused
        MesheryPatternImportRequestBody under multipart/form-data, which
        the handler never parses; it remained wired up solely to share
        a schema ref with /api/pattern/import. See meshery/schemas#771
        for the drift analysis.
      parameters:
        - $ref: "#/components/parameters/designId"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Opaque design source bytes (yaml, tarball, etc.)
      responses:
        "200":
          description: Design source content uploaded
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/content/patterns/refresh/{designId}:
    post:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Refresh design from its source
      operationId: refreshPatternFromSource
      description: >
        Re-fetches the source file recorded in the design's `location`
        (`type: github`, `host: github.com/<owner>/<repo>`, `path`, optional
        `branch`; an empty branch means the repository's default branch),
        re-identifies it, and rewrites the design's content in place under the
        same design ID. A Meshery Design source replaces `patternFile`; any other
        source type (Helm Chart, Kubernetes Manifest, Docker Compose) replaces
        `sourceContent` and clears `patternFile`, so Meshery reconverts it the
        next time the design is opened - exactly the state a first import leaves.
        Only the design's owner may refresh it. No request body.
        Denials: `404` answers both "no such design" and "not the caller's
        design" with the same body by design, so the route is not an existence
        oracle;
        `403` means the repository is not reachable through one of the
        caller's verified GitHub App installations - the installations GitHub
        lists for the caller's own GitHub account when they authorize the App.
        The refusal is deliberately uniform: the App not being installed on
        the repository's account and its being installed there for someone
        else answer the same body, so the route does not reveal where the App
        is installed. A distinct `403` whose MeshKit error asks for re-authorization means
        the caller's GitHub connection predates verification; re-authorize it
        (see `startGithubAuthorization`) before use;
        `409` means the design has no
        refreshable source (`location.type` is not `github`, or `host`/`path`
        is missing) or its source path no longer resolves to an importable
        file; `502` means GitHub could not be reached or rejected the request.
        The server resolves the tracked ref to a commit, reads the file at
        that commit, and records it in `location.commitSha`.
      parameters:
        - $ref: "#/components/parameters/designId"
      responses:
        "200":
          description: >
            Design refreshed. `sourceContent` and `patternFile` are omitted
            from the response body (they can be megabytes), as on import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MesheryPattern"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/MeshkitError403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
        "502":
          $ref: "#/components/responses/MeshkitError502"

  /api/content/patterns/{designId}/source:
    patch:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Remap a design's GitHub source
      operationId: updatePatternSource
      description: >
        Re-points the design's source binding - the GitHub file its `location`
        records and `refreshPatternFromSource` re-reads - at another repository,
        path or ref. The design's content is not changed: call
        `refreshPatternFromSource` afterwards to replace it from the new source.
        The server resolves `ref` to a commit and confirms that `path` names an
        importable file at that commit before it writes anything, so a binding
        that a refresh could not read is never stored. It writes `location` as
        `type: github`, `host`, `path` and `branch` (= `ref`). When the binding
        changes, `location.commitSha` is removed, because the stored content
        was not read from the new source; it is kept when the request names the
        binding the design already has. A design with no GitHub source (an
        upload or URL import) may be bound to one; it becomes refreshable.
        Only the design's owner may remap it.
        Denials: `404` answers "no such design", "not the caller's design" and
        "connectionId is not the caller's own live GitHub connection" with the
        same body, so the route is not an existence oracle;
        `403` means the repository is not reachable through one of the
        caller's verified GitHub App installations - the installations GitHub
        lists for the caller's own GitHub account when they authorize the App.
        The refusal is deliberately uniform: the App not being installed on
        the repository's account and its being installed there for someone
        else answer the same body, so the route does not reveal where the App
        is installed. A distinct `403` whose MeshKit error asks for re-authorization means
        the caller's GitHub connection predates verification; re-authorize it
        (see `startGithubAuthorization`) before use;
        `409` means `ref` does not resolve to a commit, or `path` does not name
        an importable file at it (missing, a directory, or not a supported
        format); `502` means GitHub could not be reached or rejected the
        request.
      parameters:
        - $ref: "#/components/parameters/designId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignSourceBindingPayload"
      responses:
        "200":
          description: >
            Source binding updated. `sourceContent` and `patternFile` are
            omitted from the response body, as on refresh and import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MesheryPattern"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/MeshkitError403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
        "502":
          $ref: "#/components/responses/MeshkitError502"

  /api/pattern/import:
    post:
      x-internal: ["cloud", "meshery"]
      tags:
        - designs
      summary: Import Design
      operationId: importDesign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MesheryPatternImportRequestBody"
      responses:
        "200":
          description: >-
            Successful import. The response body is a JSON array of the saved
            designs, not a message envelope. The import path saves exactly one
            design, so the array carries a single element and consumers read the
            imported design as the first element.
          content:
            application/json:
              schema:
                type: array
                description: >-
                  Designs persisted by the import, in the order they were saved.
                  Always a single element on this path.
                minItems: 1
                items:
                  $ref: "#/components/schemas/MesheryPattern"
        "400":
          description: Invalid request format
        "401":
          $ref: "#/components/responses/401"
        "500":
          description: Internal server error

  # The two GitHub import operations below are served by Meshery Cloud's GitHub
  # integration, but they read and write designs, so they live in this construct
  # and carry its `designs` tag. RTK cache tags are namespaced by the declaring
  # construct's `info.title` (build/bundle-openapi.js prefixTags), so only here
  # do they share the `Design_designs` tag with getPatterns, deletePattern,
  # refreshPatternFromSource and updatePatternSource - an import, a refresh or
  # a remap refetches the design lists, and a delete, refresh or remap
  # refetches the imported-designs inventory. The branch list that follows them
  # reads only GitHub, so it carries the `github` tag instead: a design write
  # must not refetch it.
  /api/integrations/github/designs/{connectionId}:
    get:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: List designs imported from GitHub
      operationId: getGithubImportedDesigns
      description: >
        Returns the designs owned by the GitHub connection's owner whose
        `location.type` is `github` - every design imported (or refreshed)
        from GitHub - newest first. The inventory is owner-wide, not scoped
        to the connection: Meshery Cloud keeps one GitHub App connection per
        user, and the connection only authorizes the read. Use `repository`
        to narrow it. `location` carries `host` (github.com/<owner>/<repo>),
        `path` and `branch` (empty = the repository's default branch).
        `patternFile` and `sourceContent` are not projected. Only the
        connection's owner may list it, as only a design's owner may refresh
        it: a caller who does not own the connection gets 404 regardless of
        any all-organizations scope, with the same body as "no such
        connection", so private designs are never listed to another user.
      parameters:
        - $ref: "#/components/parameters/connectionId"
        - name: repository
          in: query
          required: false
          description: Restrict to one repository, as `<owner>/<repo>` (case-insensitive).
          schema:
            type: string
            maxLength: 512
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Imported designs page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MesheryPatternPage"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/integrations/github/import/{connectionId}:
    post:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Import files from a GitHub repository as designs
      operationId: importGithubRepository
      description: >
        Imports the selected files (a selected directory is walked recursively)
        from one repository reachable through the caller's GitHub App
        connection. Matching is idempotent: a file whose
        (owner, location.type, location.host, location.path, location.branch)
        already identifies one of the caller's designs is handled per
        `onExisting`. `connectionId` must name the caller's own live GitHub
        connection (404 otherwise).
        `403` means the repository is not reachable through one of the
        caller's verified GitHub App installations - the installations GitHub
        lists for the caller's own GitHub account when they authorize the App.
        The refusal is deliberately uniform: the App not being installed on
        the repository's account and its being installed there for someone
        else answer the same body, so the route does not reveal where the App
        is installed. A distinct `403` whose MeshKit error asks for re-authorization means
        the caller's GitHub connection predates verification; re-authorize it
        (see `startGithubAuthorization`) before use;
        `502` means GitHub could
        not be reached or rejected the request. Each imported or updated
        design records the commit its file was read at in
        `location.commitSha`.
      parameters:
        - $ref: "#/components/parameters/connectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubImportPayload"
      responses:
        "200":
          description: Import outcome. Per-file failures are reported in `errors`, not as a non-2xx status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubImportResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/MeshkitError403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "502":
          $ref: "#/components/responses/MeshkitError502"

  /api/integrations/github/branches/{connectionId}:
    get:
      x-internal: ["cloud"]
      tags:
        - github
      summary: List a repository's branches
      operationId: getGithubRepositoryBranches
      description: >
        Lists the branches of one repository reachable through the caller's
        GitHub App connection, with the repository's default branch, so a
        client can offer the refs a design's source can track. Branch order
        is GitHub's. `connectionId` must name the caller's own live GitHub
        connection (404 otherwise, with the same body as "no such
        connection").
        `403` means the repository is not reachable through one of the
        caller's verified GitHub App installations - the installations GitHub
        lists for the caller's own GitHub account when they authorize the App.
        The refusal is deliberately uniform: the App not being installed on
        the repository's account and its being installed there for someone
        else answer the same body, so the route does not reveal where the App
        is installed. A distinct `403` whose MeshKit error asks for re-authorization means
        the caller's GitHub connection predates verification; re-authorize it
        (see `startGithubAuthorization`) before use;
        `502` means GitHub could not be
        reached or rejected the request.
      parameters:
        - $ref: "#/components/parameters/connectionId"
        - name: repository
          in: query
          required: true
          description: Repository as `<owner>/<repo>` (case-insensitive).
          schema:
            type: string
            minLength: 3
            maxLength: 512
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Repository branches page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubBranchPage"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/MeshkitError403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "502":
          $ref: "#/components/responses/MeshkitError502"

  /api/catalog/content/{type}:
    get:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Get catalog content
      operationId: getCatalogContent
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/order"
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: technology
          in: query
          required: false
          schema:
            type: string
        - name: metrics
          in: query
          required: false
          schema:
            type: boolean
        - name: class
          in: query
          required: false
          schema:
            type: string
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: orgId
          in: query
          required: false
          schema:
            type: string
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: teamId
          in: query
          required: false
          schema:
            type: string
        - name: populate
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Catalog content page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogContentPage"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Publish catalog content
      operationId: publishCatalogContent
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/catalogContentPayload"
      responses:
        "200":
          description: Catalog request result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogRequest"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          description: Conflict
        "500":
          $ref: "#/components/responses/500"
  /api/catalog/content/{type}/unpublish:
    post:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Unpublish catalog content
      operationId: unPublishCatalogContent
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/catalogContentPayload"
      responses:
        "200":
          description: Catalog request result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogRequest"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          description: Conflict
        "500":
          $ref: "#/components/responses/500"

  /api/catalog/content/classes:
    get:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Get catalog content classes
      operationId: getCatalogContentClasses
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Catalog content classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogContentClass"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /api/catalog/requests/approve:
    post:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Approve a catalog request
      operationId: approveCatalogRequest
      requestBody:
        $ref: "#/components/requestBodies/catalogContentPayload"
      responses:
        "200":
          description: Request approved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          description: Conflict
        "500":
          $ref: "#/components/responses/500"

  /api/catalog/requests/deny:
    post:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Deny a catalog request
      operationId: denyCatalogRequest
      requestBody:
        $ref: "#/components/requestBodies/catalogContentPayload"
      responses:
        "200":
          description: Request denied
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          description: Conflict
        "500":
          $ref: "#/components/responses/500"

  /api/resource/{resourceType}/share/{resourceId}:
    post:
      x-internal: ["cloud"]
      tags:
        - designs
      summary: Share a resource
      operationId: handleResourceShare
      parameters:
        - name: resourceType
          in: path
          required: true
          schema:
            type: string
        - name: resourceId
