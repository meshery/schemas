openapi: 3.0.0
info:
  title: BlowhornContent
  description: |
    OpenAPI schema for Blowhorn content rows - fingerprinted content
    values keyed by owning profile and row number, with conditional
    updates.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []
tags:
  - name: blowhornContent
    description: Operations related to Blowhorn content.

paths:
  /api/blowhorn/content:
    get:
      x-internal: ["cloud"]
      tags:
        - blowhornContent
      summary: List Blowhorn content
      operationId: listBlowhornContent
      description: Returns a paginated list of Blowhorn content rows in the organization.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/pagesize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/order"
        - name: organizationId
          in: query
          required: false
          description: Scope results to an organization.
          schema:
            type: string
            format: uuid
        - name: profile
          in: query
          required: false
          description: Filter by owning profile subject.
          schema:
            type: string
      responses:
        "200":
          description: Blowhorn content page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornContentPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - blowhornContent
      summary: Insert Blowhorn content
      operationId: insertBlowhornContent
      description: |
        Inserts a new Blowhorn content row, or updates the row matching
        the provided `id`. The `fingerprint` is server-computed; any
        supplied value is ignored. The `expectedFingerprint`
        precondition is ignored on insert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlowhornContentPayload"
      responses:
        "200":
          description: Blowhorn content saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornContent"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /api/blowhorn/content/{blowhornContentId}:
    get:
      x-internal: ["cloud"]
      tags:
        - blowhornContent
      summary: Get Blowhorn content by ID
      operationId: getBlowhornContent
      parameters:
        - $ref: "#/components/parameters/blowhornContentId"
      responses:
        "200":
          description: Blowhorn content response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornContent"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    put:
      x-internal: ["cloud"]
      tags:
        - blowhornContent
      summary: Update Blowhorn content
      operationId: updateBlowhornContent
      description: |
        Conditionally updates the Blowhorn content row. When
        `expectedFingerprint` is supplied and stale, the update is
        refused with a 409.
      parameters:
        - $ref: "#/components/parameters/blowhornContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlowhornContentPayload"
      responses:
        "200":
          description: Blowhorn content updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornContent"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
    delete:
      x-internal: ["cloud"]
      tags:
        - blowhornContent
      summary: Delete Blowhorn content
      operationId: deleteBlowhornContent
      description: Soft-deletes the Blowhorn content row.
      parameters:
        - $ref: "#/components/parameters/blowhornContentId"
      responses:
        "204":
          description: Blowhorn content deleted
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

components:
  securitySchemes:
    jwt:
      type: http
      scheme: Bearer [REDACTED]
      bearerFormat: JWT

  responses:
    400:
      $ref: "../../v1beta2/core/api.yml#/components/responses/400"
    401:
      $ref: "../../v1beta2/core/api.yml#/components/responses/401"
    404:
      $ref: "../../v1beta2/core/api.yml#/components/responses/404"
    409:
      $ref: "../../v1beta2/core/api.yml#/components/responses/409"
    500:
      $ref: "../../v1beta2/core/api.yml#/components/responses/500"

  parameters:
    blowhornContentId:
      name: blowhornContentId
      in: path
      description: Blowhorn content ID
      required: true
      schema:
        $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
    page:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/page"
    pageSize:
      name: pageSize
      in: query
      description: Number of items per page (canonical camelCase form).
      schema:
        type: integer
        minimum: 1
    pagesize:
      name: pagesize
      in: query
      description: |
        Number of items per page. Deprecated alias of pageSize;
        canonical `pageSize` wins when both are present.
      deprecated: true
      schema:
        type: integer
        minimum: 1
    search:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/search"
    order:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/order"

  schemas:
    BlowhornContent:
      $ref: "./blowhorn_content.yaml"

    BlowhornContentPayload:
      type: object
      description: |
        Payload for inserting or updating a Blowhorn content row.
        Contains only client-settable fields; the owning
        `organizationId` (derived from the authenticated session), the
        server-computed `fingerprint` and the server-generated
        `createdAt` / `updatedAt` timestamps are intentionally excluded.
      required:
        - profile
        - rowNumber
      properties:
        id:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: Existing Blowhorn content ID for updates; omit on insert.
          x-oapi-codegen-extra-tags:
            json: "id,omitempty"
        profile:
          type: string
          description: Subject of the owning Blowhorn profile.
          minLength: 1
          maxLength: 255
        rowNumber:
          type: integer
          description: Row number of the content within the owning profile.
          minimum: 0
        data:
          type: object
          description: Content values, stored as a JSON blob.
          x-go-type: core.Map
          x-go-type-import:
            path: github.com/meshery/schemas/models/core
            name: core
          x-go-type-skip-optional-pointer: true
        expectedFingerprint:
          type: string
          description: |
            Optimistic-concurrency precondition for update: when supplied,
            the update applies only when the stored fingerprint still
            matches, and is refused with a 409 otherwise. Ignored on
            insert.
          maxLength: 255

    BlowhornContentPage:
      type: object
      description: Paginated collection of Blowhorn content rows.
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
        blowhornContent:
          type: array
          items:
            $ref: "#/components/schemas/BlowhornContent"
            x-go-type: BlowhornContent
          description: Blowhorn content rows included on this page of results.
