openapi: 3.0.0
info:
  title: BlowhornLedger
  description: |
    OpenAPI schema for the Blowhorn ledger - ledger-discriminated
    idempotent sets with claim-if-absent semantics, plus contacts and
    mentees.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

security:
  - jwt: []
tags:
  - name: blowhornLedger
    description: Operations related to Blowhorn ledger entries, contacts and mentees.

paths:
  /api/blowhorn/ledger:
    get:
      x-internal: ["cloud"]
      tags:
        - blowhornLedger
      summary: List Blowhorn ledger entries
      operationId: listBlowhornLedger
      description: Returns a paginated list of Blowhorn ledger entries in the organization of the authenticated session, optionally filtered by ledger.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/pagesize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/order"
        - name: ledger
          in: query
          required: false
          description: Filter by ledger discriminator.
          schema:
            type: string
      responses:
        "200":
          description: Blowhorn ledger entries page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornLedgerPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - blowhornLedger
      summary: Record Blowhorn ledger entry
      operationId: recordBlowhornLedgerEntry
      description: |
        Records a ledger entry, replaying idempotently on the (ledger,
        key) pair: recording an existing pair returns the stored entry
        with the supplied value merged. Ownership is derived from the
        authenticated session; any client-supplied owner is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlowhornLedgerPayload"
      responses:
        "200":
          description: Blowhorn ledger entry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornLedgerEntry"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /api/blowhorn/ledger/{blowhornLedgerEntryId}:
    get:
      x-internal: ["cloud"]
      tags:
        - blowhornLedger
      summary: Get Blowhorn ledger entry by ID
      operationId: getBlowhornLedgerEntry
      parameters:
        - $ref: "#/components/parameters/blowhornLedgerEntryId"
      responses:
        "200":
          description: Blowhorn ledger entry response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornLedgerEntry"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    delete:
      x-internal: ["cloud"]
      tags:
        - blowhornLedger
      summary: Delete Blowhorn ledger entry
      operationId: deleteBlowhornLedgerEntry
      description: Removes the ledger entry from its idempotent set.
      parameters:
        - $ref: "#/components/parameters/blowhornLedgerEntryId"
      responses:
        "204":
          description: Blowhorn ledger entry deleted
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/blowhorn/ledger/{blowhornLedgerEntryId}/claim:
    post:
      x-internal: ["cloud"]
      tags:
        - blowhornLedger
      summary: Claim Blowhorn ledger entry if absent
      operationId: claimIfAbsentBlowhornLedgerEntry
      description: |
        Takes the entry for the holder named by `holder` when unclaimed.
        An already-claimed entry is refused with a 409 - exactly-once
        semantics for claim-if-absent sets.
      parameters:
        - $ref: "#/components/parameters/blowhornLedgerEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlowhornLedgerClaimRequest"
      responses:
        "200":
          description: Blowhorn ledger entry claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornLedgerEntry"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /api/blowhorn/contacts:
    get:
      x-internal: ["cloud"]
      tags:
        - blowhornLedger
      summary: List Blowhorn contacts
      operationId: listBlowhornContacts
      description: Returns a paginated list of Blowhorn contacts in the organization of the authenticated session, optionally filtered by platform.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/pagesize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/order"
        - name: platform
          in: query
          required: false
          description: Filter by platform (e.g. linkedin, github).
          schema:
            type: string
      responses:
        "200":
          description: Blowhorn contacts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornContactPage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - blowhornLedger
      summary: Upsert Blowhorn contact
      operationId: upsertBlowhornContact
      description: |
        Creates a new Blowhorn contact when no `id` is supplied, or
        updates the entry matching the provided `id`. Contacts are keyed
        by the (platform, handle) pair within the organization. Ownership
        is derived from the authenticated session; any client-supplied
        owner is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlowhornContactPayload"
      responses:
        "200":
          description: Blowhorn contact saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornContact"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /api/blowhorn/mentees:
    get:
      x-internal: ["cloud"]
      tags:
        - blowhornLedger
      summary: List Blowhorn mentees
      operationId: listBlowhornMentees
      description: Returns a paginated list of Blowhorn mentees in the organization of the authenticated session.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/pagesize"
        - $ref: "#/components/parameters/search"
        - $ref: "#/components/parameters/order"
      responses:
        "200":
          description: Blowhorn mentees page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornMenteePage"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    post:
      x-internal: ["cloud"]
      tags:
        - blowhornLedger
      summary: Upsert Blowhorn mentee
      operationId: upsertBlowhornMentee
      description: |
        Creates a new Blowhorn mentee when no `id` is supplied, or
        updates the entry matching the provided `id`. Ownership is
        derived from the authenticated session; any client-supplied
        owner is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlowhornMenteePayload"
      responses:
        "200":
          description: Blowhorn mentee saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornMentee"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /api/blowhorn/mentees/{blowhornMenteeId}:
    delete:
      x-internal: ["cloud"]
      tags:
        - blowhornLedger
      summary: Delete Blowhorn mentee
      operationId: deleteBlowhornMentee
      description: Removes the Blowhorn mentee.
      parameters:
        - $ref: "#/components/parameters/blowhornMenteeId"
      responses:
        "204":
          description: Blowhorn mentee deleted
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /api/blowhorn/mentees/{blowhornMenteeId}/drop:
    post:
      x-internal: ["cloud"]
      tags:
        - blowhornLedger
      summary: Record and drop Blowhorn mentee
      operationId: recordAndDropBlowhornMentee
      description: |
        Records the mentee and drops it in a single operation, stamping
        the drop time on the returned entry.
      parameters:
        - $ref: "#/components/parameters/blowhornMenteeId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlowhornMenteeDropRequest"
      responses:
        "200":
          description: Blowhorn mentee recorded and dropped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlowhornMentee"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

components:
  securitySchemes:
    jwt:
      type: http
      scheme: Bearer [REDACTED]
      bearerFormat: JWT

  responses:
    400:
      $ref: "../../v1beta2/core/api.yml#/components/responses/400"
    401:
      $ref: "../../v1beta2/core/api.yml#/components/responses/401"
    404:
      $ref: "../../v1beta2/core/api.yml#/components/responses/404"
    409:
      $ref: "../../v1beta2/core/api.yml#/components/responses/409"
    500:
      $ref: "../../v1beta2/core/api.yml#/components/responses/500"

  parameters:
    blowhornLedgerEntryId:
      name: blowhornLedgerEntryId
      in: path
      description: Blowhorn ledger entry ID
      required: true
      schema:
        $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
    blowhornMenteeId:
      name: blowhornMenteeId
      in: path
      description: Blowhorn mentee ID
      required: true
      schema:
        $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
    page:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/page"
    pageSize:
      name: pageSize
      in: query
      description: Number of items per page (canonical camelCase form).
      schema:
        type: integer
        minimum: 1
    pagesize:
      name: pagesize
      in: query
      description: |
        Number of items per page. Deprecated alias of pageSize;
        canonical `pageSize` wins when both are present.
      deprecated: true
      schema:
        type: integer
        minimum: 1
    search:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/search"
    order:
      $ref: "../../v1beta2/core/api.yml#/components/parameters/order"

  schemas:
    BlowhornLedgerEntry:
      $ref: "./blowhorn_ledger.yaml"

    BlowhornContact:
      $ref: "./blowhorn_contact.yaml"

    BlowhornMentee:
      $ref: "./blowhorn_mentee.yaml"

    BlowhornLedgerPayload:
      type: object
      description: |
        Payload for recording a Blowhorn ledger entry. Contains only
        client-settable fields; the owning `organizationId` (derived from
        the authenticated session), the claim columns and the
        server-generated `createdAt` / `updatedAt` timestamps are
        intentionally excluded.
      required:
        - ledger
        - entryKey
      properties:
        id:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: Existing Blowhorn ledger entry ID for updates; omit on record.
          x-oapi-codegen-extra-tags:
            json: "id,omitempty"
        ledger:
          type: string
          description: Ledger discriminator naming the idempotent set.
          minLength: 1
          maxLength: 255
        entryKey:
          type: string
          description: Key within the ledger. Unique per ledger.
          minLength: 1
          maxLength: 1024
          x-go-name: EntryKey
        value:
          type: object
          description: Entry value, stored as a JSON blob.
          x-go-type: core.Map
          x-go-type-import:
            path: github.com/meshery/schemas/models/core
            name: core
          x-go-type-skip-optional-pointer: true

    BlowhornLedgerClaimRequest:
      type: object
      description: Claim-if-absent payload taking an unclaimed entry for a holder.
      required:
        - holder
      properties:
        holder:
          type: string
          description: Holder taking the entry. Refused with a 409 when the entry is already claimed.
          minLength: 1
          maxLength: 255

    BlowhornContactPayload:
      type: object
      description: |
        Payload for creating or updating a Blowhorn contact. Contains
        only client-settable fields; the owning `organizationId` (derived
        from the authenticated session) and the server-generated
        `createdAt` / `updatedAt` timestamps are intentionally excluded.
      required:
        - platform
        - handle
      properties:
        id:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: Existing Blowhorn contact ID for updates; omit on create.
          x-oapi-codegen-extra-tags:
            json: "id,omitempty"
        platform:
          type: string
          description: Platform the contact belongs to (e.g. linkedin, github).
          minLength: 1
          maxLength: 255
        handle:
          type: string
          description: Platform-side handle identifying the contact. Unique per platform within the organization.
          minLength: 1
          maxLength: 255
        displayName:
          type: string
          description: Human-readable contact name.
          maxLength: 255
        profileUrl:
          type: string
          description: Platform-side profile URL for the contact.
          maxLength: 1024
        metadata:
          type: object
          description: Contact metadata, stored as a JSON blob.
          x-go-type: core.Map
          x-go-type-import:
            path: github.com/meshery/schemas/models/core
            name: core
          x-go-type-skip-optional-pointer: true

    BlowhornMenteePayload:
      type: object
      description: |
        Payload for creating or updating a Blowhorn mentee. Contains only
        client-settable fields; the owning `organizationId` (derived from
        the authenticated session), the server-managed `droppedAt` and
        the server-generated `createdAt` / `updatedAt` timestamps are
        intentionally excluded.
      required:
        - subject
      properties:
        id:
          $ref: "../../v1beta2/core/api.yml#/components/schemas/Uuid"
          description: Existing Blowhorn mentee ID for updates; omit on create.
          x-oapi-codegen-extra-tags:
            json: "id,omitempty"
        subject:
          type: string
          description: Mentored subject.
          minLength: 1
          maxLength: 255
        stage:
          type: string
          description: Mentorship stage of the subject.
          maxLength: 255
        metadata:
          type: object
          description: Mentee metadata, stored as a JSON blob.
          x-go-type: core.Map
          x-go-type-import:
            path: github.com/meshery/schemas/models/core
            name: core
          x-go-type-skip-optional-pointer: true

    BlowhornMenteeDropRequest:
      type: object
      description: Record-and-drop payload.
      properties:
        stage:
          type: string
          description: Final mentorship stage recorded with the drop.
          maxLength: 255

    BlowhornLedgerPage:
      type: object
      description: Paginated collection of Blowhorn ledger entries.
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
        blowhornLedgerEntries:
          type: array
          items:
            $ref: "#/components/schemas/BlowhornLedgerEntry"
            x-go-type: BlowhornLedgerEntry
          description: Blowhorn ledger entries included on this page of results.

    BlowhornContactPage:
      type: object
      description: Paginated collection of Blowhorn contacts.
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
        blowhornContacts:
          type: array
          items:
            $ref: "#/components/schemas/BlowhornContact"
            x-go-type: BlowhornContact
          description: Blowhorn contacts included on this page of results.

    BlowhornMenteePage:
      type: object
      description: Paginated collection of Blowhorn mentees.
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
        blowhornMentees:
          type: array
          items:
            $ref: "#/components/schemas/BlowhornMentee"
            x-go-type: BlowhornMentee
          description: Blowhorn mentees included on this page of results.
