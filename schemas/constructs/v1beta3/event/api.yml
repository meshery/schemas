openapi: 3.0.0
info:
  title: Events
  description: OpenAPI schema for Meshery events and system notifications.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
- name: events
  description: APIs for Meshery Cloud events.
paths:
  /api/events/{eventId}:
    delete:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: deleteEvent
      summary: Delete a single event
      parameters:
      - $ref: '#/components/parameters/eventId'
      responses:
        '204':
          description: Event deleted
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          $ref: '#/components/responses/500'
  /api/events/delete:
    post:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: bulkDeleteEvents
      summary: Bulk delete events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequest'
      responses:
        '200':
          description: Events deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          $ref: '#/components/responses/500'
  /api/events/status:
    put:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: bulkUpdateEventStatus
      summary: Bulk update event status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateStatusRequest'
      responses:
        '200':
          description: Events updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateStatusResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          $ref: '#/components/responses/500'
  /api/events/{eventId}/status:
    put:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: updateEventStatus
      summary: Update status of a single event
      parameters:
      - $ref: '#/components/parameters/eventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventStatusRequest'
      responses:
        '200':
          description: Event status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateEventStatusResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          $ref: '#/components/responses/500'
  /api/workspaces/{workspaceId}/events:
    get:
      x-internal:
      - cloud
      tags:
      - events
      security:
      - jwt: []
      operationId: getEventsOfWorkspace
      summary: Get workspace events
      description: Gets events for a workspace.
      parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pagesizeLegacy'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/order'
      responses:
        '200':
          description: Workspace events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Workspace not found
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          description: Server error
  /api/events:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEventsAggregate
      summary: Get events aggregate summary
      parameters:
      - $ref: '#/components/parameters/cumulative'
      responses:
        '200':
          description: Events aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsAggregate'
        '401':
          description: Unauthorized
        '403':
          $ref: '#/components/responses/MeshkitError403'
        '404':
          description: Not found - the caller is not a provider-wide Provider Admin
          content:
            text/plain:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          description: Server error
    post:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: createEvent
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
      description: >
        Records an event and answers 201 with it. The server assigns the
        organization from the session; clients do not send it.


        **Retries (`idempotencyKey`).** When the payload carries an
        `idempotencyKey` the authenticated caller already used, nothing is
        recorded or changed and the answer is 200 with the event that key is
        bound to (`Event-Disposition: replayed`). This check runs first, so a
        retried create never counts an occurrence twice.


        **Conditions (`correlationKey`).** A payload that carries a
        `correlationKey` reports an occurrence of an ongoing condition. A
        condition is open while its event has no `resolvedAt`, and the
        authenticated caller (organization and user, as for
        `idempotencyKey`) has at most one open event per key; the server
        enforces that atomically. A call that identifies no user records the
        event without correlating it. For a payload without `resolvedAt`:
        when the caller has an open event with the key, no event is recorded;
        that event's `occurrenceCount` grows by the payload's
        `occurrenceCount` (1 when omitted), its `lastSeenAt` becomes the
        later of its own and the payload's `lastSeenAt` (the time of receipt
        when omitted), and the answer is 200 with it
        (`Event-Disposition: incremented`). Every other field keeps the value
        it was first recorded with. Otherwise a new event is recorded, which
        opens the condition: `occurrenceCount` defaults to 1, `firstSeenAt`
        to the payload's `firstSeenAt`, else its `lastSeenAt`, else the time
        of receipt, and `lastSeenAt` to the payload's `lastSeenAt`, else
        `firstSeenAt` (201, `Event-Disposition: created`).


        **Resolution.** A producer closes a condition by creating an event
        with the condition's `correlationKey` and a `resolvedAt` time, after
        the condition clears. When the caller has an open event with the key,
        that event gets the `resolvedAt`, nothing new is recorded, and the
        answer is 200 with the closed event (`Event-Disposition: resolved`).
        When none is open, the payload is recorded as a new, already resolved
        event (201, `created`). Once closed, the next occurrence opens a new
        condition with a new event. Send a resolution only when the condition
        changes from present to cleared, never on every healthy check.


        **Composition.** When a create that carries both keys does not replay,
        its `idempotencyKey` is bound to the event the create recorded,
        incremented or resolved, so a retry answers 200 with that event and
        changes nothing. Deduplication a server applies on its own, without a
        client key, must not swallow an occurrence of an event that carries a
        `correlationKey`: the occurrence counts. Whether a counted occurrence
        notifies anyone again is the reader's policy, not this operation's.
        See docs/event-correlation-contract.md.
      responses:
        '200':
          description: >
            No new event was recorded. The answer is the existing event the
            create resolved to: the one already recorded under this caller's
            `idempotencyKey` (`replayed`, unchanged), the open event of this
            `correlationKey` with the occurrence counted (`incremented`), or
            that event closed by the payload's `resolvedAt` (`resolved`).
          headers:
            Event-Disposition:
              $ref: '#/components/headers/EventDisposition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '201':
          description: >
            A new event was recorded (`Event-Disposition: created`). With a
            `correlationKey`, it opens a condition, or records one already
            resolved when the payload carries `resolvedAt`.
          headers:
            Event-Disposition:
              $ref: '#/components/headers/EventDisposition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          $ref: '#/components/responses/500'
  /api/events/list:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEvents
      summary: Get events list
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/eventsFilter'
      - $ref: '#/components/parameters/eventsScope'
      responses:
        '200':
          description: Events page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '401':
          description: Unauthorized
        '403':
          $ref: '#/components/responses/MeshkitError403'
        '404':
          description: Not found
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          description: Server error
  /api/events/feed:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEventFeed
      summary: Get event feed
      description: |
        Generic, unauthenticated feed of events whose visibility is `public`
        and whose owner's `shareActivityPublicly` preference is on at read
        time. Results are ordered newest first by `createdAt` and can be
        filtered by category and action. Rate limited per client IP; an
        over-limit client receives 429 with `Retry-After`. Responses carry
        `Cache-Control: public, max-age=N` where N is at most 30 seconds.
        See docs/event-feed-contract.md.
      security: []
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/feedPagesize'
      - $ref: '#/components/parameters/feedCategory'
      - $ref: '#/components/parameters/feedAction'
      responses:
        '200':
          description: Event feed page
          headers:
            Cache-Control:
              description: "`public, max-age=N` with N from 0 to 30; max-age never exceeds 30 seconds."
              required: true
              schema:
                type: string
                pattern: "^public, max-age=([0-9]|[12][0-9]|30)$"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFeedPage'
        '400':
          $ref: '#/components/responses/400'
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          $ref: '#/components/responses/500'
  /api/events/summary:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEventSummaryByUser
      summary: Get event summary by user
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: Event summary page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSummaryPage'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          description: Server error
  /api/events/types:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEventTypes
      summary: Get event types
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pagesizeLegacy'
      responses:
        '200':
          description: Event types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          description: Server error
components:
  responses:
    400:
      $ref: ../../v1beta2/core/api.yml#/components/responses/400
    401:
      $ref: ../../v1beta2/core/api.yml#/components/responses/401
    404:
      $ref: ../../v1beta2/core/api.yml#/components/responses/404
    MeshkitError429:
      $ref: "../../v1beta2/core/api.yml#/components/responses/MeshkitError429"
    500:
      $ref: ../../v1beta2/core/api.yml#/components/responses/500
    MeshkitError403:
      $ref: ../../v1beta2/core/api.yml#/components/responses/MeshkitError403
  headers:
    EventDisposition:
      description: >
        What `createEvent` did with the payload: `created` (a new event was
        recorded), `replayed` (the `idempotencyKey` was already used; nothing
        changed), `incremented` (an occurrence of the open condition with
        this `correlationKey` was counted) or `resolved` (that condition was
        closed). A server that implements condition correlation sends it on
        every 200 and 201. A server that predates correlation omits it; there
        201 means created and 200 means replayed. A browser client calling a
        server on another origin reads it only when that server lists it in
        `Access-Control-Expose-Headers`.
      required: false
      schema:
        type: string
        enum:
          - created
          - replayed
          - incremented
          - resolved
  parameters:
    eventId:
      name: eventId
      in: path
      description: ID of the event.
      required: true
      schema:
        type: string
        format: uuid
    workspaceId:
      name: workspaceId
      in: path
      description: Workspace ID
      schema:
        $ref: ../../v1beta2/core/api.yml#/components/schemas/WorkspaceId
      required: true
    page:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/page
    pageSize:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/pageSize
    pagesize:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/pagesize
    pagesizeLegacy:
      name: pagesize
      in: query
      description: Get responses by pagesize. Deprecated alias of pageSize.
      deprecated: true
      schema:
        type: integer
    feedPagesize:
      name: pagesize
      in: query
      required: false
      description: Number of feed items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    feedCategory:
      name: category
      in: query
      required: false
      description: Optional event category filter.
      schema:
        type: string
        maxLength: 500
    feedAction:
      name: action
      in: query
      required: false
      description: Optional event action filter.
      schema:
        type: string
        maxLength: 500
    search:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/search
    order:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/order
    cumulative:
      name: cumulative
      in: query
      description: When true, return cumulative aggregate counts across all time.
      required: false
      schema:
        type: boolean
    filter:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/filter
    eventsFilter:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/filter
    eventsScope:
      name: scope
      in: query
      required: false
      description: >
        Which events are returned. `user` (default): only the caller's own
        events (unchanged behavior). `organization`: every member's events in
        the caller's session organization. Requires organization administration
        permission in the session organization; callers without it get 403.
      schema:
        type: string
        enum:
          - user
          - organization
        default: user
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EventPayload:
      type: object
      description: >-
        Payload for creating a new event. If visibility is absent, the event
        is private.
      additionalProperties: true
      properties:
        owner:
          type: string
          format: uuid
          description: UUID of the user associated with the event.
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid
          x-go-name: Owner
          x-oapi-codegen-extra-tags:
            db: owner
            json: "owner,omitempty"
        category:
          type: string
          description: The category of the event.
          maxLength: 500
        visibility:
          $ref: '#/components/schemas/EventVisibility'
          description: >-
            Who can see the event. `private` is the default; clients may set
            `public` for events eligible for the unauthenticated feed.
          x-oapi-codegen-extra-tags:
            json: "visibility,omitempty"
        action:
          type: string
          description: The action of the event.
          maxLength: 500
        description:
          type: string
          description: Description of the event.
          maxLength: 5000
        idempotencyKey:
          type: string
          description: >
            Optional client-chosen key that makes recording this event safe to
            retry. Keys are scoped to the authenticated caller (organization and
            user), never to the client-settable `owner` field, so `owner` may be
            omitted without affecting deduplication. The first event a caller
            records with a key is kept, and a later create with the same key
            records nothing and answers 200 with that event, whatever the rest of
            the payload says. Use a value that names the occurrence, for example
            a run id, so a client replaying a local queue after a timeout never
            records a duplicate. Omit it for events that need no deduplication.
          minLength: 1
          maxLength: 255
          x-oapi-codegen-extra-tags:
            json: "idempotencyKey,omitempty"
        correlationKey:
          type: string
          description: >
            Optional key naming the ongoing condition this event reports, so
            repeated occurrences count on one open event instead of recording
            one each (see createEvent). Name the condition, not the occurrence,
            and qualify it by the emitting source and component plus the
            subject, for example
            `meshery-server/k8s-connection/<connectionId>/unreachable`. Never
            use an error code alone: codes are scoped to the component that
            owns them. Unlike `idempotencyKey`, which makes one create safe to
            retry, this key spans many creates.
          minLength: 1
          maxLength: 255
          x-oapi-codegen-extra-tags:
            json: "correlationKey,omitempty"
        occurrenceCount:
          type: integer
          description: >
            Number of occurrences this create reports, for a producer that
            counted repeats locally before sending; omitted means 1. With a
            `correlationKey` it is added to the open condition's count.
          minimum: 1
          x-oapi-codegen-extra-tags:
            json: "occurrenceCount,omitempty"
        firstSeenAt:
          type: string
          format: date-time
          description: >
            When the producer first saw the occurrences this create reports;
            omitted means `lastSeenAt`, or the time of receipt. Kept only when
            the create opens a condition.
          x-oapi-codegen-extra-tags:
            json: "firstSeenAt,omitempty"
        lastSeenAt:
          type: string
          format: date-time
          description: >
            When the producer last saw the occurrences this create reports;
            omitted means the time of receipt.
          x-oapi-codegen-extra-tags:
            json: "lastSeenAt,omitempty"
        resolvedAt:
          type: string
          format: date-time
          description: >
            When the condition named by `correlationKey` cleared. A create that
            carries it is a resolution: it closes the caller's open event with
            that key, so the next occurrence opens a new condition (see
            createEvent). Give the resolution a severity and description that
            say what cleared, for example severity `success` and `Connection to
            cluster prod-1 restored`, under the condition's category.
          x-oapi-codegen-extra-tags:
            json: "resolvedAt,omitempty"
        source:
          type: string
          format: uri-reference
          description: >
            Which surface emitted the event, as a CloudEvents-compatible
            `source` (a URI reference): `meshery-server`, `meshery-ui`,
            `mesheryctl`, `meshery-adapter-<name>` (for example
            `meshery-adapter-istio`), `layer5-cloud`, or another client's
            name. `systemId` says which instance; `source` says which kind of
            client, so a failure a person caused in the UI is told apart from
            the same failure from the CLI. An open set: a new surface needs no
            schema change.
          minLength: 1
          maxLength: 255
          x-oapi-codegen-extra-tags:
            json: "source,omitempty"
        type:
          type: string
          description: >
            CloudEvents-compatible `type`: a reverse-DNS name of the kind of
            occurrence, for example `io.meshery.user.signup`. It does not
            replace `category` and `action`, which stay two free strings;
            `type` is for CloudEvents-aware consumers.
          minLength: 1
          maxLength: 255
          x-oapi-codegen-extra-tags:
            json: "type,omitempty"
        specversion:
          description: >
            The CloudEvents specification version the event's `source`, `type`
            and `id` are compatible with, when the producer sets them as
            CloudEvents attributes. A Meshery event is CloudEvents compatible;
            it is not a CloudEvent.
          $ref: '#/components/schemas/EventSpecVersion'
          x-go-name: SpecVersion
          x-oapi-codegen-extra-tags:
            json: "specversion,omitempty"
        traceId:
          type: string
          description: >
            W3C Trace Context `trace-id` (32 lowercase hex digits, not all
            zeros) of the user-level operation the event belongs to, so the
            event joins the OpenTelemetry trace that operation recorded. The
            client that starts the operation mints it, and every event of the
            operation and its sub-operations carries it; the server never
            mints one at persist time.
          minLength: 32
          maxLength: 32
          pattern: '^[0-9a-f]{32}$'
          x-id-format: external
          x-go-name: TraceID
          x-oapi-codegen-extra-tags:
            json: "traceId,omitempty"
        parentId:
          type: string
          description: >
            W3C Trace Context `parent-id` (16 lowercase hex digits, not all
            zeros): the span of the sub-operation that emitted the event, so
            the events of one operation form its tree. Minted by the client
            with `traceId`, never by the server.
          minLength: 16
          maxLength: 16
          pattern: '^[0-9a-f]{16}$'
          x-id-format: external
          x-go-name: ParentID
          x-oapi-codegen-extra-tags:
            json: "parentId,omitempty"
    UpdateEventStatusRequest:
      type: object
      description: Payload for updating the status of a single event.
      required:
      - status
      properties:
        status:
          type: string
          example: completed
          description: Current status of the event.
          maxLength: 255
    UpdateEventStatusResponse:
      type: object
      description: Response body returned after updating an event's status.
      properties:
        message:
          type: string
          description: Human-readable status message.
          maxLength: 500
        eventId:
          type: string
          format: uuid
          description: UUID of the event whose status was updated.
          x-oapi-codegen-extra-tags:
            json: "eventId,omitempty"
        status:
          type: string
          description: Updated status of the event.
          maxLength: 255
    BulkDeleteRequest:
      type: object
      description: Payload for bulk-deleting events by ID.
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: UUIDs of the events to delete.
    BulkDeleteResponse:
      type: object
      description: Response body returned after bulk event deletion.
      properties:
        deleted:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of events that were deleted.
    BulkUpdateStatusRequest:
      type: object
      description: Payload for bulk-updating the status of events.
      required:
      - ids
      - status
      properties:
        ids:
          type: array
          items:
            $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: UUIDs of the events to update.
        status:
          type: string
          example: failed
          description: New status to apply to the selected events.
          maxLength: 255
    BulkUpdateStatusResponse:
      type: object
      description: Response body returned after bulk event status update.
      properties:
        updated:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of events whose status was updated.
    EventResult:
      $ref: ./event.yaml
    Event:
      type: object
      description: >
        One recorded event (an `event_trackers` row) in the wire form MeshKit's
        `models/events.Event` serializes. Meshery Cloud returns these, for
        example, as the per-path failure records of a GitHub repository import
        (`importGithubRepository`, `errors`). Unlike EventResult, it carries no
        joined user profile fields.
      required:
        - id
