        why the operation failed, and the event is recorded with severity
        `error` under its usual category `pattern` and action (`validate` for
        a design validation). Never put design contents into event metadata -
        no `designFile`, `patternFile`, `components`, `relationships`,
        `trace`, `evaluationResponse`, the raw `summary` or
        `validationResult`. Meshery Server applies a 16 KB guard that drops
        oversized metadata down to the identity fields.
