openapi: 3.0.0
info:
  title: Events
  description: OpenAPI schema for Meshery events and system notifications.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
- name: events
  description: APIs for Meshery Cloud events.
security:
- jwt: []
paths:
  /api/events/{eventId}:
    delete:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: deleteEvent
      summary: Delete a single event
      parameters:
      - $ref: '#/components/parameters/eventId'
      responses:
        '204':
          description: Event deleted
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /api/events/delete:
    post:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: bulkDeleteEvents
      summary: Bulk delete events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequest'
      responses:
        '200':
          description: Events deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /api/events/status:
    put:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: bulkUpdateEventStatus
      summary: Bulk update event status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateStatusRequest'
      responses:
        '200':
          description: Events updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateStatusResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /api/events/{eventId}/status:
    put:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: updateEventStatus
      summary: Update status of a single event
      parameters:
      - $ref: '#/components/parameters/eventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventStatusRequest'
      responses:
        '200':
          description: Event status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateEventStatusResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /api/workspaces/{workspaceId}/events:
    get:
      x-internal:
      - cloud
      tags:
      - events
      # Declared per-operation as well as at the document level: the bundler
      # does not yet merge document-level `security` into the published
      # bundles, so dropping this line would silently remove the only JWT
      # requirement that reaches them.
      security:
      - jwt: []
      operationId: getEventsOfWorkspace
      summary: Get workspace events
      description: Gets events for a workspace.
      parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pagesizeLegacy'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/order'
      responses:
        '200':
          description: Workspace events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Workspace not found
        '500':
          description: Server error
  /api/events:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEventsAggregate
      summary: Get events aggregate summary
      parameters:
      - $ref: '#/components/parameters/cumulative'
      responses:
        '200':
          description: Events aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsAggregate'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Server error
    post:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: createEvent
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
      responses:
        '201':
          description: Event created
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  # Cloud-only. Meshery Server serves its own events list at
  # GET /api/system/events (getSystemEvents below) with a different envelope;
  # it only *calls* this path as a client of the remote provider.
  /api/events/list:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEvents
      summary: Get events list
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pagesizeLegacy'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/eventsFilter'
      responses:
        '200':
          description: Events page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Server error
  /api/events/summary:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEventSummaryByUser
      summary: Get event summary by user
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pagesizeLegacy'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: Event summary page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSummaryPage'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Server error
  # Cloud-only. Meshery Server serves GET /api/system/events/types
  # (getSystemEventTypes below), which returns a different shape.
  /api/events/types:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEventTypes
      summary: Get event types
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pagesizeLegacy'
      responses:
        '200':
          description: Event types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Server error
  # Meshery-server-only. These are the paths Meshery Server serves for its
  # notification centre. They are declared separately from the /api/events/*
  # operations above because Cloud and Meshery Server serve this domain at
  # different paths and with different envelopes - Meshery Server returns the
  # page under `events` and the types as one object of two arrays, where Cloud
  # returns `data` and an array of category/action pairs. Widening the Cloud
  # operations with x-internal: ["meshery"] would emit hooks that 404 against
  # Meshery Server (meshery/schemas#1134).
  /api/system/events:
    get:
      x-internal:
      - meshery
      tags:
      - events
      operationId: getSystemEvents
      summary: Get Meshery Server events
      description: >-
        Returns a page of events this Meshery Server recorded for the
        authenticated user, with the unread and per-severity counts the
        notification center renders.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pagesizeLegacy'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/eventStatus'
      - $ref: '#/components/parameters/eventCategoryFilter'
      - $ref: '#/components/parameters/eventActionFilter'
      - $ref: '#/components/parameters/eventSeverityFilter'
      - $ref: '#/components/parameters/eventActedUponFilter'
      responses:
        '200':
          description: Events page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemEventsPage'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /api/system/events/types:
    get:
      x-internal:
      - meshery
      tags:
      - events
      operationId: getSystemEventTypes
      summary: Get Meshery Server event categories and actions
      description: >-
        Returns the distinct categories and actions present in this Meshery
        Server's events, used to populate the notification center filters.
      responses:
        '200':
          description: Event categories and actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemEventTypes'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  # Meshery-server-only: event log level configuration. Declared at the path
  # Meshery Server serves today; if the server ever moves its event routes off
  # the /api/system prefix, that is a new operation, not an edit to this one
  # (meshery/schemas#1134).
  /api/system/events/config:
    get:
      x-internal:
      - meshery
      tags:
      - events
      operationId: getEventConfig
      summary: Get server event log level configuration
      description: >-
        Returns the current server event log level and the levels this server
        supports. The `status` field is not sent on this response; it is only
        set by the update operation.
      responses:
        '200':
          description: Event configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventConfig'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
    put:
      x-internal:
      - meshery
      tags:
      - events
      operationId: updateEventConfig
      summary: Update server event log level configuration
      description: >-
        Sets the server event log level to the requested value. Meshery Server
        also accepts `warn` as an alias for `warning`, and the legacy
        `event_log_level` body key alongside the canonical `eventLogLevel`;
        neither is declared here because new clients must use the canonical
        spellings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventConfigPayload'
      responses:
        '200':
          description: Event configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventConfig'
        '400':
          description: >-
            The body could not be decoded or names a level this server does not
            support. The server answers with the unchanged configuration and
            `status: error`, not the generic error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventConfig'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
components:
  responses:
    400:
      $ref: ../../v1beta2/core/api.yml#/components/responses/400
    401:
      $ref: ../../v1beta2/core/api.yml#/components/responses/401
    404:
      $ref: ../../v1beta2/core/api.yml#/components/responses/404
    500:
      $ref: ../../v1beta2/core/api.yml#/components/responses/500
  parameters:
    eventId:
      name: eventId
      in: path
      description: ID of the event.
      required: true
      schema:
        type: string
        format: uuid
    workspaceId:
      name: workspaceId
      in: path
      description: Workspace ID
      schema:
        $ref: ../../v1beta2/core/api.yml#/components/schemas/WorkspaceId
      required: true
    page:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/page
    pageSize:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/pageSize
    pagesizeLegacy:
      name: pagesize
      in: query
      description: Get responses by pagesize. Deprecated alias of pageSize.
      deprecated: true
      schema:
        type: integer
    search:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/search
    sort:
      name: sort
      in: query
      description: >-
        Column to sort the events by. Meshery Server passes this value to its
        ORDER BY allow-list, so only these three are honoured; anything else
        falls back to the default. The values are database column names rather
        than wire identifiers because that is what the allow-list matches.
      required: false
      schema:
        type: string
        enum: [created_at, updated_at, name]
    eventStatus:
      name: status
      in: query
      description: Only return events with this read status.
      required: false
      schema:
        $ref: '#/components/schemas/EventStatus'
    eventCategoryFilter:
      name: category
      in: query
      description: >-
        JSON-encoded array of event categories to filter by, for example
        `["pattern","connection"]`. Meshery Server parses this value as JSON.
      required: false
      schema:
        type: string
        maxLength: 2048
    eventActionFilter:
      name: action
      in: query
      description: >-
        JSON-encoded array of event actions to filter by, for example
        `["update","delete"]`. Meshery Server parses this value as JSON.
      required: false
      schema:
        type: string
        maxLength: 2048
    eventSeverityFilter:
      name: severity
      in: query
      description: >-
        JSON-encoded array of event severities to filter by, for example
        `["error","warning"]`. Meshery Server parses this value as JSON.
      required: false
      schema:
        type: string
        maxLength: 2048
    eventActedUponFilter:
      name: actedUpon
      in: query
      description: >-
        JSON-encoded array of entity UUIDs to filter by. Meshery Server parses
        this value as JSON and also accepts the legacy `acted_upon` spelling.
      required: false
      schema:
        type: string
        maxLength: 2048
    order:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/order
    cumulative:
      name: cumulative
      in: query
      description: When true, return cumulative aggregate counts across all time.
      required: false
      schema:
        type: boolean
    filter:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/filter
    eventsFilter:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/filter
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EventPayload:
      type: object
      description: Payload for creating a new event.
      additionalProperties: true
      properties:
        owner:
          type: string
          format: uuid
          description: UUID of the user associated with the event.
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid
          x-go-name: Owner
          x-oapi-codegen-extra-tags:
            db: owner
            json: "owner,omitempty"
        category:
          type: string
          description: The category of the event.
          maxLength: 500
        action:
          type: string
          description: The action of the event.
          maxLength: 500
        description:
          type: string
          description: Description of the event.
          maxLength: 5000
    UpdateEventStatusRequest:
      type: object
      description: Payload for updating the status of a single event.
      required:
      - status
      properties:
        status:
          type: string
          example: completed
          description: Current status of the event.
          maxLength: 255
    UpdateEventStatusResponse:
      type: object
      description: Response body returned after updating an event's status.
      properties:
        message:
          type: string
          description: Human-readable status message.
          maxLength: 500
        eventId:
          type: string
          format: uuid
          description: UUID of the event whose status was updated.
          x-oapi-codegen-extra-tags:
            json: "eventId,omitempty"
        status:
          type: string
          description: Updated status of the event.
          maxLength: 255
    BulkDeleteRequest:
      type: object
      description: Payload for bulk-deleting events by ID.
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: UUIDs of the events to delete.
    BulkDeleteResponse:
      type: object
      description: Response body returned after bulk event deletion.
      properties:
        deleted:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of events that were deleted.
    BulkUpdateStatusRequest:
      type: object
      description: Payload for bulk-updating the status of events.
      required:
      - ids
      - status
      properties:
        ids:
          type: array
          items:
            $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: UUIDs of the events to update.
        status:
          type: string
          example: failed
          description: New status to apply to the selected events.
          maxLength: 255
    BulkUpdateStatusResponse:
      type: object
      description: Response body returned after bulk event status update.
      properties:
        updated:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of events whose status was updated.
    EventResult:
      $ref: ./event.yaml
    EventsPage:
      type: object
      description: Paginated list of events.
      properties:
        page:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Number
          description: Zero-based page index returned in this response.
        pageSize:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Number
          description: Maximum number of items returned on each page.
          minimum: 1
          x-oapi-codegen-extra-tags:
            json: "pageSize,omitempty"
        totalCount:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Number
          description: Total number of items across all pages.
          minimum: 0
          x-oapi-codegen-extra-tags:
            json: "totalCount,omitempty"
        readCount:
          type: integer
          description: Number of events the user has already read.
          minimum: 0
          x-oapi-codegen-extra-tags:
            json: "readCount,omitempty"
        countBySeverityLevel:
          type: array
          description: Event count grouped by severity level.
          items:
            $ref: '#/components/schemas/SeverityCount'
          x-oapi-codegen-extra-tags:
            json: "countBySeverityLevel,omitempty"
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventResult'
          description: The events returned on the current page.
    EventsAggregate:
      type: object
      description: Aggregated event counts across categories.
      properties:
        audit:
          type: integer
          description: Count of audit-category events.
          minimum: 0
      additionalProperties: true
    EventSummary:
      type: object
      description: Per-user event summary entry.
      additionalProperties: true
    EventSummaryPage:
      type: object
      description: Paginated list of per-user event summaries.
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
          x-oapi-codegen-extra-tags:
            json: "pageSize,omitempty"
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
          x-oapi-codegen-extra-tags:
            json: "totalCount,omitempty"
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
          description: The event summaries returned on the current page.
    EventType:
      type: object
      description: A category/action pair describing one kind of event.
      properties:
        category:
          type: string
          description: The category of the event type.
          maxLength: 500
        action:
          type: string
          description: The action of the event type.
          maxLength: 500
    SeverityCount:
      type: object
      description: Event count for a specific severity level.
      properties:
        severity:
          type: string
          description: Severity level name.
          maxLength: 100
        count:
          type: integer
          description: Number of events at this severity level.
          minimum: 0
    EventSeverity:
      type: string
      description: One of the standard event severity levels.
      enum: [emergency, alert, critical, error, warning, informational, debug, success]
      maxLength: 20
    EventStatus:
      type: string
      description: Whether the user has read the event.
      enum: [read, unread]
      maxLength: 10
    SystemEvent:
      type: object
      description: >-
        One event recorded by Meshery Server. Mirrors the Event model in
        meshkit (`models/events.Event`), which is what the server encodes.
      required:
      - id
      - actedUpon
      - systemId
      - operationId
      - category
      - action
      - description
      - severity
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: UUID of the event.
        actedUpon:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: UUID of the entity the event was performed on.
        systemId:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: UUID of the Meshery Server that recorded the event.
        operationId:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: UUID correlating the events of a single operation.
        owner:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: UUID of the user the event belongs to.
        category:
          type: string
          description: Resource the operation was invoked on, such as `pattern`.
          maxLength: 500
        action:
          type: string
          description: Action taken on the resource, such as `update`.
          maxLength: 500
        description:
          type: string
          description: A summary of the event that occurred.
          maxLength: 4096
        severity:
          $ref: '#/components/schemas/EventSeverity'
        status:
          $ref: '#/components/schemas/EventStatus'
        metadata:
          type: object
          description: >-
            Information specific to this kind of event. The structure differs
            per event, and the server emits `null` when there is none.
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the event was recorded.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the event was last updated.
        deletedAt:
          type: string
          format: date-time
          description: Timestamp when the event was deleted, absent while it lives.
    SystemEventsPage:
      type: object
      description: >-
        A page of Meshery Server events. Note the events are returned under
        `events`, not `data` - Cloud's EventsPage uses `data`.
      required:
      - events
      - page
      - pageSize
      - totalCount
      - readCount
      - countBySeverityLevel
      properties:
        events:
          type: array
          description: The events on this page.
          items:
            $ref: '#/components/schemas/SystemEvent'
          nullable: true
        page:
          type: integer
          description: Zero-based index of the page returned.
          minimum: 0
        pageSize:
          type: integer
          description: Maximum number of events returned on each page.
          minimum: 0
        totalCount:
          type: integer
          format: int64
          description: Total number of matching events across all pages.
          minimum: 0
        readCount:
          type: integer
          format: int64
          description: Number of matching events the user has already read.
          minimum: 0
        countBySeverityLevel:
          type: array
          description: Matching event count grouped by severity level.
          items:
            $ref: '#/components/schemas/SeverityCount'
          nullable: true
    SystemEventTypes:
      type: object
      description: >-
        The distinct categories and actions present in this Meshery Server's
        events. Two parallel string arrays, unlike Cloud's array of
        category/action pairs.
      required:
      - category
      - action
      properties:
        category:
          type: array
          description: Distinct event categories.
          items:
            type: string
            maxLength: 500
          nullable: true
        action:
          type: array
          description: Distinct event actions.
          items:
            type: string
            maxLength: 500
          nullable: true
