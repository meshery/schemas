          format: uri
          description: >
            Link that opens the design in the operator view, for example
            `<base>/extension/meshmap?mode=operator&type=view&design_id=<designId>`;
            omitted when the producer has no operator view to link.
          maxLength: 2048
          x-go-name: ViewLink
        status:
          type: string
          description: >
            Outcome of the operation as the producer reports it: `success`
