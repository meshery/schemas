        Event metadata names a design, it never carries one: never put design
        contents into event metadata - no `designFile`, `patternFile`,
        `components`, `relationships`, `trace`, `evaluationResponse`, the raw
        `summary` or `validationResult`. Meshery Server applies a 16 KB guard
        that drops oversized metadata down to these identity fields. Older
        Meshery Cloud rows may carry the legacy `design_name` and `view_link`
        keys instead of `designName` and `viewLink`; readers should fall back
        to them.
