openapi: 3.0.0
info:
  title: Events
  description: OpenAPI schema for Meshery events and system notifications.
  version: v1beta3
  contact:
    name: Meshery Maintainers
    email: maintainers@meshery.io
    url: https://meshery.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
tags:
- name: events
  description: APIs for Meshery Cloud events.
paths:
  /api/events/{eventId}:
    delete:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: deleteEvent
      summary: Delete a single event
      parameters:
      - $ref: '#/components/parameters/eventId'
      responses:
        '204':
          description: Event deleted
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          $ref: '#/components/responses/500'
  /api/events/delete:
    post:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: bulkDeleteEvents
      summary: Bulk delete events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequest'
      responses:
        '200':
          description: Events deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          $ref: '#/components/responses/500'
  /api/events/status:
    put:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: bulkUpdateEventStatus
      summary: Bulk update event status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateStatusRequest'
      responses:
        '200':
          description: Events updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateStatusResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          $ref: '#/components/responses/500'
  /api/events/{eventId}/status:
    put:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: updateEventStatus
      summary: Update status of a single event
      parameters:
      - $ref: '#/components/parameters/eventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventStatusRequest'
      responses:
        '200':
          description: Event status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateEventStatusResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          $ref: '#/components/responses/500'
  /api/workspaces/{workspaceId}/events:
    get:
      x-internal:
      - cloud
      tags:
      - events
      security:
      - jwt: []
      operationId: getEventsOfWorkspace
      summary: Get workspace events
      description: Gets events for a workspace.
      parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pagesizeLegacy'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/order'
      responses:
        '200':
          description: Workspace events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Workspace not found
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          description: Server error
  /api/events:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEventsAggregate
      summary: Get events aggregate summary
      parameters:
      - $ref: '#/components/parameters/cumulative'
      responses:
        '200':
          description: Events aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsAggregate'
        '401':
          description: Unauthorized
        '403':
          $ref: '#/components/responses/MeshkitError403'
        '404':
          description: Not found - the caller is not a provider-wide Provider Admin
          content:
            text/plain:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          description: Server error
    post:
      x-internal: ["cloud", "meshery"]
      tags:
      - events
      operationId: createEvent
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
      description: >
        Records an event and answers 201 with it. When the payload carries an
        `idempotencyKey` the authenticated caller already used, nothing new is
        recorded and the answer is 200 with the event first recorded under that
        key. The server assigns the organization from the session; clients do
        not send it.
      responses:
        '200':
          description: >
            An event with this `idempotencyKey` was already recorded by the same
            caller; it is returned unchanged and no new event is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          $ref: '#/components/responses/500'
  /api/events/list:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEvents
      summary: Get events list
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/eventsFilter'
      - $ref: '#/components/parameters/eventsScope'
      responses:
        '200':
          description: Events page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '401':
          description: Unauthorized
        '403':
          $ref: '#/components/responses/MeshkitError403'
        '404':
          description: Not found
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          description: Server error
  /api/events/summary:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEventSummaryByUser
      summary: Get event summary by user
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: Event summary page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSummaryPage'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          description: Server error
  /api/events/types:
    get:
      x-internal:
      - cloud
      tags:
      - events
      operationId: getEventTypes
      summary: Get event types
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pagesizeLegacy'
      responses:
        '200':
          description: Event types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '429':
          $ref: '#/components/responses/MeshkitError429'
        '500':
          description: Server error
components:
  responses:
    400:
      $ref: ../../v1beta2/core/api.yml#/components/responses/400
    401:
      $ref: ../../v1beta2/core/api.yml#/components/responses/401
    404:
      $ref: ../../v1beta2/core/api.yml#/components/responses/404
    MeshkitError429:
      $ref: "../../v1beta2/core/api.yml#/components/responses/MeshkitError429"
    500:
      $ref: ../../v1beta2/core/api.yml#/components/responses/500
    MeshkitError403:
      $ref: ../../v1beta2/core/api.yml#/components/responses/MeshkitError403
  parameters:
    eventId:
      name: eventId
      in: path
      description: ID of the event.
      required: true
      schema:
        type: string
        format: uuid
    workspaceId:
      name: workspaceId
      in: path
      description: Workspace ID
      schema:
        $ref: ../../v1beta2/core/api.yml#/components/schemas/WorkspaceId
      required: true
    page:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/page
    pageSize:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/pageSize
    pagesize:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/pagesize
    pagesizeLegacy:
      name: pagesize
      in: query
      description: Get responses by pagesize. Deprecated alias of pageSize.
      deprecated: true
      schema:
        type: integer
    search:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/search
    order:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/order
    cumulative:
      name: cumulative
      in: query
      description: When true, return cumulative aggregate counts across all time.
      required: false
      schema:
        type: boolean
    filter:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/filter
    eventsFilter:
      $ref: ../../v1beta2/core/api.yml#/components/parameters/filter
    eventsScope:
      name: scope
      in: query
      required: false
      description: >
        Which events are returned. `user` (default): only the caller's own
        events (unchanged behavior). `organization`: every member's events in
        the caller's session organization. Requires organization administration
        permission in the session organization; callers without it get 403.
      schema:
        type: string
        enum:
          - user
          - organization
        default: user
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EventPayload:
      type: object
      description: Payload for creating a new event.
      additionalProperties: true
      properties:
        owner:
          type: string
          format: uuid
          description: UUID of the user associated with the event.
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid
          x-go-name: Owner
          x-oapi-codegen-extra-tags:
            db: owner
            json: "owner,omitempty"
        category:
          type: string
          description: The category of the event.
          maxLength: 500
        action:
          type: string
          description: The action of the event.
          maxLength: 500
        description:
          type: string
          description: Description of the event.
          maxLength: 5000
        idempotencyKey:
          type: string
          description: >
            Optional client-chosen key that makes recording this event safe to
            retry. Keys are scoped to the authenticated caller (organization and
            user), never to the client-settable `owner` field, so `owner` may be
            omitted without affecting deduplication. The first event a caller
            records with a key is kept, and a later create with the same key
            records nothing and answers 200 with that event, whatever the rest of
            the payload says. Use a value that names the occurrence, for example
            a run id, so a client replaying a local queue after a timeout never
            records a duplicate. Omit it for events that need no deduplication.
          minLength: 1
          maxLength: 255
          x-oapi-codegen-extra-tags:
            json: "idempotencyKey,omitempty"
    UpdateEventStatusRequest:
      type: object
      description: Payload for updating the status of a single event.
      required:
      - status
      properties:
        status:
          type: string
          example: completed
          description: Current status of the event.
          maxLength: 255
    UpdateEventStatusResponse:
      type: object
      description: Response body returned after updating an event's status.
      properties:
        message:
          type: string
          description: Human-readable status message.
          maxLength: 500
        eventId:
          type: string
          format: uuid
          description: UUID of the event whose status was updated.
          x-oapi-codegen-extra-tags:
            json: "eventId,omitempty"
        status:
          type: string
          description: Updated status of the event.
          maxLength: 255
    BulkDeleteRequest:
      type: object
      description: Payload for bulk-deleting events by ID.
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: UUIDs of the events to delete.
    BulkDeleteResponse:
      type: object
      description: Response body returned after bulk event deletion.
      properties:
        deleted:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of events that were deleted.
    BulkUpdateStatusRequest:
      type: object
      description: Payload for bulk-updating the status of events.
      required:
      - ids
      - status
      properties:
        ids:
          type: array
          items:
            $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: UUIDs of the events to update.
        status:
          type: string
          example: failed
          description: New status to apply to the selected events.
          maxLength: 255
    BulkUpdateStatusResponse:
      type: object
      description: Response body returned after bulk event status update.
      properties:
        updated:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of events whose status was updated.
    EventResult:
      $ref: ./event.yaml
    Event:
      type: object
      description: >
        One recorded event (an `event_trackers` row) in the wire form MeshKit's
        `models/events.Event` serializes. Meshery Cloud returns these, for
        example, as the per-path failure records of a GitHub repository import
        (`importGithubRepository`, `errors`). Unlike EventResult, it carries no
        joined user profile fields.
      required:
        - id
        - actedUpon
        - action
        - category
        - description
        - metadata
        - operationId
        - severity
        - status
        - systemId
        - organizationId
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Id
          description: Event ID.
          x-oapi-codegen-extra-tags:
            db: id
          x-order: 7
        actedUpon:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Id
          description: ID of the entity on which the event was performed.
          x-oapi-codegen-extra-tags:
            db: acted_upon
          x-order: 1
        action:
          type: string
          description: Action taken on the resource, for example `import`.
          maxLength: 500
          x-oapi-codegen-extra-tags:
            db: action
          x-order: 2
        category:
          type: string
          description: Resource kind the operation was invoked on, for example `pattern`.
          maxLength: 500
          x-oapi-codegen-extra-tags:
            db: category
          x-order: 3
        description:
          type: string
          description: Human-readable summary of what happened.
          maxLength: 5000
          x-oapi-codegen-extra-tags:
            db: description
          x-order: 6
        metadata:
          type: object
          description: >
            Event-specific details; the structure varies by event kind. `null`
            when the producer attached none. It stays a free-form map; design
            events fill it with a named shape: RelationshipEvaluationEventMetadata
            (category `relationship`, action `evaluation`),
            DesignValidationEventMetadata (category `pattern`, actions
            `validate`, `deploy`, `undeploy`, `dry-run`) and
            DesignSavedEventMetadata (category `pattern`, actions `create`,
            `update`); DesignEventIdentity names the design. Never put design
            contents into event metadata - no `designFile`, `patternFile`,
            `components`, `relationships`, `trace`, `evaluationResponse`, the
            raw `summary` or `validationResult`. Meshery Server applies a 16 KB
            guard that drops oversized metadata down to the identity fields
            (`designId`, `designName`, `designVersion`, `designLink`,
            `viewLink`). On an error event, `metadata.error` holds only the
            MeshKit error, never the design or the request that failed. Older
            Meshery Cloud rows may carry the legacy `design_name` and
            `view_link` keys; readers should fall back to them when
            `designName` and `viewLink` are absent.
          additionalProperties: true
          nullable: true
          x-go-type: core.Map
          x-go-type-import:
            path: github.com/meshery/schemas/models/core
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            db: metadata
          x-order: 8
        operationId:
          # Core's OperationId component is not referenced: the Go generator
          # emits it as core.OperationId, ignoring its x-go-name, and models/core
          # only defines OperationID.
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Id
          description: ID correlating the events one operation emitted.
          x-go-name: OperationID
          x-oapi-codegen-extra-tags:
            db: operation_id
          x-order: 9
        severity:
          type: string
          description: >
            Event level. MeshKit's producers set one of `emergency`, `alert`,
            `critical`, `error`, `warning`, `informational`, `debug` or
            `success`. The set is not closed on the wire - the event write
            APIs persist the value they are given - so consumers must tolerate
            other values.
          maxLength: 255
          x-oapi-codegen-extra-tags:
            db: severity
          x-order: 12
        status:
          type: string
          description: >
            Read state of the event. MeshKit records new events as `unread`,
            and acknowledged ones become `read`; the event status APIs persist
            any value they are given, so consumers must tolerate other values.
          maxLength: 255
          x-oapi-codegen-extra-tags:
            db: status
          x-order: 13
        systemId:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/SystemId
          description: >
            ID of the system instance that emitted the event. A Meshery Server
            sends its server instance ID; an event the provider emits itself
            carries the nil UUID. A client that registered a connection for its
            machine (for example a desktop client) sets its connection ID, so
            an event that records a run names the computer that ran it and can
            be joined to the claim it released (`Claim.outcomeEventId`) and to
            the connection (`connections.id`). The value is asserted by the
            sender and is not checked against the caller's connections.
          x-order: 14
        owner:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: ID of the user the event belongs to; omitted when the event has no owner.
          x-oapi-codegen-extra-tags:
            db: owner
          x-order: 10
        organizationId:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Uuid
          description: >
            The organization the event belongs to. The server sets it: the
            organization selected in the session when a user action recorded
            the event, or the organization of the resource a system event
            refers to. Provider-level system events with no tenant belong to
            the provider organization. Never accepted from clients.
          readOnly: true
          x-go-name: OrganizationID
          x-go-type-skip-optional-pointer: true
          x-oapi-codegen-extra-tags:
            db: organization_id
            json: organizationId
          x-order: 11
        createdAt:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
          description: Timestamp when the event was recorded.
          x-oapi-codegen-extra-tags:
            db: created_at
          x-order: 4
        updatedAt:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Time
          description: Timestamp when the event was last updated.
          x-oapi-codegen-extra-tags:
            db: updated_at
          x-order: 15
        deletedAt:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/NullTime
          description: Timestamp when the event was soft-deleted; omitted when it was not.
          x-oapi-codegen-extra-tags:
            db: deleted_at
          x-order: 5
    EventsPage:
      type: object
      description: Paginated list of events.
      properties:
        page:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Number
          description: Zero-based page index returned in this response.
        pageSize:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Number
          description: Maximum number of items returned on each page.
          minimum: 1
          x-oapi-codegen-extra-tags:
            json: "pageSize,omitempty"
        totalCount:
          $ref: ../../v1beta2/core/api.yml#/components/schemas/Number
          description: Total number of items across all pages.
          minimum: 0
          x-oapi-codegen-extra-tags:
            json: "totalCount,omitempty"
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventResult'
          description: The events returned on the current page.
    EventsAggregate:
      type: object
      description: Aggregated event counts across categories.
      properties:
        audit:
          type: integer
          description: Count of audit-category events.
          minimum: 0
      additionalProperties: true
    EventSummary:
      type: object
      description: Per-user event summary entry.
      additionalProperties: true
    EventSummaryPage:
      type: object
      description: Paginated list of per-user event summaries.
      properties:
        page:
          type: integer
          description: Current page number of the result set.
          minimum: 0
        pageSize:
          type: integer
          description: Number of items per page.
          minimum: 1
          x-oapi-codegen-extra-tags:
            json: "pageSize,omitempty"
        totalCount:
          type: integer
          description: Total number of items available.
          minimum: 0
          x-oapi-codegen-extra-tags:
            json: "totalCount,omitempty"
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
          description: The event summaries returned on the current page.
    EventType:
      type: object
      description: A category/action pair describing one kind of event.
      properties:
        category:
          type: string
          description: The category of the event type.
          maxLength: 500
        action:
          type: string
          description: The action of the event type.
          maxLength: 500
    ErrorResponse:
      type: object
      description: Generic error envelope returned for non-2xx responses.
      properties:
        error:
          type: string
          description: Human-readable error message.
          maxLength: 500
    # Design event metadata shapes (meshery/meshery#22764). Each names the
    # `metadata` of one kind of design event. They are sub-shapes of
    # Event.metadata, which stays a free-form map, not standalone
    # constructs, so they have no `*Payload` twins: the producer builds and
    # the reader decodes the same shape (docs/design-event-metadata-contract.md).
    # The identity fields are restated in each shape, not composed with
    # allOf, so every generator emits one flat, closed type; the
    # validation/design_event_metadata_contract_test.go test pins them equal.
    DesignEventIdentity:
      type: object
      description: >
        The fields that identify the design a design event is about. Every
        design event that names a design carries them, and they are what
        remains when Meshery Server's 16 KB guard drops oversized metadata.
        Event metadata names a design, it never carries one: never put design
        contents into event metadata - no `designFile`, `patternFile`,
        `components`, `relationships`, `trace`, `evaluationResponse`, the raw
        `summary` or `validationResult`. Meshery Server applies a 16 KB guard
        that drops oversized metadata down to these identity fields. Older
        Meshery Cloud rows may carry the legacy `design_name` and `view_link`
        keys instead of `designName` and `viewLink`; readers should fall back
        to them.
      additionalProperties: false
      required:
        - designId
      properties:
        designId:
          type: string
          format: uuid
          description: ID of the design the event is about.
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/gofrs/uuid
          x-go-name: DesignID
        designName:
          type: string
          description: Name of the design when the event was recorded.
          maxLength: 255
          x-go-name: DesignName
        designVersion:
          type: string
          description: Version of the design when the event was recorded, for example `v0.0.3`; omitted when the producer does not know it.
          maxLength: 50
          x-go-name: DesignVersion
        designLink:
          type: string
          format: uri
          description: >
