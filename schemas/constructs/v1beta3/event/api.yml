    # Design event metadata shapes (meshery/meshery#22764). Each names the
    # `metadata` of one kind of design event. They are sub-shapes of
    # Event.metadata, which stays a free-form map, not standalone
    # constructs, so they have no `*Payload` twins: the producer builds and
    # the reader decodes the same shape (docs/design-event-metadata-contract.md).
    # The identity fields are restated in each shape, not composed with
    # allOf, so every generator emits one flat, closed type; the
    # validation/design_event_metadata_contract_test.go test pins them equal.
