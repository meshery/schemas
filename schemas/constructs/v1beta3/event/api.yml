          minItems: 1
          maxItems: 20
          items:
            $ref: ../error/api.yml#/components/schemas/ProbableCause
          x-go-type: "[]errorcodev1beta3.ProbableCause"
          x-go-type-import:
            path: github.com/meshery/schemas/models/v1beta3/errorcode
            name: errorcodev1beta3
          x-go-name: ProbableCauses
        matchedCauses:
          type: array
          description: >
            The causes most likely for this occurrence, most likely first, so
            a reader leads with their remediations. Each names a cause `id` of
            the definition and, when `probableCauses` is present, one of its
            causes. Omitted when the producer cannot tell which cause applies.
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/EventMatchedCause'
          x-go-name: MatchedCauses
        probableCause:
          type: array
          description: >
            The flat list of cause descriptions (MeshKit's `ProbableCause`).
            With `probableCauses`, it equals each cause's `description` in
            order; without, it is unpaired.
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 2000
          x-go-name: ProbableCause
        suggestedRemediation:
          type: array
          description: >
            The flat list of remediation descriptions (MeshKit's
            `SuggestedRemediation`). With `probableCauses`, it equals every
