            code's prefix is the component's name.
          x-go-name: Component
        severity:
          $ref: ../error/api.yml#/components/schemas/ErrorSeverity
          x-go-type: "*errorcodev1beta3.ErrorSeverity"
          x-go-type-import:
            path: github.com/meshery/schemas/models/v1beta3/errorcode
            name: errorcodev1beta3
          description: >
            The definition's severity. The event's own `severity` is the
            level this occurrence was recorded at.
          x-go-name: Severity
        shortDescription:
          type: string
          description: The definition's short description, rendered for this occurrence.
          maxLength: 1000
          x-go-name: ShortDescription
        longDescription:
          type: string
          description: The definition's long description, rendered for this occurrence.
          maxLength: 10000
          x-go-name: LongDescription
        probableCauses:
          type: array
          description: >
            The definition's causes that apply to this occurrence, each with
