    EventError:
      type: object
      description: >
        The `metadata.error` of an event that reports an error: one
        occurrence of an ErrorDefinition (the error construct). It carries
        the code, the descriptions as rendered for this occurrence, the
        causes and remediations that apply, which of those causes are likely
        this time (`matchedCauses`), and the values the descriptions were
        rendered from (`details`). It holds only the error, never the design,
        the request or the response that failed. A producer that has only
        MeshKit's flat lists sends `probableCause` and `suggestedRemediation`
        alone; such an error is unpaired, and nothing may pair the lists by
        position. A producer with the nested form sends `probableCauses` and
        should also send the flat lists derived from it, for readers that
        predate the nesting. Like every metadata shape it is a sub-shape of
        Event.metadata, which stays a free-form map, so it has no `*Payload`
        twin (docs/error-definition-contract.md).
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          description: >
            The full error code, for example `meshery-server-1033`, as the
            definition names it. Consumers must tolerate codes they do not
            know.
          minLength: 1
          maxLength: 255
          x-go-name: Code
