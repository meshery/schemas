type: object
additionalProperties: false
description: EventResult entity schema.
properties:
  visibility:
    type: string
    description: >-
      Who can see the event. `private` (the default, set by Layer5 Cloud)
      means visible only inside the event's organization. `public` means the
      event may appear on the unauthenticated event feed, subject to the
      owner's `shareActivityPublicly` preference at read time.
    enum:
    - private
    - public
    default: private
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: visibility
      json: visibility
  owner:
    type: string
    format: uuid
    description: UUID of the user associated with the event.
    x-go-type: uuid.UUID
    x-go-type-import:
      path: github.com/gofrs/uuid
    x-go-name: Owner
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: owner
      json: owner
  systemId:
    type: string
    description: >
      System identifier of the event source: a Meshery Server instance ID, the
      nil UUID for an event the provider emits itself, or the connection ID of
      the client machine that emitted it (for example a desktop client
      recording a run). Asserted by the sender, not checked.
    maxLength: 255
    x-id-format: external
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: system_id
      json: systemId
  organizationId:
    type: string
    format: uuid
    description: >
      The organization the event belongs to (see Event.organizationId). Set by
      the server; lets an organization-scope listing show each row's tenant.
    readOnly: true
    x-go-type: uuid.UUID
    x-go-type-import:
      path: github.com/gofrs/uuid
    x-go-name: OrganizationID
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: organization_id
      json: organizationId
  category:
    type: string
    description: The category of the event.
    maxLength: 500
  action:
    type: string
    description: The action of the event.
    maxLength: 500
  description:
    type: string
    description: Description of the event.
    maxLength: 5000
  firstName:
    type: string
    description: The first name of the user associated with the event.
    maxLength: 500
  lastName:
    type: string
    description: The last name of the user associated with the event.
    maxLength: 500
  avatarUrl:
    type: string
    format: uri
    maxLength: 500
    description: URL to the avatar image of the user associated with the event.
  email:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Email
    description: Email address of the user associated with the event.
  provider:
    $ref: ../../v1beta2/core/api.yml#/components/schemas/Provider
    description: Authentication provider of the user associated with the event.
  createdAt:
    type: string
    format: date-time
    description: Timestamp when the event was recorded.
    x-go-type: time.Time
    x-go-type-skip-optional-pointer: true
    x-oapi-codegen-extra-tags:
      db: created_at
      json: createdAt
  correlationKey:
    type: string
    description: Key of the ongoing condition the event records (see Event.correlationKey); omitted for an event that reports no condition.
    minLength: 1
    maxLength: 255
    x-oapi-codegen-extra-tags:
      db: correlation_key
  occurrenceCount:
    type: integer
    description: How many occurrences of the condition the event counts (see Event.occurrenceCount).
    minimum: 1
    x-oapi-codegen-extra-tags:
      db: occurrence_count
  firstSeenAt:
    type: string
    format: date-time
    description: When the condition's first counted occurrence was seen.
    x-oapi-codegen-extra-tags:
      db: first_seen_at
  lastSeenAt:
    type: string
    format: date-time
    description: When the condition's latest counted occurrence was seen.
    x-oapi-codegen-extra-tags:
      db: last_seen_at
  resolvedAt:
    type: string
    format: date-time
    description: When the condition cleared; omitted while it is open (see Event.resolvedAt).
    x-oapi-codegen-extra-tags:
      db: resolved_at
  source:
    type: string
    format: uri-reference
    description: Which surface emitted the event, for example `meshery-server` or `mesheryctl` (see Event.source).
    minLength: 1
    maxLength: 255
    x-oapi-codegen-extra-tags:
      db: source
  type:
    type: string
    description: CloudEvents-compatible `type`, for example `io.meshery.user.signup` (see Event.type).
    minLength: 1
    maxLength: 255
    x-oapi-codegen-extra-tags:
      db: type
  specversion:
    description: The CloudEvents specification version the event is compatible with (see Event.specversion).
    type: string
    enum:
      - "1.0"
    x-go-type: EventSpecVersion
    x-go-name: SpecVersion
    x-oapi-codegen-extra-tags:
      db: specversion
  traceId:
    type: string
    description: W3C Trace Context `trace-id` of the operation the event belongs to (see Event.traceId).
    minLength: 32
    maxLength: 32
    pattern: '^[0-9a-f]{32}$'
    x-id-format: external
    x-go-name: TraceID
    x-oapi-codegen-extra-tags:
      db: trace_id
  parentId:
    type: string
    description: W3C Trace Context `parent-id` of the sub-operation that emitted the event (see Event.parentId).
    minLength: 16
    maxLength: 16
    pattern: '^[0-9a-f]{16}$'
    x-id-format: external
    x-go-name: ParentID
    x-oapi-codegen-extra-tags:
      db: parent_id
required:
- owner
- category
- action
