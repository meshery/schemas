# HAND-MAINTAINED SCAFFOLD - not generator output.
#
# meshery-schemas Rust crate (pilot). The construct modules under src/
# (src/key/ today) are machine-generated by build/generate-rust.js with
# progenitor - do not edit them by hand. This file owns the crate identity,
# its dependencies and features; src/lib.rs declares the construct modules.
#
# [dependencies] must declare, verbatim, every line the generated code needs
# (recorded per construct in .rust-gen-manifest.json). `make generate-rust`
# and tests/generate-rust.test.js fail with the exact line when one is
# missing or has changed.
#
# Version note: 0.1.0 is a pilot placeholder, like the Python distribution's.
# A later phase sets it from the release tag in lockstep with the npm, Go and
# PyPI releases; nothing publishes this crate yet.

[package]
name = "meshery-schemas"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Rust models and a typed client generated from the Meshery schemas OpenAPI constructs."
license = "Apache-2.0"
repository = "https://github.com/meshery/schemas"
homepage = "https://schemas.meshery.io"
documentation = "https://docs.rs/meshery-schemas"
readme = "README.md"
keywords = ["meshery", "openapi", "client", "layer5"]
categories = ["api-bindings"]
# Tests read the construct templates from the repository, so only the
# library itself is packaged.
include = ["Cargo.toml", "README.md", "src/**/*.rs"]

[lib]
name = "meshery_schemas"

[features]
default = []
# The generated client uses reqwest without a TLS backend, so on native
# targets `https://` base URLs need one of these (or a TLS feature enabled on
# your own reqwest dependency). On wasm32 the browser's fetch provides TLS.
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
progenitor-client = "0.17.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
