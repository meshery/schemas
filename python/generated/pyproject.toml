# HAND-MAINTAINED SCAFFOLD - not generator output.
#
# meshery-schemas Python distribution (pilot, issue #1240). The client code
# under src/ is machine-generated by build/generate-python.js - do not edit
# it by hand. This file owns the distribution identity and build backend.
# The pinned generator (openapi-python-client 0.29.1) cannot emit a
# hatchling project itself, so generation runs with --meta none into staging
# and this file wraps the assembled tree.
#
# Version note: 0.1.0 is a pilot placeholder. Phase 4 of #1240 sets the
# version from the release tag in lockstep with the npm and Go releases.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshery-schemas"
version = "0.1.0"
description = "Typed Python clients generated from the Meshery schemas OpenAPI constructs."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.23.1,<0.29.0",
  "attrs>=22.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meshery_schemas"]
